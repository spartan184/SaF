;-------------------------------------------------------
; This file contains the 3 erebor garrisoned warriors and the archer, for the Escalation upgrade
;-------------------------------------------------------
Object DwarfGarrisonedWarrior		;ends up unused since we don't want randomisation but perfect distribution in our hordes

	SelectPortrait	= UPDwarf_Warrior

	Draw = W3DScriptedModelDraw ModuleTag_01  
		DefaultModelConditionState
			Model               = duwarriorGA_skn
		End
	End

	;***** IMPORTANT NOTE! ***************************************************************	
	;Certain Upgrades and costs may need to be propagated from here. One example was veterancy
	;overlays.
	;*************************************************************************************	

	Side = Dwarves
	EditorSorting = UNIT
	BuildVariations = DwarfGarrisonedWarrior1 DwarfGarrisonedWarrior2 DwarfGarrisonedWarrior3
	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY SCORE GRAB_AND_DROP THROWN_OBJECT
	
  ;Shadow = SHADOW_DECAL
  ;ShadowSizeX = 24;
  ;ShadowSizeY = 24;
  ;ShadowTexture = ShadowI;
  
  

End

;-------------------------------------------------------
; Axe + shield warrior
;-------------------------------------------------------
Object DwarfGarrisonedWarrior1

	SelectPortrait	= UPDwarf_Warrior
	Draw = W3DHordeModelDraw ModuleTag_01
		
		
		RandomTexture = dugarrison1.tga 0 dugarrison1.tga
		RandomTexture = dugarrison2.tga 0 dugarrison1.tga
		RandomTexture = dugarrison3.tga 0 dugarrison1.tga
		RandomTexture = dugarrison4.tga 0 dugarrison1.tga
	
		
		DefaultModelConditionState
			Model               = duWarriorGA_SKN
		End

		; --- Idle Anims
		IdleAnimationState
			StateName = Idle				
			Animation           = IDLB
				AnimationName     = dUCaptain_SKL.dUCaptain_IDLB
				AnimationMode     = ONCE
				AnimationPriority   = 20
			End			
			Animation           = IDLD
				AnimationName     = dUCaptain_SKL.dUCaptain_IDLD
				AnimationMode     = ONCE
				AnimationPriority   = 1
			End			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Selected" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle") end
			EndScript			
		End
		
		AnimationState        = STUNNED_FLAILING 
			Flags               = RANDOMSTART
			Animation           = dUCaptain_FLYA
				AnimationName     = dUCaptain_SKL.dUCaptain_FLYA
				AnimationMode     = LOOP
			End
		End


		; --- Dying anims
		
		AnimationState        = DYING SPLATTED
			Animation           = dUCaptain_LNDA
				AnimationName     = dUCaptain_SKL.dUCaptain_LNDA
				AnimationMode     = ONCE
			End
		End
		AnimationState        = DYING
			Animation           = ducaptain_DIEA
				AnimationName     = ducaptain_SKL.ducaptain_DIEA
				AnimationMode     = ONCE
			End
				Animation           = ducaptain_DIEB
				AnimationName     = ducaptain_SKL.ducaptain_DIEB
				AnimationMode     = ONCE
			End
		End
		
		; --- Stunned anims
		AnimationState        = STUNNED_STANDING_UP
			Animation           = ducaptain_GTPA
				AnimationName     = ducaptain_SKL.ducaptain_GTPA
				AnimationMode     = ONCE
				AnimationSpeedFactorRange = 1.3 1.3
			End
		End
		AnimationState        = STUNNED 
			Animation           = ducaptain_LNDA
				AnimationName     = ducaptain_SKL.ducaptain_LNDA
				AnimationMode     = ONCE
			End
		End
		
		; --- Moving Anims	
		
		AnimationState        = MOVING FIRING_OR_PREATTACK_A
			ShareAnimation		= Yes
			Animation           = RunAndFire
				AnimationName       = ducaptain_SKL.ducaptain_ATRA
				AnimationMode       = LOOP
			End
			Flags               = RANDOMSTART  
		End
		
		
		AnimationState        = MOVING
			;ParticleSysBone     = None InfantryDustTrails
			Flags               = RANDOMSTART
			Animation           = ducaptain_RUNA
				AnimationName     = ducaptain_SKL.ducaptain_RUNA
				AnimationMode     = LOOP
			End
			Animation           = ducaptain_RUNB
				AnimationName     = ducaptain_SKL.ducaptain_RUNB
				AnimationMode     = LOOP
			End
		End
		
		

		; Attacking Anims [Weapon_A]
		AnimationState        = FIRING_OR_PREATTACK_A WEAPONSTATE_CLOSE_RANGE
			StateName           = WithSword
			Animation           = ATKA
				AnimationName     = ducaptain_SKL.ducaptain_ATKA
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			Animation           = ATKB
				AnimationName    = ducaptain_SKL.ducaptain_ATKB
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
		End

		AnimationState        = FIRING_OR_PREATTACK_A
			Animation           = ducaptain_ATKA
				AnimationName     = ducaptain_SKL.ducaptain_ATKA 
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			Animation           = ducaptain_ATKB
				AnimationName     = ducaptain_SKL.ducaptain_ATKB 
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
		End

		; ATTACKING
		AnimationState        = ATTACKING
			Animation           = ALERT_1
				AnimationName     = ducaptain_SKL.ducaptain_IDLA
				AnimationMode     = LOOP; ONCE
			End
;			Flags               = RESTART_ANIM_WHEN_COMPLETE ; acts like an idle animation & keeps running the animations.
		End
		
		; --------- Selected Anims and Transitions
		TransitionState					=	TRANS_Idle_to_Selected
			Animation					=	ATNA
				AnimationName			=	ducaptain_SKL.ducaptain_ATNA
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_Selected_To_Idle
			Animation					=	ATNC
				AnimationName			=	ducaptain_SKL.ducaptain_ATNC
				AnimationMode			=	ONCE
			End
		End
		
		AnimationState				= LEVELED 						; This state clears itself in 3 seconds
			Animation				= LevelUp
				AnimationName		= ducaptain_SKL.ducaptain_CHRA
				AnimationMode		= ONCE
			End
		End

		AnimationState				=	SELECTED
			StateName				=	Selected
			SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	ducaptain_SKL.ducaptain_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected") end
			EndScript
		End
		
		;------------emotions---------------
		AnimationState						= EMOTION_POINTING
			Animation				= CHRA
				AnimationName		= ducaptain_SKL.ducaptain_CHRA
				AnimationMode		= LOOP	;ONCE
			End
		;	Flags				=	RESTART_ANIM_WHEN_COMPLETE
		End
		
		AnimationState			= EMOTION_CELEBRATING
			Animation           = CHRA
				AnimationName   = ducaptain_SKL.ducaptain_CHRA
				AnimationMode   = LOOP		;ONCE
			End
		;	Flags				=	RESTART_ANIM_WHEN_COMPLETE
		End
		
		AnimationState = MOVING BACKING_UP
			Animation = Moving_Back
				AnimationName = ducaptain_SKL.ducaptain_BAKA	
				AnimationMode = LOOP
			End	
		End
		
	;	AnimationState					= EMOTION_ALERT EMOTION_MORALE_HIGH
	;		Animation					= Taunting
	;			AnimationName			=  ducaptain_SKL.ducaptain_TNTB		;does not exist
	;			AnimationMode			= ONCE
	;		End
	;		Flags						= RANDOMSTART RESTART_ANIM_WHEN_COMPLETE
	;	End
		
		; READY IDLE
		AnimationState        = EMOTION_ALERT
			Animation           = ALERT_1
				AnimationName     = ducaptain_SKL.ducaptain_IDLA
				AnimationMode     = LOOP ;ONCE
			End
;			Flags               = RESTART_ANIM_WHEN_COMPLETE ; acts like an idle animation & keeps running the animations.
		End
		
		
		; --------- Click and Hit Reactions ------------
		AnimationState = HIT_REACTION HIT_LEVEL_1
			Animation = Hit_Level_1_a
				AnimationName = ducaptain_SKL.ducaptain_HITA	
				AnimationMode = ONCE
			End
		End		

	End
	


	; ***DESIGN parameters ***
	Side = Dwarves
	EditorSorting = UNIT
	ThreatLevel = 1.0
	TransportSlotCount = 1
	
	BountyValue = M_DWARVES_WARRIOR_BOUNTY_VALUE
	
	; --- Standard weapon set
	WeaponSet
		Conditions = None 
		Weapon = PRIMARY   DwarfWarriorAxe
		AutoChooseSources = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	; --- upgraded weapon set
	WeaponSet
		Conditions			= PLAYER_UPGRADE
		Weapon				= PRIMARY	DwarfWarriorAxeUpgraded
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	; --- Standard armor set
	ArmorSet
		Conditions      = None
		Armor           = DwarfWarriorArmor
		DamageFX        = NormalDamageFX
	End
	; --- Heavy armor set
	ArmorSet
		Conditions      = PLAYER_UPGRADE
		Armor           = DwarfWarriorHeavyArmor
		DamageFX        = NormalDamageFX
	End
	
	VisionRange = M_VISION_STANDARD_DWARF
	ShroudClearingRange = M_SHROUD_CLEAR_STANDARD

	DisplayName = OBJECT:DwarfGarrisonedWarrior
	
	CrushableLevel = 0

	CommandPoints = 0
	
	CommandSet = DwarfWarriorCommandSet


	; *** AUDIO Parameters ***;

	VoiceCombineWithHorde 	= GondorBannerVoiceJoin
    VoiceCreated		= GondorBannerVoiceSalute
	VoiceMove			= GondorBannerVoiceMove
	VoicePriority		= 8
	VoiceSelect			= GondorBannerVoiceSelect
	VoiceSelect2		= GondorBannerVoiceSelect2


	EvaEventDamagedOwner			= UnitUnderAttack 		;Eva event to trigger when unit is damaged
	
	; Tie into LargeGroupAudio system
		Behavior = LargeGroupAudioUpdate ModuleTag_LGAU
			Key = Human Unit Infantry
		End

	; *** ENGINEERING Parameters ***
	RadarPriority = UNIT
	ThingClass = HORDE_UNIT

	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY SCORE GRAB_AND_DROP THROWN_OBJECT
	
	Body = ActiveBody ModuleTag_02
		CheerRadius = M_EMOTION_CHEER_RADIUS
		
		MaxHealth	        = M_DWARVES_WARRIOR_HEALTH
		MaxHealthDamaged	= M_DWARVES_WARRIOR_HEALTH_DAMAGED
	End

	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle	= Yes ATTACK_BUILDINGS
		AILuaEventsList				= DwarfWarrior1Functions
		AttackPriority				= AttackPriority_Infantry
	End

    LocomotorSet
		Locomotor = HumanLocomotor
		Condition = SET_NORMAL 
		Speed     = M_DWARVES_INFANTRY_MEMBER_SPEED		
	End


	Behavior = PhysicsBehavior ModuleTag_04
		GravityMult = 1.0
	End
	Behavior = SquishCollide ModuleTag_06
		;nothing
	End
	Behavior = HordeMemberCollide ModuleTag_HMC
		;nothing
	End
	
	
	; ----------------  Upgrades ---------------- ;
	
	Behavior = WeaponSetUpgrade WeaponSetUpgradeModuleTag
		TriggeredBy = Upgrade_TechnologyDwarvesMetallurgy
	End
	
	Behavior = ArmorUpgrade ArmorUpgradeModuleTag
		TriggeredBy = Upgrade_TechnologyDwarvesHeavyArmor
		ArmorSetFlag			= PLAYER_UPGRADE
	End
	
	Behavior = SubObjectsUpgrade ForgedBlade_Upgrade
		TriggeredBy		= Upgrade_TechnologyDwarvesMetallurgy
		ShowSubObjects	= Forged_Axe
	End	
	Behavior = SubObjectsUpgrade Armor_Upgrade
		TriggeredBy		= Upgrade_TechnologyDwarvesHeavyArmor
		UpgradeTexture	= dudwarr1lt.tga 0 dudwarr1.tga
		UpgradeTexture	= dudwarr2lt.tga 0 dudwarr2.tga
		UpgradeTexture	= dudwarr3lt.tga 0 dudwarr3.tga
		UpgradeTexture	= dudwarr4lt.tga 0 dudwarr4.tga
		UpgradeTexture	= dudwarr5lt.tga 0 dudwarr5.tga
		UpgradeTexture	= dudwarr6lt.tga 0 dudwarr6.tga 
	End
	
	; For the fear immunity Stout Hearts spellbook
	Behavior = AttributeModifierUpgrade ModuleTag_Stouthearts
		TriggeredBy = Upgrade_StoutHearts
		AttributeModifier = FearlessForever
	End
	
	Behavior = AttributeModifierUpgrade ModuleTag_AMU
		TriggeredBy = Upgrade_GondorFighterFearless
		AttributeModifier = FearlessForever
	End
	
	Behavior = SlowDeathBehavior ModuleTag_05
		DeathTypes = ALL -KNOCKBACK
		SinkDelay = 3000
		SinkRate = 0.5     ; in Dist/Sec
		DestructionDelay = 15000
            Sound = INITIAL GimliVoiceDie
	End

	
	Behavior = BezierProjectileBehavior ModuleTag_08 ; Module starts asleep, and wakes up when thrown.
		; 
		FirstHeight = 25  ; Height of Bezier control points above highest intervening terrain
		SecondHeight = 25
		FirstPercentIndent = 30% ; Percentage of shot distance control points are placed
		SecondPercentIndent = 70%
		TumbleRandomly = Yes

		CrushStyle = Yes ; I don't detonate, I just hit
		DieOnImpact = Yes
		BounceCount = 1   ; When I hit the ground, I'll arc again
		BounceDistance = 41 ; this far
		BounceFirstHeight = 25  ; Height of Bezier control points above highest intervening terrain
		BounceSecondHeight = 25
		BounceFirstPercentIndent = 20% ; Percentage of shot distance control points are placed
		BounceSecondPercentIndent = 80%

		GroundHitFX       = FX_ThrownRockGroundHit
		GroundBounceFX    = FX_ThrownRockBounceHit
	End
	
	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	400		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
		AfraidOf					=	NONE +RohanTreeBerd +GondorGwaihir +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorFellBeast +MordorMumakil;Must be SCARY kindof as well.
		AlwaysAfraidOf				=	NONE +MordorBalrog +RohanOathbreaker +MordorWitchKing +MordorWitchKingOnFellBeast
		PointAt						=	NONE +GondorGwaihir 

		HeroScanDistance			=	150
		FearScanDistance			=	200

		AddEmotion	=	Terror_Base
		AddEmotion	=	Doom_Base
		AddEmotion	=	FearIdle_Base
		AddEmotion	=	FearBusy_Base
		AddEmotion	=	Point_Base
		AddEmotion	=	Taunt_Base	
		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	

	Behavior = SlavedUpdate ModuleTag_Bodyguards
		GuardMaxRange		= 130

	End
	
	Geometry = CYLINDER
	GeometryMajorRadius = 8.0
	GeometryMinorRadius = 8.0
	GeometryHeight = 19.2
	GeometryIsSmall = Yes
	;Shadow                = SHADOW_VOLUME
	Shadow = SHADOW_DECAL
	ShadowSizeX = 14;
	ShadowSizeY = 14;
	ShadowTexture = ShadowI;
End


