;-------------------------------------------------------
; Garrisoned Archer
;-------------------------------------------------------
Object DwarfGarrisonedArcher

	; *** ART Parameters ***

	SelectPortrait         = UPDwarf_Archer
;	SelectPortrait         = SP_Gondor_Swordman

	Draw = W3DHordeModelDraw ModuleTag_01
		OkToChangeModelColor = Yes	
		StaticModelLODMode = Yes
		
		RandomTexture = dugarrison1.tga 0 dugarrison1.tga
		RandomTexture = dugarrison2.tga 0 dugarrison1.tga
		RandomTexture = dugarrison3.tga 0 dugarrison1.tga
		RandomTexture = dugarrison4.tga 0 dugarrison1.tga

;;=================== MODELS ============================================================
; --------- With Bow ------------
; Bah, must come first even though all the other bow stuff is below the sword stuff
		DefaultModelConditionState
			Model							= duarcherG_skn
			Skeleton               = EUArcher_SKL
			WeaponLaunchBone			=	PRIMARY ARROWNOCK
		End

; -- Animations
		IdleAnimationState
			StateName					=   STATE_Idle
			Animation = IdleA
				AnimationName			=	EUArcher_IDLA 
				AnimationPriority		=	6
				AnimationSpeedFactorRange = 0.7 1.3
			End
			;*** Repeat IDLA because animation priorities will not choose same animation twice so it can alternate between first two mostly.
			Animation = IdleA	
				AnimationName			=	EUArcher_IDLA 
				AnimationPriority		=	6
				AnimationSpeedFactorRange = 0.7 1.3
			End
			Animation = IdleB
				AnimationName			=	EUArcher_IDLB
				AnimationPriority		=	1
				AnimationSpeedFactorRange = 0.7 1.3
				AnimationBlendTime		= 8
			End
			Animation = IdleC
				AnimationName			=	EUArcher_IDLC
				AnimationPriority		=	1
