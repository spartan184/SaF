		;		AnimationMode		= ONCE
		;	End
		;	BeginScript
		;		CurDrawableHideSubObject("BOX03")
		;	EndScript
		;End

		AnimationState				=	SELECTED
			StateName				=	Selected
			SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	eumdrgnslr_skl.eumdrgnslr_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				CurDrawableHideSubObject("BOX03")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected") end
			EndScript
		End
		
		; ---- NEED CHEER AND TAUNT ANIMATION
		;------------emotions---------------
		;AnimationState				= EMOTION_POINTING
		;	Animation				= CHRA
		;		AnimationName		= eumdrgnslr_skl.RUGimli_CHRA
