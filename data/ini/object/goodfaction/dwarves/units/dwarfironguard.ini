				AnimationMode     = LOOP; ONCE
			End
			BeginScript
				CurDrawableHideSubObject("BOX03")
			EndScript
			;ParticleSysBone           = B_HANDL IronGuardHandsFX FollowBone:Yes
			;ParticleSysBone           = B_HANDR IronGuardHandsFX FollowBone:Yes	
			;ParticleSysBone           = B_SWORDBONE01 IronGuardSwordsFX FollowBone:Yes
