	; ***DESIGN parameters ***
	Side = Dwarves
	EditorSorting = UNIT
	ThreatLevel = 1.0
	TransportSlotCount = 1
	
	BountyValue = M_DWARVES_IRONGUARD_BOUNTY_VALUE
	
	WeaponSet
		Conditions 			= None 
		Weapon				= PRIMARY   DwarfIronGuardAxe	
		AutoChooseSources 	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	
	ArmorSet
		Conditions      = None
		Armor           = DwarfIronGuardArmor
		DamageFX        = NormalDamageFX
	End
	
	ArmorSet
		Conditions      = PLAYER_UPGRADE
		Armor           = DwarfIronGuardHeavyArmor
		DamageFX        = NormalDamageFX
	End
	
	
	VisionRange = M_VISION_STANDARD_DWARF
	ShroudClearingRange = M_SHROUD_CLEAR_STANDARD

	DisplayName = OBJECT:DwarfIronGuard
	CrushableLevel = 0
	CommandPoints = 7
	CommandSet = EmptyCommandSet

	; *** AUDIO Parameters ***;

	VoiceAmbushed			= DwarfIronGuardVoiceAmbushed
	VoiceAttack				= DwarfIronGuardVoiceAttack
	VoiceAttack2			= DwarfIronGuardVoiceAttack
	VoiceAttackCharge		= DwarfIronGuardVoiceAttackCharge
	VoiceAttackStructure	= DwarfIronGuardVoiceAttackBuilding
	VoiceAttackMachine		= DwarfIronGuardVoiceAttackBuilding
	VoiceCreated			= DwarfIronGuardVoiceSalute
	VoiceFullyCreated 		= DwarfIronGuardVoiceSalute
	VoiceMove				= DwarfIronGuardVoiceMove
	VoiceMove2				= DwarfIronGuardVoiceMove
	VoiceMoveToCamp			= DwarfIronGuardVoiceMoveCamp
	VoiceRetreatToCastle	= DwarfIronGuardVoiceRetreat
	VoiceMoveWhileAttacking	= DwarfIronGuardVoiceDisengage
	VoicePriority			= 18
	VoiceSelect				= DwarfIronGuardVoiceSelect
	VoiceSelect2			= DwarfIronGuardVoiceSelect
	VoiceSelectBattle 		= DwarfIronGuardVoiceSelectBattle
	VoiceGuard				= DwarfIronGuardVoiceMove
	
	VoiceEnterStateAttack				= DwarfIronGuardVoiceEnterStateAttack
	VoiceEnterStateAttackCharge			= DwarfIronGuardVoiceEnterStateAttackCharge	
	VoiceEnterStateAttackStructure		= DwarfIronGuardVoiceEnterStateAttackBuilding
	VoiceEnterStateAttackMachine		= DwarfIronGuardVoiceEnterStateAttackBuilding
	VoiceEnterStateMove					= DwarfIronGuardVoiceEnterStateMove
	VoiceEnterStateMoveToCamp			= DwarfIronGuardVoiceEnterStateMoveCamp
	VoiceEnterStateMoveWhileAttacking	= DwarfIronGuardVoiceEnterStateDisengage
	
	VoiceEnterStateRetreatToCastle		= DwarfIronGuardVoiceEnterStateRetreat
	
	UnitSpecificSounds
		VoiceEnter			= DwarfIronGuardVoiceGarrison
	End


	EvaEventDamagedOwner			= UnitUnderAttack 		;Eva event to trigger when unit is damaged
	
	; Tie into LargeGroupAudio system
		Behavior = LargeGroupAudioUpdate ModuleTag_LGAU
			Key = Human Unit Infantry
		End

	; *** ENGINEERING Parameters ***
	RadarPriority = UNIT
	ThingClass = HORDE_UNIT

	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY SCORE GRAB_AND_DROP THROWN_OBJECT
	
	Body = ActiveBody ModuleTag_02
		CheerRadius = M_EMOTION_CHEER_RADIUS
		
		MaxHealth	        = M_DWARVES_IRONGUARD_HEALTH
		MaxHealthDamaged	= M_DWARVES_IRONGUARD_HEALTH_DAMAGED
	End

	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle	= Yes ATTACK_BUILDINGS
		AILuaEventsList				= DwarfIronGuardFunctions
		AttackPriority				= AttackPriority_Infantry
	End

    LocomotorSet
		Locomotor = IronGuardLocomotor
		Condition = SET_NORMAL 
		Speed     = M_DWARVES_FAST_INFANTRY_MEMBER_SPEED		
	End


	Behavior = PhysicsBehavior ModuleTag_04
		GravityMult = 1.0
	End
	Behavior = SquishCollide ModuleTag_06
		;nothing
	End
	Behavior = HordeMemberCollide ModuleTag_HMC
		;nothing
	End
	
	Behavior = AttributeModifierUpgrade ModuleTag_Res
		AttributeModifier = DwarfResilience
	End
	
	Behavior = AttributeModifierUpgrade ModuleTag_ImprovedRes
		TriggeredBy = Upgrade_DwarvesHeavyArmor
		AttributeModifier = DwarfmprovedResilience
	End
	
	; -- Forged Blades
	Behavior = WeaponSetUpgrade WeaponSetUpgradeModuleTag
		TriggeredBy = Upgrade_DwarvesMetallurgy
		RequiresAllTriggers = Yes
	End
	
	Behavior = SubObjectsUpgrade ForgedBlade_Upgrade
		TriggeredBy		= Upgrade_DwarvesMetallurgy
		ShowSubObjects	= Forged_Blade
	End	
	; -- Heavy armour
	Behavior = ArmorUpgrade ArmorUpgradeModuleTag
		TriggeredBy = Upgrade_DwarvesHeavyArmor
		ArmorSetFlag			= PLAYER_UPGRADE
		
	End
	Behavior = SubObjectsUpgrade Armor_Upgrade
		TriggeredBy		= Upgrade_DwarvesHeavyArmor
		UpgradeTexture	= duirongrd1.tga 0 duirongrdha1.tga
		UpgradeTexture	= duirongrd2.tga 0 duirongrdha2.tga
		UpgradeTexture	= duirongrd3.tga 0 duirongrdha3.tga
		UpgradeTexture	= duirongrd4.tga 0 duirongrdha4.tga
	End
	
	; For the fear immunity Stout Hearts spellbook
	Behavior = AttributeModifierUpgrade ModuleTag_Stouthearts
		TriggeredBy = Upgrade_StoutHearts
		AttributeModifier = FearlessForever
	End
	
	; -- Become fearless at L2
	Behavior = AttributeModifierUpgrade ModuleTag_AMU
		TriggeredBy = Upgrade_UnitFear
		AttributeModifier = FearlessForever
	End
	
	Behavior = SlowDeathBehavior ModuleTag_05
		DeathTypes = ALL -KNOCKBACK
		SinkDelay = 3000
		SinkRate = 0.5     ; in Dist/Sec
		DestructionDelay = 15000
            Sound = INITIAL GimliVoiceDie
	End

	
	Behavior = BezierProjectileBehavior ModuleTag_08 ; Module starts asleep, and wakes up when thrown.
		; 
		FirstHeight = 25  ; Height of Bezier control points above highest intervening terrain
		SecondHeight = 25
		FirstPercentIndent = 30% ; Percentage of shot distance control points are placed
		SecondPercentIndent = 70%
		TumbleRandomly = Yes

		CrushStyle = Yes ; I don't detonate, I just hit
		DieOnImpact = Yes
		BounceCount = 1   ; When I hit the ground, I'll arc again
		BounceDistance = 41 ; this far
		BounceFirstHeight = 25  ; Height of Bezier control points above highest intervening terrain
		BounceSecondHeight = 25
		BounceFirstPercentIndent = 20% ; Percentage of shot distance control points are placed
		BounceSecondPercentIndent = 80%

		GroundHitFX       = FX_ThrownRockGroundHit
		GroundBounceFX    = FX_ThrownRockBounceHit
	End
	
	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	400		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
		AfraidOf					=	NONE +RohanTreeBerd +GondorGwaihir +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorFellBeast +MordorMumakil;Must be SCARY kindof as well.
		AlwaysAfraidOf				=	NONE +MordorBalrog +RohanOathbreaker +MordorWitchKing +MordorWitchKingOnFellBeast
		PointAt						=	NONE +GondorGwaihir 

		HeroScanDistance			=	150
		FearScanDistance			=	200

		AddEmotion	=	Terror_Base
		AddEmotion	=	Doom_Base
		AddEmotion	=	FearIdle_Base
		AddEmotion	=	FearBusy_Base
		AddEmotion	=	Point_Base
		AddEmotion	=	Taunt_Base	
		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	

	Geometry = CYLINDER
	GeometryMajorRadius = 8.0
	GeometryMinorRadius = 8.0
	GeometryHeight = 19.2
	GeometryIsSmall = Yes
	
	Shadow = SHADOW_DECAL
	ShadowSizeX = 14;
	ShadowSizeY = 14;
	ShadowTexture = ShadowI;
