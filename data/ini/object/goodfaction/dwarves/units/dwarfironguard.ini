		AnimationState        = FIRING_OR_PREATTACK_A
			Animation             = ATKA
				AnimationName     = eumdrgnslr_skl.eumdrgnslr_ATKA
				AnimationMode     = ONCE
				UseWeaponTiming	  = Yes
			End
			Animation             = ATKB
				AnimationName     = eumdrgnslr_skl.eumdrgnslr_ATKB
				AnimationMode     = ONCE
				UseWeaponTiming	  = Yes
			End
			Animation             = ATKC
				AnimationName     = eumdrgnslr_skl.eumdrgnslr_ATKC
