Object IronHillRider
	; *** ART Parameters ***
  SelectPortrait                      = UPIronHillsRiders
  ButtonImage		                      = UIIronHillsRiders

	Draw                                = W3DHordeModelDraw ModuleTag_01
	  OkToChangeModelColor              = Yes
		WadingParticleSys                 = WaterRipplesTrail  ; used when the unit is wading in shallow water.
		;--------------------------------------------------
		; new method
		ParticlesAttachedToAnimatedBones  = yes
		
		; Spear.
		DefaultModelConditionState
			Model				                    = duramrider_skn
		End
    ; -- ANIMATIONS

        IdleAnimationState
            StateName                =    Idle
            Animation                =    IdleB
                AnimationName        =    RURohrm_SKL.RURohrm_IDLB
                AnimationMode        =    ONCE
                AnimationBlendTime    =    15
            End
            BeginScript
                Prev = CurDrawablePrevAnimationState()
                if Prev == "State_Selected" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle") end
            EndScript
        End
                
        AnimationState                =    PASSENGER
            Animation                =    grabbed
                AnimationName        =    RURohrm_SKL.RURohrm_GBDA
                AnimationMode        =    LOOP
            End
        End
        
        ; --- stunned anims
        AnimationState                =    FREEFALL 
            Animation                =    free fall
                AnimationName        =    RURohrm_SKL.RURohrm_FLYB
                AnimationMode        =    LOOP
                AnimationBlendTime    =    10
            End
        End
        
        AnimationState                =    STUNNED_FLAILING 
            Animation                =    JustDie
                AnimationName        =    RURohrm_SKL.RURohrm_FLYC
                AnimationMode        =    LOOP
            End
            Flags                    =    RANDOMSTART
        End

        ; This is the no-spawn-horse type of death
        AnimationState                =    DYING DEATH_1 SPLATTED
            Animation                =    splatted
                AnimationName        =    RURohrm_SKL.RURohrm_LNDA
                AnimationMode        =    ONCE
                AnimationBlendTime  =   2
            End
            FXEvent    = Frame:2 Name:FX_SplatDust
        End
        
        

        AnimationState                =    DYING DEATH_1 
            Animation                =    JustDie
                AnimationName        =    RURohrm_SKL.RURohrm_DIEA
                AnimationMode        =    ONCE
            End
        End
        
        AnimationState                =    DYING DEATH_2 
            Animation                =    FadeOut
                AnimationName        =    RURohrm_SKL.RURohrm_IDLB
                AnimationMode        =    ONCE
            End
        End
        
        AnimationState                =    STUNNED_STANDING_UP
            Animation                =    StandUp
                AnimationName        =    RURohrm_SKL.RURohrm_GTPA
                AnimationMode        =    ONCE
                AnimationSpeedFactorRange = 1.5 1.5
            End
        End
        
        AnimationState                =    STUNNED
            Animation                =    Land
                AnimationName        =    RURohrm_SKL.RURohrm_LNDA
                AnimationMode        =    ONCE
            End
        End
        
        
                
        AnimationState        = MOVING FIRING_OR_PREATTACK_A
            ShareAnimation        = Yes
            Animation           = TrotAndFire
                AnimationName       = RURohrm_SKL.RURohrm_ATRB
                AnimationMode       = LOOP
                Distance            = 70; 35
            End
            Flags               = RANDOMSTART
        End

;;======= BACKING UP
        
        AnimationState                    = MOVING BACKING_UP
            Animation                    = BACKING UP
                AnimationName            = RURohrm_SKL.RURohrm_BAKA
                AnimationMode            = LOOP
            End
        End
        
        AnimationState                    =    TURN_LEFT_HIGH_SPEED
            Animation                    =    TurnLeft
                AnimationName            =    RURohrm_SKL.RURohrm_TNL1
                AnimationMode            =    LOOP
                AnimationBlendTime        =    20
            End
        End
        
        AnimationState                    =    TURN_RIGHT_HIGH_SPEED
            Animation                    =    TurnRight
                AnimationName            =    RURohrm_SKL.RURohrm_TNR1
                AnimationMode            =    LOOP
                AnimationBlendTime        =    20
            End
        End
        
        AnimationState                    = MOVING WANDER
            Animation                    = WLKA
                AnimationName            = RURohrm_SKL.RURohrm_WLKA
                AnimationMode            = LOOP
            End
        End

        AnimationState                    =    MOVING TURN_LEFT 
            Animation                    =    TurnLeft
                AnimationName            =    RURohrm_SKL.RURohrm_TRNL
                AnimationMode            =    LOOP
            End
        End

        AnimationState                    =    MOVING TURN_RIGHT 
            Animation                    =    TurnRight
                AnimationName            =    RURohrm_SKL.RURohrm_TRNR
                AnimationMode            =    LOOP
            End
        End

        AnimationState                    = MOVING ENGAGED
            Animation                    = Moving_Engaged
                AnimationName            = RURohrm_SKL.RURohrm_RUNC
                AnimationMode            = LOOP
            End
            Flags                        = RANDOMSTART
        End
        
;        AnimationState                    = MOVING WALKING
;            Animation                    = Walk1
;                AnimationName            = RURohrm_SKL.RURohrm_WLKB
;                AnimationMode            = LOOP
;                Distance                = 25
;            End
;        End

        AnimationState                    = MOVING USING_COMBO_LOCOMOTOR
            Animation                    = Walk1
                AnimationName            = RURohrm_SKL.RURohrm_WLKB
                AnimationMode            = LOOP
                Distance                = 25
            End
        End

        AnimationState                    = MOVING ACCELERATE
            Animation                    = Accelerate
                AnimationName            = RURohrm_SKL.RURohrm_ACCL
                AnimationMode            = ONCE ; was LOOP
            End
        End

        AnimationState                    = MOVING DECELERATE
            Animation                    = Decelerate
                AnimationName            = RURohrm_SKL.RURohrm_DECL
                AnimationMode            = ONCE
            End
        End
            
        AnimationState                    =    MOVING
            Animation                    =    RunA
                AnimationName            =    RURohrm_SKL.RURohrm_RUNA
                AnimationMode            =    LOOP
                Distance                =   40
            End
            Flags                        =    RANDOMSTART
        End


        ;---------------------------------------------------------------------------------------------------------

        ; Standard attack with spear.
        AnimationState                    =    FIRING_OR_PREATTACK_A
            Animation                    =    AttackA1
                AnimationName            =    RURohrm_SKL.RURohrm_ATKA
                AnimationMode            =    ONCE
            End
            ParticleSysBone     = None MeleeDust
        End
        ;---------------------------------------------------------------------------------------------------------
        

;;--------------------- EMOTIONS ----------------------------------------------------------------------------------
;;===== TERROR        
        AnimationState                    = MOVING EMOTION_TERROR EMOTION_LOOK_TO_SKY
            Animation                    = TerrorFromTheSky
                AnimationName            = RURohrm_SKL.RURohrm_RUNB
                AnimationMode            = LOOP
            End
        End
        
        AnimationState                    = MOVING EMOTION_TERROR
            Animation                    = TerrorFromTheSky
                AnimationName            = RURohrm_SKL.RURohrm_RUNB
                AnimationMode            = LOOP
            End
        End
        
;;======= APPREHENSIVE

        AnimationState                    =    EMOTION_ALERT EMOTION_AFRAID
            Animation                    =    Apprehensive
                AnimationName            =    RURohrm_SKL.RURohrm_APPA
                AnimationMode            =    LOOP    ;Change this to ONCE if adding additional anims
            End
        End

;;======= AFRAID

        AnimationState                    = EMOTION_AFRAID
            Animation                    = FERA
                AnimationName            = RURohrm_SKL.RURohrm_FERA
                AnimationMode            = LOOP
            End
            ;Animation                    = FERB
            ;    AnimationName            = RURohrm_SKL.RURohrm_FERB
            ;    AnimationMode            = LOOP
            ;End
        End

;;======= CELEBRATING
        
        AnimationState                    =    EMOTION_CELEBRATING
            Animation                    =    CheerA
                AnimationName            =    RURohrm_SKL.RURohrm_CHRA
                AnimationMode            =    ONCE
            End
            Animation                    =    CheerB
                AnimationName            =    RURohrm_SKL.RURohrm_CHRB
                AnimationMode            =    ONCE
            End
            Animation                    =    CheerC
                AnimationName            =    RURohrm_SKL.RURohrm_CHRC
                AnimationMode            =    ONCE
            End
            Animation                    =    CheerD
                AnimationName            =    RURohrm_SKL.RURohrm_CHRD
                AnimationMode            =    ONCE
            End
            Animation                    =    Salute
                AnimationName            =    RURohrm_SKL.RURohrm_SLTA
                AnimationMode            =    ONCE
            End
            Flags                        = RANDOMSTART RESTART_ANIM_WHEN_COMPLETE
        End

;;======= TAUNTING
            
        AnimationState                    = EMOTION_TAUNTING
            Animation                    = Taunting
                AnimationName            = RURohrm_SKL.RURohrm_TNTA
                AnimationMode            = ONCE
            End
            Animation                    = Taunting2
                AnimationName            = RURohrm_SKL.RURohrm_TNTB
                AnimationMode            = ONCE
            End
            Flags                        = RANDOMSTART RESTART_ANIM_WHEN_COMPLETE
        End

;;======= POINTING
            
        AnimationState                    = EMOTION_POINTING
            Animation                    = Pointing1
                AnimationName            = RURohrm_SKL.RURohrm_PNTA
                AnimationMode            = LOOP
            End
        End
        
;;======== ALERT

        AnimationState                    = EMOTION_ALERT
            Animation                    = IDLA
                AnimationName            = RURohrm_SKL.RURohrm_IDLA
                AnimationMode            = LOOP
            End
        End
        
;;-------------------- SELECTED ---------------------------------------------------------------
                
        AnimationState                    = SELECTED
            StateName                    = State_Selected
            SimilarRestart                = Yes
            Animation                    = AtAttention
                AnimationName            = RURohrm_SKL.RURohrm_IDLA    
                AnimationMode            = LOOP
            End
            BeginScript
                Prev = CurDrawablePrevAnimationState()
                if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_To_Selected") end
            EndScript
        End
        
        
        TransitionState                    =    TRANS_Idle_to_Selected
            Animation                    =    ATNA
                AnimationName            =    RURohrm_SKL.RURohrm_ATNA
                AnimationMode            =    ONCE
                AnimationSpeedFactorRange = 0.6 1.0
            End
        End
        
        
        TransitionState                    =    TRANS_Selected_to_Idle
            Animation                    =    ATNC
                AnimationName            =    RURohrm_SKL.RURohrm_ATNA
                AnimationMode            =    ONCE_BACKWARDS
                AnimationSpeedFactorRange = 0.6 1.0
            End
            Flags                        = START_FRAME_LAST
        End
        
        
    End
    
    Draw = W3DScriptedModelDraw DustEffects
        DefaultModelConditionState
          Model = None
        End
        IdleAnimationState
        End
        AnimationState = MOVING WADING
            ParticleSysBone = None FootstepSlash
        End
        AnimationState = MOVING ACCELERATE
            ParticleSysBone = None GenericSiegeTrailDust
        End
        AnimationState = MOVING DECELERATE
            ParticleSysBone = None GenericSiegeTrailDust
        End
        AnimationState = MOVING
            ParticleSysBone = None GenericSiegeTrailDust
        End
    End

	; ***DESIGN parameters ***
	Side				                        = Dwarves
	EditorSorting		                    = UNIT
	ThreatLevel			                    = 2.0
	TransportSlotCount	                = 1

	; Weapon Sets
	WeaponSet
		Conditions			                  = None 
		Weapon				                    = PRIMARY RohanRohirrimSpear
		AutoChooseSources	                = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End

	ArmorSet
		Conditions                        = None
		Armor                             = RohirrimHeavyArmor
		DamageFX                          = NormalDamageFX
	End

	BountyValue		                      = 13
	VisionRange		                      = M_ROHAN_ROHIRRIM_VISION_RANGE 			
	ShroudClearingRange 	              = SHROUD_CLEAR_STANDARD
	
	CommandSet		                      = DwarvenRiderHordeCommandSet
	CommandPoints		                    = 4
	DisplayName		                      = OBJECT:IronHillRider
	CrushableLevel		                  = 3 ;;.;; 1  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel		                    = 1
	CrushWeapon		                      = RohirrimCrush

	MinCrushVelocityPercent		          = 50 ;30 ;50 ;;,;; 40 ; Has to be moving at at least this % of full speed.
	CrushDecelerationPercent	          = 15 ;;,;; 20 ; Lose this % of max velocity when crushing.

	CrushKnockback	                    = 30 ;14 ;10;
	CrushZFactor	                      = 0.5 ;1.7 ;1.0;

