;-------------------------------------------------------
; Sword + shield warrior, needed b/c forged blade is different, therefore lua needs to be a bit different
;-------------------------------------------------------
ChildObject DwarfWarrior3 DwarfWarrior1

	Behavior = AIUpdateInterface ModuleTag_03
