	End
	; --- upgraded weapon set
	WeaponSet
		Conditions			= PLAYER_UPGRADE
		Weapon				= PRIMARY	DwarfCaptainAxeUpgraded
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	; --- Standard armor set
