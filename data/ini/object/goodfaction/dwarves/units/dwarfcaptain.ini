	End
	; --- Heavy armor set
	ArmorSet
		Conditions      = PLAYER_UPGRADE
		Armor           = DwarfWarriorHeavyArmor
		DamageFX        = NormalDamageFX
	End
	
	VisionRange = TDH_VISION_STANDARD_DWARF
	ShroudClearingRange = M_SHROUD_CLEAR_STANDARD

	DisplayName = OBJECT:DwarfCaptain
	
	CrushableLevel = 0

	CommandPoints = 15
	BuildCost 			= TDH_DWARVES_CAPTAIN_BUILDCOST			
	BuildTime			= TDH_DWARVES_CAPTAIN_BUILDTIME
	CommandSet = DwarfCaptainCommandSet


