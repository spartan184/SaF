; Dwarf Captain ini
; ----------------------------
Object DwarfCaptain
	MaxSimultaneousOfType = 5
	
	ButtonImage		= UIDwarf_Captain
	SelectPortrait	= UPDwarf_Captain
	
	Draw = W3DScriptedModelDraw ModuleTag_01
		
		RandomTexture = ducaptain1.tga 0 ducaptain1.tga
		RandomTexture = ducaptain2.tga 0 ducaptain1.tga
		RandomTexture = ducaptainb.tga 0 ducaptainb.tga
		RandomTexture = ducaptainb2.tga 0 ducaptainb.tga
		RandomTexture = ducaptainb3.tga 0 ducaptainb.tga
	
		
		DefaultModelConditionState
			Model               = ducaptain_SKN
		End

		; --- Idle Anims
		IdleAnimationState
			StateName = Idle				
			Animation           = IDLB
				AnimationName     = dUCaptain_SKL.dUCaptain_IDLB
				AnimationMode     = ONCE
				AnimationPriority   = 20
			End			
			Animation           = IDLD
				AnimationName     = dUCaptain_SKL.dUCaptain_IDLD
				AnimationMode     = ONCE
				AnimationPriority   = 1
			End			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Selected" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle") end
			EndScript			
		End
		
		AnimationState        = STUNNED_FLAILING 
			Flags               = RANDOMSTART
			Animation           = dUCaptain_FLYA
				AnimationName     = dUCaptain_SKL.dUCaptain_FLYA
				AnimationMode     = LOOP
			End
		End


		; --- Dying anims
		
		AnimationState        = DYING SPLATTED
			Animation           = dUCaptain_LNDA
				AnimationName     = dUCaptain_SKL.dUCaptain_LNDA
				AnimationMode     = ONCE
			End
		End
		AnimationState        = DYING
			Animation           = ducaptain_DIEA
				AnimationName     = ducaptain_SKL.ducaptain_DIEA
				AnimationMode     = ONCE
			End
				Animation           = ducaptain_DIEB
				AnimationName     = ducaptain_SKL.ducaptain_DIEB
				AnimationMode     = ONCE
			End
		End
		
		; --- Stunned anims
		AnimationState        = STUNNED_STANDING_UP
			Animation           = ducaptain_GTPA
				AnimationName     = ducaptain_SKL.ducaptain_GTPA
				AnimationMode     = ONCE
				AnimationSpeedFactorRange = 1.3 1.3
			End
		End
		AnimationState        = STUNNED 
			Animation           = ducaptain_LNDA
				AnimationName     = ducaptain_SKL.ducaptain_LNDA
				AnimationMode     = ONCE
			End
		End
		
		; --- Moving Anims	
		
		AnimationState        = MOVING FIRING_OR_PREATTACK_A
			ShareAnimation		= Yes
			Animation           = RunAndFire
				AnimationName       = ducaptain_SKL.ducaptain_ATRA
				AnimationMode       = LOOP
			End
			Flags               = RANDOMSTART  
		End
		
		
		AnimationState        = MOVING
			;ParticleSysBone     = None InfantryDustTrails
			Flags               = RANDOMSTART
			Animation           = ducaptain_RUNA
				AnimationName     = ducaptain_SKL.ducaptain_RUNA
				AnimationMode     = LOOP
			End
			Animation           = ducaptain_RUNB
				AnimationName     = ducaptain_SKL.ducaptain_RUNB
				AnimationMode     = LOOP
			End
		End
		
		

		; Attacking Anims [Weapon_A]
		AnimationState        = FIRING_OR_PREATTACK_A WEAPONSTATE_CLOSE_RANGE
			StateName           = WithSword
			Animation           = ATKA
				AnimationName     = ducaptain_SKL.ducaptain_ATKA
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			Animation           = ATKB
				AnimationName    = ducaptain_SKL.ducaptain_ATKB
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
		End

		AnimationState        = FIRING_OR_PREATTACK_A
			Animation           = ducaptain_ATKA
				AnimationName     = ducaptain_SKL.ducaptain_ATKA 
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			Animation           = ducaptain_ATKB
				AnimationName     = ducaptain_SKL.ducaptain_ATKB 
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
		End

		; ATTACKING
		AnimationState        = ATTACKING
			Animation           = ALERT_1
				AnimationName     = ducaptain_SKL.ducaptain_IDLA
				AnimationMode     = LOOP; ONCE
			End
;			Flags               = RESTART_ANIM_WHEN_COMPLETE ; acts like an idle animation & keeps running the animations.
		End
		
		; --------- Selected Anims and Transitions
		TransitionState					=	TRANS_Idle_to_Selected
			Animation					=	ATNA
				AnimationName			=	ducaptain_SKL.ducaptain_ATNA
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_Selected_To_Idle
			Animation					=	ATNC
				AnimationName			=	ducaptain_SKL.ducaptain_ATNC
				AnimationMode			=	ONCE
			End
		End
		
		AnimationState				= LEVELED 						; This state clears itself in 3 seconds
			Animation				= LevelUp
				AnimationName		= ducaptain_SKL.ducaptain_CHRA
				AnimationMode		= ONCE
			End
		End

		AnimationState				=	SELECTED
			StateName				=	Selected
			SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	ducaptain_SKL.ducaptain_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected") end
			EndScript
		End
		
		;------------emotions---------------
		AnimationState						= EMOTION_POINTING
			Animation				= CHRA
				AnimationName		= ducaptain_SKL.ducaptain_CHRA
				AnimationMode		= LOOP	;ONCE
			End
		;	Flags				=	RESTART_ANIM_WHEN_COMPLETE
		End
		
		AnimationState			= EMOTION_CELEBRATING
			Animation           = CHRA
				AnimationName   = ducaptain_SKL.ducaptain_CHRA
				AnimationMode   = LOOP		;ONCE
			End
		;	Flags				=	RESTART_ANIM_WHEN_COMPLETE
		End
		
		AnimationState = MOVING BACKING_UP
			Animation = Moving_Back
				AnimationName = ducaptain_SKL.ducaptain_BAKA	
				AnimationMode = LOOP
			End	
		End
		
	;	AnimationState					= EMOTION_ALERT EMOTION_MORALE_HIGH
	;		Animation					= Taunting
	;			AnimationName			=  ducaptain_SKL.ducaptain_TNTB		;does not exist
	;			AnimationMode			= ONCE
	;		End
	;		Flags						= RANDOMSTART RESTART_ANIM_WHEN_COMPLETE
	;	End
		
		; READY IDLE
		AnimationState        = EMOTION_ALERT
			Animation           = ALERT_1
				AnimationName     = ducaptain_SKL.ducaptain_IDLA
				AnimationMode     = LOOP ;ONCE
			End
;			Flags               = RESTART_ANIM_WHEN_COMPLETE ; acts like an idle animation & keeps running the animations.
		End
		
		
		; --------- Click and Hit Reactions ------------
		AnimationState = HIT_REACTION HIT_LEVEL_1
			Animation = Hit_Level_1_a
				AnimationName = ducaptain_SKL.ducaptain_HITA	
				AnimationMode = ONCE
			End
		End		

	End
	


