Object DwarfVaultWarden
	; *** ART Parameters ***

    ; SelectPortrait for Heros is portrait behind skill buttons. HP = HeroPortrait.
	SelectPortrait = UPDwarf_VaultWarden
    
    ; ButtonImage for Heros is button image on Hero Select UI to select hero. HI = HeroIcon or HeroImage.
    ButtonImage = UIDwarf_VaultWarden
    
	Draw = W3DScriptedModelDraw ModuleTag_DRAW

		WadingParticleSys = EntRipples

	  OkToChangeModelColor = Yes
	  
	    StaticModelLODMode = No ; Will append M or L to the skin name depending on GameLOD

		DefaultModelConditionState
			Model = duvault_skn
			Skeleton = duvault_skl
		End
		
		ModelConditionState = MOUNTED
			Model = duvault_skn
			Skeleton = duvault_skl
			WeaponLaunchBone    = PRIMARY NONE
		End
		
		; Unpacked animations
		AnimationState				=	MOUNTED DYING SPLATTED
			Animation				=	DieUnpackedSplat
				AnimationName		=	duvault_diea ;RUHHs_Theo_LNDA
				AnimationMode		=	ONCE
				AnimationBlendTime  =   2
			End
			FXEvent	= Frame:2 Name:FX_SplatDust
		End

		AnimationState				=	MOUNTED DYING	; DEATH_2 Normally has DEATH_2, but just as a backup don't insist
			Animation				=	DieUnpacked
				AnimationName		=	duvault_diea ; RUHHs_Theo_DIEA
				AnimationMode		=	ONCE
			End
		End
		
		AnimationState				=	MOUNTED TURN_LEFT ; MOVING 
			Animation				=	UnpackedTurnLeft
				AnimationName		=	duvault_trnla ;RUHHs_Theo_TRNL
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOUNTED TURN_RIGHT ; MOUNTED  
			Animation				=	UnpackedTurnRight
				AnimationName		=	duvault_trnla ;RUHHs_Theo_TRNR
				AnimationMode		=	LOOP
			End	
			Flags = START_FRAME_LAST
		End

		AnimationState				=	MOUNTED TURN_LEFT MOVING 
			Animation				=	UnpackedTurnLeft
				AnimationName		=	duvault_trnla ;RUHHs_Theo_TRNL
				AnimationMode		=	LOOP
				AnimationBlendTime  =   5
			End
		End

		AnimationState				=	MOUNTED TURN_RIGHT MOUNTED  
			Animation				=	UnpackedTurnRight
				AnimationName		=	duvault_trnra ;RUHHs_Theo_TRNR
				AnimationMode		=	LOOP
				AnimationBlendTime  =   5
			End	
		End
		
		AnimationState        = MOUNTED FIRING_OR_PREATTACK_A
			ShareAnimation		= Yes
			Animation           = UnpackedAttack
				AnimationName       = duvault_atka ;RUHHs_Theo_ATRA
				AnimationMode       = LOOP
				UseWeaponTiming		= Yes
				AnimationSpeedFactorRange= 1.5 1.5
			End
			Flags               = RESTART_ANIM_WHEN_COMPLETE
		End
	
		AnimationState				=	MOUNTED ATTACKING
			Animation				=	UnpackedReady
				AnimationName		=	duvault_idla
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOUNTED SELECTED
			SimilarRestart			=   Yes			
			StateName				=	UnpackedAttention
			Animation				=	ATNB
				AnimationName		=	duvault_atnb
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "PackedIdle" then CurDrawableSetTransitionAnimState("Trans_Packed_To_Unpacked") end
				if Prev == "PackedAttention" then CurDrawableSetTransitionAnimState("Trans_Packed_To_Unpacked") end
				if Prev == "UnpackedIdle" then CurDrawableSetTransitionAnimState("TRANS_UnpackedSelect") end
				if Prev == "UnpackedAttention" then CurDrawableSetTransitionAnimState("TRANS_UnpackedSelect") end
				
			EndScript
		End
		

		AnimationState = MOUNTED HIT_REACTION
			StateName				=	UnpackedHit
			Animation = Hit_Level_1_a
				AnimationName = duvault_hita
				AnimationMode = ONCE
			End
		End		
		
		
		AnimationState			= MOUNTED
			StateName = UnpackedIdle
			Animation	=	IdleA
				AnimationName		=	duvault_idlb
				;AnimationPriority	=	20
				AnimationMode		=	ONCE
				AnimationBlendTime	=	5
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "PackedIdle" then CurDrawableSetTransitionAnimState("Trans_Packed_To_Unpacked") end
				if Prev == "PackedAttention" then CurDrawableSetTransitionAnimState("Trans_Packed_To_Unpacked") end
				if Prev == "UnpackedAttention" then CurDrawableSetTransitionAnimState("TRANS_UnpackedEndSelect") end
				
			EndScript
			
		End
		
		
		
		TransitionState				=	TRANS_UnpackedSelect
			Animation				=	ATNA
				AnimationName		=	duvault_atna
				AnimationMode		=	ONCE
			End
		End
		
		TransitionState				=	TRANS_UnpackedEndSelect
			Animation				=	ATNA
				AnimationName		=	duvault_atnc
				AnimationMode		=	ONCE
			End
		End

		AnimationState				=	MOUNTED MOVING
			Animation				=	UnpackedMove
				AnimationName		=	duvault_idla ;RUHHs_Theo_RUNA
				AnimationMode		=	LOOP
			End
		End
		;------------------------
		; Switching animations
		;------------------------
		
		TransitionState       = Trans_Packed_To_Unpacked
			Animation           = GUBoromir_STHA
				AnimationName     = duvault_swpb
				AnimationMode     = ONCE
			End
			;Flags = START_FRAME_LAST
		End
		TransitionState       = Trans_Unpacked_To_Packed
			Animation           = GUBoromir_STHB
				AnimationName     = duvault_swpa
				AnimationMode     = ONCE
			End
		End
		
		;------------------------
		; Packed up animations
		;------------------------
		IdleAnimationState
			StateName = PackedIdle			
			Animation           = IDLB
				AnimationName     = duvault_idlg
				AnimationMode     = ONCE
				;AnimationPriority   = 20
			End			
			; Animation           = IDLD
				; AnimationName     = GUBoromir_SKL.GUBoromir_IDLD
				; AnimationMode     = ONCE
				; AnimationPriority   = 1
			; End			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "UnpackedAttention" then CurDrawableSetTransitionAnimState("Trans_Unpacked_To_Packed") end
				if Prev == "UnpackedIdke" then CurDrawableSetTransitionAnimState("Trans_Unpacked_To_Packed") end
				if Prev == "PackedAttention" then CurDrawableSetTransitionAnimState("TRANS_PackedEndSelect") end
				
			EndScript			
		End

	
		
		AnimationState        = DYING SPLATTED
			StateName = PackedDeathSplat
			Animation           = GUBoromir_LNDA
				AnimationName     = duvault_diec
				AnimationMode     = ONCE
			End
		End
	
		AnimationState        = DYING
			StateName = 	PackedDeath
			Animation           = GUBoromir_DTHA
				AnimationName     = duvault_diec
				AnimationMode     = ONCE
			End
		End
		
		
		; AnimationState        = MOVING FIRING_OR_PREATTACK_A
			; ShareAnimation		= Yes
			; Animation           = RunAndFire
				; AnimationName       = GUBoromir_SKL.GUBoromir_ATRA
				; AnimationMode       = LOOP
				
			; End
			; Flags               = RANDOMSTART  
		; End
		
		AnimationState				=	TURN_LEFT 
			Animation				=	PackedTurnLeft
				AnimationName		=	duvault_trnlb ;RUHHs_Theo_TRNL
				AnimationMode		=	LOOP
				AnimationSpeedFactorRange= 1 1
				AnimationBlendTime  =   5
			End
		End

		AnimationState				=	TURN_RIGHT 
			Animation				=	PackedTurnRight
				AnimationName		=	duvault_trnrb ;RUHHs_Theo_TRNR
				AnimationMode		=	LOOP
				AnimationBlendTime  =   5
			End	
		End
		
		AnimationState        = MOVING
			;ParticleSysBone     = None InfantryDustTrails
			StateName = 	PackedMoving
			Flags               = RANDOMSTART
			Animation           = GUBoromir_RUNB
				AnimationName     = duvault_runa
				AnimationMode     = LOOP
				AnimationSpeedFactorRange= 0.85 0.85
				AnimationBlendTime  =   5
			End
		End
		

		; Attacking Anims [Weapon_A]

		; AnimationState        = FIRING_OR_PREATTACK_A WEAPONSTATE_CLOSE_RANGE
			; StateName           = WithSword
			; Animation           = ATKA
				; AnimationName     = GUBoromir_SKL.GUBoromir_ATKA
				; AnimationMode     = ONCE
				; UseWeaponTiming		= Yes
			; End
			; Animation           = ATKB
				; AnimationName    = GUBoromir_SKL.GUBoromir_ATKB
				; AnimationMode     = ONCE
				; UseWeaponTiming		= Yes
			; End
		; End


		AnimationState        = ATTACKING
			StateName = 	PackedReady
			Animation           = ALERT_1
				AnimationName     = duvault_idlf
				AnimationMode     = LOOP; ONCE
			End
;			Flags               = RESTART_ANIM_WHEN_COMPLETE ; acts like an idle animation & keeps running the animations.
		End
		
		TransitionState					=	TRANS_PackedSelect
			Animation					=	ATND
				AnimationName			=	duvault_atnd
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_PackedEndSelect
			Animation					=	ATNE
				AnimationName			=	duvault_atnf
				AnimationMode			=	ONCE
			End
		End

		AnimationState				=	SELECTED
			StateName				=	PackedAttention
			SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	duvault_atne
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "UnpackedAttention" then CurDrawableSetTransitionAnimState("Trans_Unpacked_To_Packed") end
				if Prev == "UnpackedIdle" then CurDrawableSetTransitionAnimState("Trans_Unpacked_To_Packed") end
				if Prev == "PackedIdle" then CurDrawableSetTransitionAnimState("TRANS_PackedSelect") end
				
			EndScript
		End	
		
		

	End


	Draw = W3DScriptedModelDraw DustEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    IdleAnimationState
	    End
	    AnimationState = MOUNTED MOVING WADING
			;ParticleSysBone = None FootstepSlash
	    End
	    AnimationState = MOUNTED MOVING ACCELERATE
			;ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = MOUNTED MOVING ACCELERATE
			;ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = MOUNTED MOVING
	    End
	End


	
