Object RavenSummonEgg
	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState
			Model = None
		End
	End
	BuildCost = TDH_DWARVES_RAVEN_BUILDCOST
    BuildTime = TDH_DWARVES_RAVEN_BUILDTIME
	CommandPoints = 10
	
	VoiceCreated		= DwarfRavenVoiceSalute
	
	KindOf = INERT IMMOBILE UNATTACKABLE
	
	Body = ActiveBody ModuleTag_MakesKillWork
		MaxHealth = 1
	End
	Behavior = LifetimeUpdate ModuleTag_HatchTrigger
		MinLifetime = 0.0
		MaxLifetime = 0.0
	End
	Behavior = SlowDeathBehavior ModuleTag_HatchProcess
		DestructionDelay = 1000
		OCL = FINAL OCL_SpawnDwarfRaven
	End
End



Object DwarfRaven

	ImmuneToShockwave = No

	Scale = 0.1
                       
	; *** ART Parameters ***

	ButtonImage = UIDwarf_Raven
	SelectPortrait         = UPDwarf_Raven

	Draw = W3DScriptedModelDraw ModuleTag_01
		  
		  OkToChangeModelColor = Yes
		  
  		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
		ParticlesAttachedToAnimatedBones = Yes

		
		DefaultModelConditionState
			Model               = duraven_SKN
			Skeleton            = GUGwaihir_SKL
			
		End
		
		IdleAnimationState
			StateName = Idle
			Animation           = FlyB
				AnimationName     = GUGwaihir_HVRA
				AnimationMode     = LOOP
				AnimationBlendTime = 10
				
			End
		End



		AnimationState  STUNNED SPECIAL_DAMAGED
			StateName =  STUNNED
			Animation = HitB
				AnimationName = GUGwaihir_HITB
				AnimationMode = ONCE
				AnimationBlendTime = 6
			End
		End
		AnimationState  STUNNED
			Animation = HitB
				AnimationName = GUGwaihir_HITA
				AnimationMode = ONCE
				AnimationBlendTime = 6
			End
		End


 		AnimationState	= BACKING_UP
   			StateName = backup
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
   			Animation = FlyB
   				AnimationName = GUGwaihir_FLYB
   				AnimationMode = LOOP
   				AnimationBlendTime = 9
   			End
   		End

   		AnimationState = DIVING
   			StateName = Diving
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
   			Animation = DiveA
   				AnimationName = GUGwaihir_DIVA
   				AnimationMode = LOOP
   				AnimationBlendTime = 9
   			End
   		End

		AnimationState = ABOUT_TO_HIT ; clawing
			StateName = Claw
			Animation = Claw
				AnimationName = GUGwaihir_ATKB
				AnimationMode = LOOP
				AnimationBlendTime = 9
			End
 	 		;BeginScript
 			;	CurDrawableSetTransitionAnimState("Trans_Begin_Attacking") return 
 			;EndScript
			
		End
		TransitionState = Trans_Begin_Attacking 
			StateName = Grab
			Animation = Grab
				AnimationName = GUGwaihir_GRBB
				AnimationMode = ONCE
				AnimationBlendTime = 9
				AnimationSpeedFactorRange = 0.4 0.4
			End
		End

		;--- HARD FLAPPING ------------------------
		AnimationState = CLIMBING
			StateName = Climbing
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
			Animation = FlyB(climb)
				AnimationName = GUGwaihir_FLYB
				AnimationMode = LOOP
				AnimationBlendTime = 9
				AnimationSpeedFactorRange = 1.5 1.55
			End
		End
		AnimationState = FREEFALL
			StateName = Freefall
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
			Animation = Freefall(ilde)
				AnimationName = GUGwaihir_IDLA
				AnimationMode = LOOP
				AnimationBlendTime = 9
				AnimationSpeedFactorRange = 0.7 0.75
			End
		End
	

		AnimationState = MOVING
			StateName = Moving
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
			Animation           = FLYA
				AnimationName     = GUGwaihir_FLYA
				AnimationMode     = LOOP
				AnimationBlendTime  = 12
			End

			BeginScript
 				Prev = CurDrawablePrevAnimationState()
 				if Prev == "Idle"	then CurDrawableSetTransitionAnimState("Trans_Begin_Moving") return end
 			EndScript
		End
   	    TransitionState = Trans_Begin_Moving
			ParticleSysBone     = BAT_WING16 RavenContrail
			ParticleSysBone     = BAT_WING04 RavenContrail
   			Animation = Transition
   				AnimationName = GUGwaihir_HVRC
   				AnimationMode = ONCE
   				AnimationBlendTime = 4
   			End  
   		End			

	    TransitionState = Trans_Dying
			Animation = Transition
				AnimationName = GUGwaihir_DIED
				AnimationMode = ONCE
				AnimationBlendTime = 9
			End  
		End			


		AnimationState = RUBBLE 
			Animation = RubbleDieF
				AnimationName = GUGwaihir_DIEF
				AnimationMode = ONCE
				AnimationBlendTime = 3
			End
		End

		AnimationState = DYING DEATH_1
			StateName = DYING
			Animation = DyingA
				AnimationName = GUGwaihir_DIEE
				AnimationMode = LOOP
				AnimationBlendTime = 9
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle"	then CurDrawableSetTransitionAnimState("Trans_Dying") return end
				if Prev == "Moving"	then CurDrawableSetTransitionAnimState("Trans_Dying") return end
			EndScript
	    End

		AnimationState = DYING DEATH_2
			StateName = DYING
			Animation = DyingA
				AnimationName = GUGwaihir_HVRA
				AnimationMode = LOOP
				AnimationBlendTime = 9
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle"	then CurDrawableSetTransitionAnimState("Trans_Dying") return end
				if Prev == "Moving"	then CurDrawableSetTransitionAnimState("Trans_Dying") return end
			EndScript
	    End




	End

	
	; ***DESIGN parameters ***
	Side				= Dwarves
	EditorSorting		= UNIT
	ThreatLevel			= 1.0
	ThingClass			= LARGE_MONSTER
	TransportSlotCount	= 1
  
	WeaponSet
		Conditions		= None
	End

	ArmorSet
		Conditions      = None
		Armor           = DwarfRavenArmor
		DamageFX        = GwaihirDamageFX
	End	
	
	VisionRange = TDH_DWARVES_RAVEN_VISION
	ShroudClearingRange = TDH_DWARVES_RAVEN_SHROUD_CLEAR

	BountyValue = TDH_DWARVES_RAVEN_BOUNTY_VALUE
	DisplayName = OBJECT:DwarfRaven
	

	CrusherLevel           = 3  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
	RamPower = 30;
	RamZMult = 0.5;
	CommandSet = DwarfRavenCommandSet
	CommandPoints = 10
	

	; *** AUDIO Parameters ***;

	VoiceAttack			= DwarfRavenVoiceMove
	VoiceCreated		= DwarfRavenVoiceSalute
	VoiceMove			= DwarfRavenVoiceMove
	VoicePriority			= 40
	VoiceSelect			= DwarfRavenVoiceSelect
	VoiceGuard			= DwarfRavenVoiceMove

	SoundAmbient		= DwarfRavenVoiceSelect
	SoundImpact			= ImpactHorse

	
	;UnitSpecificSounds
	;End

	EvaEventDamagedOwner = UnitUnderAttack 		;Eva event to trigger when unit is damaged

	ClientBehavior = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap = 800
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_FLYA Frames: 2
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_FLYB Frames: 2 
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_FLYC Frames: 2 63
		;AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_FLYC Frames: 4 34 

		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_HVRA Frames: 4
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_HVRC Frames: 4

		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_HITA Frames: 0
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_HITB Frames: 0

		AnimationSound = Sound: DwarfRavenVoiceDeath		Animation:GUGwaihir_SKL.GUGWAIHIR_HITA Frames: 1
		AnimationSound = Sound: DwarfRavenVoiceDeath		Animation:GUGwaihir_SKL.GUGWAIHIR_HITB Frames: 1
		AnimationSound = Sound: DwarfRavenVoiceDeath		Animation:GUGwaihir_SKL.GUGWAIHIR_DIED Frames: 1

		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_ATKB Frames: 0
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_GRBB Frames: 0

		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_DIED Frames: 0
		AnimationSound = Sound: TrollBodyfall		Animation:GUGwaihir_SKL.GUGWAIHIR_DIEF Frames: 2
		AnimationSound = Sound: EagleWingFlaps		Animation:GUGwaihir_SKL.GUGWAIHIR_DIEF Frames: 0
	End

	; Tie into LargeGroupAudio system
	Behavior = LargeGroupAudioUpdate ModuleTag_LGAU
		Key = Eagle Unit Flyer
	End


	; *** ENGINEERING Parameters ***
	RadarPriority		= UNIT
	KindOf				= PRELOAD SELECTABLE CAN_CAST_REFLECTIONS SCORE ARMY_SUMMARY CANNOT_RETALIATE NO_FREEWILL_ENTER IGNORES_SELECT_ALL ;MONSTER 
	
	Body = ActiveBody ModuleTag_02
		CheerRadius 	  = M_EMOTION_CHEER_RADIUS
		MaxHealth         = TDH_DWARVES_RAVEN_HEALTH
		HealingBuffFx = None
		DodgePercent      		= TDH_DWARVES_RAVEN_DODGE_PERCENT
	End

	BuildCost = TDH_DWARVES_RAVEN_BUILDCOST
    BuildTime = TDH_DWARVES_RAVEN_BUILDTIME
	
	; --- Raven detects stealth
	Behavior = StealthDetectorUpdate StealthDetectorUpdateModuleTag
		DetectionRate   = 500   ; how often to rescan for stealthed things in my sight (msec)
	End
	
	; -- regrant actual upgrades on commandset swap
	Behavior = ObjectCreationUpgrade StealthUpgrade02
		TriggeredBy		= Upgrade_DwarfRavenStealth
		Delay			= 0.1
		GrantUpgrade	= Upgrade_DwarfRavenStealth
		DestroyWhenSold = Yes
	End
	Behavior = ObjectCreationUpgrade SpeedUpgrade02
		TriggeredBy		= Upgrade_DwarfRavenSpeed
		Delay			= 0.1
		GrantUpgrade	= Upgrade_DwarfRavenSpeed
		DestroyWhenSold = Yes
	End
	Behavior = ObjectCreationUpgrade SightUpgrade02
		TriggeredBy		= Upgrade_DwarfRavenSight
		Delay			= 0.1
		GrantUpgrade	= Upgrade_DwarfRavenSight
		DestroyWhenSold = Yes
	End
	;  CS upgrades
	Behavior = CommandSetUpgrade ModuleTag_RemoveAllSight
		TriggeredBy		= Upgrade_DwarfRavenSight							;keep a generic name so it can be reused :P
		RemovesUpgrades = Upgrade_DwarfRavenStealth Upgrade_DwarfRavenSpeed
		CommandSet = DwarfRavenCommandSetSightOn
	End
	Behavior = CommandSetUpgrade ModuleTag_RemoveAllStealth
		TriggeredBy		= Upgrade_DwarfRavenStealth								;keep a generic name so it can be reused :P
		RemovesUpgrades = Upgrade_DwarfRavenSpeed Upgrade_DwarfRavenSight
		CommandSet = DwarfRavenCommandSetStealthOn
	End
	Behavior = CommandSetUpgrade ModuleTag_RemoveAllSpeed
		TriggeredBy		= Upgrade_DwarfRavenSpeed							;keep a generic name so it can be reused :P
		RemovesUpgrades = Upgrade_DwarfRavenStealth Upgrade_DwarfRavenSight
		CommandSet = DwarfRavenCommandSetSpeedOn
	End
	
	; -- Default, small ring glow for vis
	Behavior = AttributeModifierAuraUpdate ModuleTag_UpgradeNone
        StartsActive    = No ;If no, requires upgrade to turn on.
        BonusName        = RavenNoBonus
		TriggeredBy		= Upgrade_UnitLevel1
		ConflictsWith	= Upgrade_DwarfRavenSight Upgrade_DwarfRavenStealth Upgrade_DwarfRavenSpeed
        RefreshDelay    = 9999999999
        ;Range            = 10
        AllowSelf        = Yes        
        ObjectFilter    = ANY +DwarfRaven
    End

	; -- SIGHT MODIFIER: swap commandset, remove all other object upgrades and start attributemodifer
	Behavior = AttributeModifierAuraUpdate ModuleTag_UpgradeSight
        StartsActive    = No;If no, requires upgrade to turn on.
        BonusName        = RavenSightBonus
        TriggeredBy		= Upgrade_DwarfRavenSight
		ConflictsWith	= Upgrade_DwarfRavenSpeed Upgrade_DwarfRavenStealth
        RefreshDelay    = 1000
        ;Range            = 10
        AllowSelf        = Yes        
        ObjectFilter    = ANY +DwarfRaven
    End
	
	Behavior = SpawnBehavior ModuleTag_Sight
		TriggeredBy			= Upgrade_DwarfRavenSight
		SpawnNumber			= 1
		InitialBurst			= 1
		SpawnTemplateName		= DwarfRavenSightObject
		SpawnReplaceDelay		= 2
	End
	
	Behavior = SubObjectsUpgrade ForgedBlade_Upgrade3
		TriggeredBy		= Upgrade_DwarfRavenSight
		ShowSubObjects	= SIGHT
		HideSubObjects	= BLANK
	End	

  Behavior = QueueProductionExitUpdate sightprd2
    UnitCreatePoint    = X:0 Y:0 Z:0
    NaturalRallyPoint  = X:0 Y:0 Z:0.0
    ExitDelay = 1
  End
	
	; -- STEALTH MODIFIER: swap commandset, remove all other object upgrades, activate broadcaststealth, and start attributemodifer
	Behavior = AttributeModifierAuraUpdate ModuleTag_UpgradeStealth
        StartsActive    = No;If no, requires upgrade to turn on.
        BonusName        = RavenStealthBonus
        TriggeredBy		= Upgrade_DwarfRavenStealth
		ConflictsWith	= Upgrade_DwarfRavenSpeed Upgrade_DwarfRavenSight
        RefreshDelay    = 1000
        ;Range            = 10
        AllowSelf        = Yes        
        ObjectFilter    = ANY +DwarfRaven
    End
	
	Behavior = StealthUpdate ModuleTag_StealthForCloak
		StartsActive    = No
	  StealthDelay                = 500         ; msec
	  FriendlyOpacityMin          = TDH_STEALTH_FRIENDLY_OPACITY_MIN
	  FriendlyOpacityMax          = TDH_STEALTH_FRIENDLY_OPACITY_MAX
	  PulseFrequency              = 750   ; msec
	  InnateStealth					= Yes	;I do not go stealthed just when standing around, I must be told through a command to go stealthed
	  OrderIdleEnemiesToAttackMeUponReveal  = Yes
	  DetectedByAnyoneRange    = 100
	  BecomeStealthedFX           = FX_ElvenCloakOn
	  ExitStealthFX               = FX_ElvenCloakOff
	End
	
	Behavior = SubObjectsUpgrade ForgedBlade_Upgrade2
		TriggeredBy		= Upgrade_DwarfRavenStealth
		ShowSubObjects	= STEALTH
		HideSubObjects	= BLANK
	End	
	
	Behavior = StealthUpgrade ModuleTag_StealthUpgrade
		TriggeredBy		= Upgrade_DwarfRavenStealth
	End
	
	; -- SPEED MODIFIER: swap commandset, remove all other object upgrades and start attributemodifer
	Behavior = AttributeModifierAuraUpdate ModuleTag_UpgradeZoom
        StartsActive    = No;If no, requires upgrade to turn on.
        BonusName        = RavenSpeedBonus
		TriggeredBy		= Upgrade_DwarfRavenSpeed
		ConflictsWith	= Upgrade_DwarfRavenSight Upgrade_DwarfRavenStealth
        RefreshDelay    = 1800
        ;Range            = 10
        AllowSelf        = Yes        
        ObjectFilter    = ANY +DwarfRaven
    End
	
	Behavior = SubObjectsUpgrade ForgedBlade_Upgrade
		TriggeredBy		= Upgrade_DwarfRavenSpeed
		ShowSubObjects	= SPEED
		HideSubObjects	= BLANK
	End	
	
	Behavior = ProductionUpdate ModuleTag_upgrades
    ; nothing, need it for object upgrades
	End
	
	Behavior = GiantBirdAIUpdate ModuleTag_GiantBirdAI
		AutoAcquireEnemiesWhenIdle	=	No ATTACK_BUILDINGS; Important that Nazgul not go swooping about on his own, UNLESS IN GUARD STATE
		MoodAttackCheckRate			=	500
		AILuaEventsList				=	DwarfRavenFunctions	
		
		FollowThroughDistance		=	160
		FollowThroughCheckStep		=	50
		FollowThroughGradient		=	1.0
		
		GrabTossTimeTrigger			=	3.0
		GrabTossHeightTrigger		=   80.0
		TossFX				= FX_DiebyFalling
		SpecialContactPoints		= Swoop
		
		AttackPriority = AttackPriority_Eagle
	End

	LocomotorSet
		Locomotor = RavenLocomotor
		Condition = SET_NORMAL 
		Speed     = TDH_DWARVES_RAVEN_SPEED	
	End
	LocomotorSet
		Locomotor = RavenLocomotor 
		Condition = SET_SUPERSONIC 
		Speed     = TDH_DWARVES_RAVEN_CRUISE	
	End
	LocomotorSet
		Locomotor = RavenLocomotor 
		Condition = SET_WANDER 
		Speed     = TDH_DWARVES_RAVEN_WANDER	
	End

	Behavior = PhysicsBehavior ModuleTag_04
	End
	
	
	Behavior = SquishCollide ModuleTag_06
		;nothing
	End

  
	Behavior = SlowDeathBehavior ModuleTag_SlowDeath
		DeathTypes = ALL -FADED
		DestructionDelay = 1000
		ShadowWhenDead = No
		FX = INITIAL FX_RavenDeath
		Sound = INITIAL DwarfRavenVoiceDeath
	        DeathFlags = DEATH_1
	End
	
  	Behavior = SlowDeathBehavior ModuleTag_FadeDeath
		DeathTypes = NONE +FADED
		FadeDelay = 0
		FadeTime = 2500
		DestructionDelay = 2500
		Sound = INITIAL DwarfRavenVoiceDeath	
	        DeathFlags = DEATH_2
	End

	Geometry = CYLINDER
	GeometryMajorRadius = 30.0
	GeometryMinorRadius = 30.0
	GeometryHeight = 16.0
	GeometryIsSmall = No
	
	HealthBoxScale			= 1.0
	HealthBoxHeightOffset		= 2.0
	
	
	
	Shadow = SHADOW_VOLUME_NON_SELF_3; volumetric shadow that doesn't cast onto all objects using SHADOW_VOLUME_NON_SELF_3
	ShadowSunAngle = 89; clamp the angle so shadow casts straight down.
End

