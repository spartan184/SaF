		;	Animation = Moving_Back
		;		AnimationName = ducaptain_BAKA	
		;		AnimationMode = LOOP
		;	End	
		;End
		
		AnimationState = ALTERNATE_FORMATION MOVING BACKING_UP WEAPONSET_TOGGLE_1
			Animation = Moving_Back
				AnimationName = rugimli_BAKA	
				AnimationMode = LOOP
			End	
		End
		
		AnimationState					= EMOTION_ALERT EMOTION_MORALE_HIGH
