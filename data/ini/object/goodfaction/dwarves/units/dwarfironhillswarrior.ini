				AnimationName			=  ducaptain_TNTa	
				AnimationMode			= ONCE
			End
		End
		
		; *********** NEED taunting for gimli
		AnimationState					= EMOTION_ALERT EMOTION_MORALE_HIGH WEAPONSET_TOGGLE_1
			Animation					= Taunting
				AnimationName			=  rugimli_TNTa	
				AnimationMode			= ONCE
			End
		End
		
		
