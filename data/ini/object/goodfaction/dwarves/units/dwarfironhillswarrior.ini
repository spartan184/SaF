			End
		End
		
		AnimationState        = EMOTION_ALERT
			Animation           = ALERT_1
				AnimationName     = ducaptain_IDLA
				AnimationMode     = LOOP ;ONCE
			End
		End
		
		
		
		; -----------Selected anims----------------
		; --------------------------------------
		
		; Selected
		
		AnimationState				=	SELECTED WEAPONSET_TOGGLE_1
			StateName				=	Selected_Mattock
			;SimilarRestart			=   Yes			
			Animation				=	ATNBb
				AnimationName		=	rugimli_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Bored_Mattock" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected_Mattock") end
			EndScript
		End
		
		AnimationState				=	SELECTED
			StateName				=	Selected_Sword
			;SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	ducaptain_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Bored_Sword" then CurDrawableSetTransitionAnimState("TRANS_Idle_to_Selected_Sword") end
			EndScript
		End
		
		
		
		; ----------- Idle states----------------
		; --------------------------------------
		AnimationState					= WEAPONSET_TOGGLE_1
			StateName					= Bored_Mattock
			
			Animation           		= Idle_Sword1
				AnimationName       	= rugimli_idlb
				AnimationMode       	= ONCE
				AnimationPriority   = 20
			End
			Animation           		= Idle_Sword1
				AnimationName       	= rugimli_idle
				AnimationMode       	= ONCE
				AnimationPriority   = 1
			End
			Flags						= RESTART_ANIM_WHEN_COMPLETE
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Selected_Mattock" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle_Mattock") end
			EndScript	
		End
		
		IdleAnimationState
			StateName = Bored_Sword				
			Animation           = IDLB
				AnimationName     = ducaptain_IDLB
				AnimationMode     = ONCE
				AnimationPriority   = 20
			End			
			Animation           = IDLD
				AnimationName     = ducaptain_IDLC
				AnimationMode     = ONCE
				AnimationPriority   = 1
			End			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Selected_Sword" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle_Sword") end
			EndScript			
		End
		
		; -----------Transitions----------------
		; --------------------------------------
		TransitionState					=	TRANS_Idle_to_Selected_Sword
			Animation					=	ATNA
				AnimationName			=	ducaptain_ATNA
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_Selected_To_Idle_Sword
			Animation					=	ATNC
				AnimationName			=	ducaptain_ATNC
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_Idle_to_Selected_Mattock
			Animation					=	ATNA
				AnimationName			=	rugimli_ATNA
				AnimationMode			=	ONCE
			End
		End
		
		TransitionState					=	TRANS_Selected_To_Idle_Mattock
			Animation					=	ATNC
				AnimationName			=	rugimli_ATNC
				AnimationMode			=	ONCE
			End
		End
		; ------------------------------------
		
		; --------- Click and Hit Reactions ------------
		; --------------------------------------
		AnimationState = HIT_REACTION HIT_LEVEL_1 WEAPONSET_TOGGLE_1
			Animation = Hit_Level_1_ab
				AnimationName = rugimli_HITA	
				AnimationMode = ONCE
			End
		End	
		
		AnimationState = HIT_REACTION HIT_LEVEL_1
			Animation = Hit_Level_1_a
				AnimationName = ducaptain_HITA	
				AnimationMode = ONCE
			End
		End		
		
			

	End
	


