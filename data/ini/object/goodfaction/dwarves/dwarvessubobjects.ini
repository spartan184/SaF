; ----------------------------------------------
; File contains Dwarf subobjects that are less important
;
; ----------------------------------------------
; ////////// Projectiles //////////////////////////
;------------------------------------------------------------------------------
; An invisible projectile
;------------------------------------------------------------------------------
Object DwarfProjInvisible
  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_Draw
    DefaultModelConditionState     
      Model = NONE
    End
  End

  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM

  ArmorSet
    Armor = NoArmor
  End

  VisionRange = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE NO_COLLIDE HIDE_IF_FOGGED
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
  ;  nothing
  End
    
 Behavior = BezierProjectileBehavior ModuleTag_04
    ; To tweak a Bezier path
  ;  DetonateCallsKill = Yes
    FirstHeight = 9  ; Height of Bezier control points above highest intervening terrain
    SecondHeight = 9
    FirstPercentIndent = 20% ; Percentage of shot distance control points are placed
    SecondPercentIndent = 90%
    FlightPathAdjustDistPerSecond = 50 ; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag. (45 is default human speed)
    GroundHitFX = FX_GondorArrowDeath
    CurveFlattenMinDist = 100.0
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 0.8
End
;------------------------------------------------------------------------------
; Standard Dwarf Arrow
;------------------------------------------------------------------------------
Object DwarfArrow
  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_Draw
    DefaultModelConditionState     
;      Model = G_Arrow
      Model = NONE
    End
  End

  Draw = W3DStreakDraw ModuleTag_Draw2
	Length		= 15
	Width		= 2
	NumSegments	= 1				; number of segements in the streak, increase for smoother line
	Color		= R:255 G:255 B:255
	Texture		= EXArrowStreak.tga
  End

  ; *** AUDIO Parameters ***

  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM

  ArmorSet
    Armor = NoArmor
  End

  VisionRange = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE NO_COLLIDE HIDE_IF_FOGGED
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
  End

  Behavior = DestroyDie ModuleTag_03
  ;  nothing
  End
    
 Behavior = BezierProjectileBehavior ModuleTag_04
    ; To tweak a Bezier path
  ;  DetonateCallsKill = Yes
    FirstHeight = 9  ; Height of Bezier control points above highest intervening terrain
    SecondHeight = 9
    FirstPercentIndent = 20% ; Percentage of shot distance control points are placed
    SecondPercentIndent = 90%
    FlightPathAdjustDistPerSecond = 50 ; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag. (45 is default human speed)
    GroundHitFX = FX_GondorArrowDeath
    CurveFlattenMinDist = 100.0
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 0.8
End

;------------------------------------------------------------------------------
; Mithril arrow FX, mostly a placeholder.
;------------------------------------------------------------------------------

ObjectReskin DwarfMithrilArrow DwarfArrow

  Draw = W3DScriptedModelDraw ModuleTag_Draw
    DefaultModelConditionState     
      Model = NONE
    End
  End
 
   Draw = W3DStreakDraw ModuleTag_Draw2
	Length		= 15
	Width		= 2
	NumSegments	= 1				; number of segements in the streak, increase for smoother line
	Color		= R:255 G:255 B:255
	Texture		= EXArrowStreak.tga
  End
  
  Draw = W3DStreakDraw ModuleTag_Draw3
	Length		= 50
	Width		= 1
	NumSegments	= 3				; number of segements in the streak, increase for smoother line
	Color		= R:150 G:150 B:128
	Texture		= EXLightStreaks2.tga
  End

End
;------------------------------------------------------------------------------
; Axes that the Khazad Guard throw
;------------------------------------------------------------------------------

Object KhazadGuardAxeProjectile

	Draw = W3DScriptedModelDraw ModuleTag_Draw
		DefaultModelConditionState 
			Model = dproj_khazaxe
				ParticleSysBone = Tracer1 KhazadGuardAxeTrail
				ParticleSysBone = Tracer2 KhazadGuardAxeTrail
			End
		IdleAnimationState
			Animation						 = dproj_khazaxe
				AnimationName			 = dproj_khazaxe.dproj_khazaxe
				AnimationMode			 = LOOP
			End					
		End
	End

	; *** AUDIO Parameters ***

	; ***DESIGN parameters ***
	EditorSorting		 = SYSTEM
	ArmorSet
		Armor = NoArmor
	End
	VisionRange = 0.0

	; *** ENGINEERING Parameters ***
	KindOf = PROJECTILE
	Body = ActiveBody ModuleTag_02
		MaxHealth			 = 10.0
	End

	Behavior = DestroyDie ModuleTag_03
		;nothing
	End
		
	Behavior = BezierProjectileBehavior ModuleTag_04
		; To tweak a Bezier path
		FirstHeight = 9	; Height of Bezier control points above highest intervening terrain
		SecondHeight = 9
		FirstPercentIndent = 50% ; Percentage of shot distance control points are placed
		SecondPercentIndent = 90%
		FlightPathAdjustDistPerSecond = 50 
			; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag. (45 is default human speed)
		DetonateCallsKill = Yes
		CurveFlattenMinDist = 60.0
	End

	Behavior = PhysicsBehavior ModuleTag_05
		KillWhenRestingOnGround = Yes
		GravityMult = 0.0
	End

	;commented out until art gets the correct Projectile bits
	; Behavior = CreateObjectDie ModuleTag_06
	;	DeathTypes = ALL
	;	CreationList = OCL_GimliAxeProjectileBits
	;End

	Behavior = FXListDie ModuleTag_07
		DeathTypes = ALL
		DeathFX = FX_GimliAxeProjectileHit
	End

	Geometry = Sphere
	GeometryIsSmall = Yes
	GeometryMajorRadius = 0.8
End
;------------------------------------------------------------------------------
; Mangonel Large Rock
;------------------------------------------------------------------------------
Object DwarfMangonelRockProjectile

  ; *** ART Parameters ***
  Draw = W3DScriptedModelDraw ModuleTag_Draw
   DefaultModelConditionState  
      Model               = dproj_rocklarge
      ParticleSysBone     = None TrebuchetRockTrail
    End
    AnimationState        = NONE
      Animation           = dproj_rocklarge
        AnimationName     = dproj_rocklarge.dproj_rocklarge
        AnimationMode     = LOOP
		AnimationSpeedFactorRange = 2 2
      End
    End
	
  End

  ; *** AUDIO Parameters ***
  SoundAmbient = CatapultProjectileFlying

  ; ***DESIGN parameters ***
  EditorSorting     = SYSTEM
  ArmorSet
    Armor = NoArmor
  End
  VisionRange = 0.0

  ; *** ENGINEERING Parameters ***
  KindOf = PROJECTILE
  ImmuneToShockwave = yes
  Body = ActiveBody ModuleTag_03
    MaxHealth       = 100.0
  End

  Behavior = DestroyDie ModuleTag_04
    ;nothing
  End
    
  Behavior = BezierProjectileBehavior ModuleTag_05
    DetonateCallsKill = Yes
    
    FirstHeight = 53;40  ; Height of Bezier control points above highest intervening terrain
    SecondHeight = 53
    FirstPercentIndent = 20% ; Percentage of shot distance control points are placed
    SecondPercentIndent = 80%
    FlightPathAdjustDistPerSecond   = 0 ; Can allow a max speed this can attempt to follow a target. Units are their velocity we can tag.
    PreLandingStateTime = 1000
    PreLandingEmotion = DOOM
    PreLandingEmotionRadius = 20.0
    InvisibleFrames = 100;
	FadeInTime = 100;
  End

  Behavior = PhysicsBehavior ModuleTag_06
  End

  Behavior = FXListDie ModuleTag_08
    DeathTypes = ALL
    DeathFX = FX_MangonelImpactHit
  End

  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 3.0
End
