Object DwarfGloin

; *** ART Parameters ***
	SelectPortrait = HPDwarf_Gloin
    ButtonImage = HIDwarf_Gloin

	ShadowMaxHeight = 999
	Draw = W3DScriptedModelDraw ModuleTag_01
