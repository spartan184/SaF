			;ParticleSysBone = B_HANDR GloinEmissaryFX FollowBone:Yes
			;ParticleSysBone = B_HANDL GloinEmissaryFX FollowBone:Yes
		End
		;Added by morgoth for the individual "expanding" fx effect.
