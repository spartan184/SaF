			Animation             = spec
				AnimationName     = RUGimli_CHRB
				AnimationMode     = LOOP
			End
			FrameForPristineBonePositions = 35
		End
;;------------------ ATTACKING  -------------------------------

		AnimationState        =  FIRING_OR_PREATTACK_B; WEAPONLOCK_SECONDARY
			Animation           = ATKA
				AnimationName     = RUGimli_ATKD
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End
	
		AnimationState        =  FIRING_OR_PREATTACK_A
			Animation           = ATKA
				AnimationName     = RUGimli_ATKA
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			Animation           = ATKB
				AnimationName     = RUGimli_ATKB
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End		
			Animation           = ATKC
				AnimationName     = RUGimli_ATKC
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End

;;-------------------- HIT REACTIONS --------------------------

		AnimationState = HIT_REACTION
			Animation = Hit_Level_1_a
				AnimationName = RUGimli_HITA
				AnimationMode = ONCE
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End
		
;;------------ EMOTIONS ---------------------------------------

;;====== LEVELED
		AnimationState				= LEVELED 						; This state clears itself in 3 seconds
			Animation				= LevelUp
				AnimationName		= RUGimli_CHRB
				AnimationMode		= ONCE
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End

		; === Anim state for Woodscraft power
		AnimationState				= USER_2
			StateName				= ATHELAS
			Animation				= ATKP
				AnimationName		= RUGimli_CHRA
				AnimationMode		= ONCE
			End
		End
		
;;====== CELEBRATING
		AnimationState			= EMOTION_CELEBRATING
			Animation           = CHRA
				AnimationName   = RUGimli_CHRA
				AnimationMode   = ONCE
			End
			Flags				= RESTART_ANIM_WHEN_COMPLETE
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End
		
		AnimationState					= EMOTION_ALERT
			Animation					= Ready
				AnimationName			= RUGimli_IDLA
				AnimationMode			= LOOP
				AnimationBlendTime  =   15
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End
		
;;------------------- SELECTED STATES -------------------------
		
		AnimationState				=	SELECTED
			StateName				=	AtAttentionIdle
			SimilarRestart			=   Yes			
			Animation				=	ATNB
				AnimationName		=	EUGloin_ATNB
				AnimationMode		=	LOOP
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_Select") end
			EndScript
		End
							
;;--------------- IDLE STATES ---------------------------------

		IdleAnimationState
			StateName				= STATE_Idle
			Animation          		= IDLB
				AnimationName     	= EUGloin_IDLB
				AnimationMode     	= ONCE
				AnimationPriority 	= 1
			End
			Animation           	= IDLC
				AnimationName   	= EUGloin_IDLC
				AnimationMode   	= ONCE
				AnimationPriority	= 1
			End
			BeginScript
				CurDrawableShowSubObject("PIPE")
				Prev = CurDrawablePrevAnimationState()
				if	Prev == "AtAttentionIdle" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
			EndScript
		End
	
;---Transitions-------------------------------------
		TransitionState       = TRANS_SelectedToIdle	
			Animation           = ATNC
				AnimationName     = EUGloin_ATNC
				AnimationMode     = ONCE
				AnimationSpeedFactorRange = 1 1
			End
			BeginScript
				CurDrawableShowSubObject("PIPE")
			EndScript
		End
		
		TransitionState			=	TRANS_Select
			Animation			=	ATNA
				AnimationName	=	EUGloin_ATNA
				AnimationMode	=	ONCE
				AnimationSpeedFactorRange = 1 1
			End
			BeginScript
				CurDrawableHideSubObject("PIPE")
			EndScript
		End
	End
	
