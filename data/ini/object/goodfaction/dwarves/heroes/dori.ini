;// aka Dori, Dwarf
Object DwarvenDori
	;// *** ART Parameters ***
	Scale                             = .93

  ;//SelectPortrait for Heros is portrait behind skill buttons. 
	SelectPortrait                    = UPDori
  ;// ButtonImage for Heros is button image on Hero Select UI to select hero. 
	ButtonImage                       = uidori


	;ShadowMaxHeight                  = 999 ;this is causing 2 shadows to be cast when the unit is under a bridge.  Taking it out!
	Draw                              = W3DScriptedModelDraw ModuleTag_01

		OkToChangeModelColor	          = Yes
		;;// ====================== MODELS ==================================
		DefaultModelConditionState
			Model                         = dudori_skn
			Skeleton                      = DUDain_SKL
			WeaponLaunchBone              = TERTIARY AXE02
		End

		ModelConditionState             = RIDER2
			Model                         = dudori_skn
			Skeleton                      = DUDain_SKL
		End


		; -- ANIMATIONS Start 

		;//;------------------ MOVING & DYING ---------------------------

		;//;======= DYING

		AnimationState        = STUNNED_FLAILING
			Animation           = FLYA
				AnimationName     = DUDain_FLYA
				AnimationMode     = LOOP
			End
			Flags               = RANDOMSTART
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		AnimationState        = DYING SPLATTED
			Animation           = LNDB
				AnimationName     = DUDain_LNDA
				AnimationMode     = ONCE
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		AnimationState        = DYING
			Animation           = DIEA
				AnimationName     = DUDain_DTHA
				AnimationMode     = ONCE
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		AnimationState        = STUNNED_STANDING_UP
			Animation           = GTPA
				AnimationName     = DUDain_GTPA
				AnimationMode     = ONCE
			End
		End

		AnimationState        = STUNNED
			Animation           = LNDA
				AnimationName     = DUDain_LNDA
				AnimationMode     = ONCE
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		;AnimationState						= PARALYZED
		;	Animation
		;		AnimationName				= DUDain_IDLA
		;		AnimationMode				= LOOP
		;	End
		;End

		;//;======= MOVING



;		AnimationState        = MOVING FIRING_OR_PREATTACK_A
;			ShareAnimation		= Yes
;			Animation           = RunAndFire
;				AnimationName       = DUDain_ATRA
;				AnimationMode       = LOOP
;			End
;			Flags               = RANDOMSTART
;		End

		AnimationState				=	RIDER2 MOVING ATTACKING
			Animation				=	RUNB
				AnimationName		=	duthorin_RUNC
				AnimationMode		=	LOOP
			End
			Flags					=	RANDOMSTART
;			ParticleSysBone		=	None InfantryDustTrails
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		AnimationState				=	MOVING ATTACKING
			Animation				=	RUNB
				AnimationName		=	duthorin_RUNB
				AnimationMode		=	LOOP
			End
			Flags					=	RANDOMSTART
;			ParticleSysBone		=	None InfantryDustTrails
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End

		AnimationState				=	MOVING
			Animation				=	RUNA
				AnimationName		=	duthorin_RUNA
				AnimationMode		=	LOOP
			End
			Flags					=	RANDOMSTART
;			ParticleSysBone		=	None InfantryDustTrails
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End


		;;//------------------ ATTACKING  -------------------------------

		;// AXE THROW
		AnimationState		= FIRING_OR_PREATTACK_C
			Animation			= SPCA
				AnimationName		= DUDain_SPCA
				AnimationMode		= ONCE
;//				UseWeaponTiming		= Yes
			End
			FrameForPristineBonePositions = 42;44
			;//ParticleSysBone     = None MeleeDust
			BeginScript
;				CurDrawableShowSubObject("AXE02")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End


		AnimationState        =  FIRING_OR_PREATTACK_A
			Animation           = ATKA
				AnimationName     = DUDain_ATKB ;DUDain_ATKA
				AnimationMode     = ONCE
				UseWeaponTiming		= Yes
			End

			;//ParticleSysBone None MeleeDust
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
			EndScript
		End


		;;//-------------------- HIT REACTIONS --------------------------
		AnimationState = HIT_REACTION
			Animation = Hit_Level_1_a
				AnimationName = DUDain_HITA
				AnimationMode = ONCE
			End
		End

		;;//------------ EMOTIONS ---------------------------------------

		;;//====== LEVELED
		AnimationState = LEVELED 						; This state clears itself in 3 seconds
			Animation				= LevelUp
				AnimationName		= duthorin_atnb ;DUDain_CHRA
				AnimationMode		= ONCE
			End
		End

		AnimationState						=	PACKING_TYPE_1
			StateName						=	SPELL
			Animation				= LevelUp
				AnimationName		= DUDain_SPCA
				AnimationMode		= ONCE
			End
      FXEvent	= Frame:10 Name: FX_DuBekarSelf
		End

		;;//====== CELEBRATING
		AnimationState			= EMOTION_CELEBRATING
			Animation           = CHRA
				AnimationName   = duthorin_atnb ;DUDain_CHRA
				AnimationMode   = ONCE
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
		End

		;;//====== TAUNTING
		AnimationState			= EMOTION_TAUNTING
			Animation
				AnimationName   = DUDain_TNTA
				AnimationMode   = ONCE
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
		End


		AnimationState					= EMOTION_ALERT
			Animation					= Ready
				AnimationName			=  duthorin_IDLC ;DUDain_IDLA
				AnimationMode			= LOOP
				AnimationBlendTime  =   15
			End
			BeginScript
				if Prev == "State_AboutToHitGround" then CurDrawableSetTransitionAnimState("TRANS_AboutToHitGround_To_Idle") end
			EndScript

		End

		;;//------------------- SELECTED STATES -------------------------

		AnimationState				=	SELECTED
			StateName				=	AtAttentionIdle
			SimilarRestart			=   Yes
			Animation				=	ATNB
				AnimationName		=	 duthorin_atnb
				AnimationMode		=	LOOP
			End
			BeginScript
;				CurDrawableHideSubObject("AXE02")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_Select") end
				if Prev == "AtAttentionIdle" then CurDrawableSetTransitionAnimState("TRANS_Select") end
				if Prev == "State_AboutToHitGround" then CurDrawableSetTransitionAnimState("TRANS_AboutToHitGround_To_Idle") end
			EndScript
		End

		;;//--------------- IDLE STATES ---------------------------------

		IdleAnimationState
			StateName				= STATE_Idle
			Animation           = IDLB
				AnimationName     = duthorin_IDLB
				AnimationMode     = ONCE
				AnimationPriority = 10
			End
			Animation           = IDLF
				AnimationName     = duthorin_IDLC
				AnimationMode     = ONCE
				AnimationPriority = 5
			End
			BeginScript
;				CurDrawableHideSubObject("AXE02")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "DwarfToss" then CurDrawableSetTransitionAnimState("TRANS_EndDwarfToss") end
				if Prev == "AtAttentionIdle" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
				if Prev == "State_AboutToHitGround" then CurDrawableSetTransitionAnimState("TRANS_AboutToHitGround_To_Idle") end
			EndScript
		End


		;//---Transitions-------------------------------------

		TransitionState       = TRANS_SelectedToIdle
			Animation           = ATNC
				AnimationName     = duthorin_atna
				AnimationMode     = ONCE_BACKWARDS
			End
		End

		TransitionState				=	TRANS_Select
			Animation				=	ATNA
				AnimationName		=	 duthorin_atna
				AnimationMode		=	ONCE
			End
		End 	
		; -- ANIMATIONS END 
	End 
	; -- Draw Module END 
	;// ***DESIGN parameters ***
	Side				                      = Dwarves
	EditorSorting		                  = UNIT
	ThreatLevel			                  = 4.0
	TransportSlotCount	              = 1
	BuildCost                         = DORI_BUILDCOST
	BuildTime                         = DORI_BUILDTIME
	HeroSortOrder		                  = 40

	WeaponSet
		Conditions 			                = None
		Weapon     			                = PRIMARY  DoriSword
		AutoChooseSources	              = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End

	ArmorSet
		Conditions                      = None
		Armor                           = HeroArmor
		DamageFX                        = NormalDamageFX
	End

	VisionRange			                  = VISION_STANDARD_MELEE
	ShroudClearingRange               = SHROUD_CLEAR_HERO
	BountyValue 	                    = 160
  
	DisplayName                       = OBJECT:DwarvenDori
	RecruitText                       = CONTROLBAR:DwarvenDoriRecruit
	ReviveText	                      = CONTROLBAR:DwarvenDoriRevive
	Hotkey		                        = CONTROLBAR:DwarvenDoriHotkey
  
	CrushableLevel	                  = 2  ;//What am I?: 0 = for infantry, 1 = for trees, 2 = general vehicles
	CommandSet                        = DwarvenDoriCommandSet

	;// *** AUDIO Parameters ***;
	VoiceAttack								        = GloinVoiceAttack
	VoiceAttackCharge						      = GloinVoiceAttackCharge
	VoiceAttackMachine						    = GloinVoiceAttack
	VoiceAttackStructure					    = GloinVoiceAttackStructure
	VoiceFear								          = GloinVoiceHelpMe
	VoiceGuard								        = GloinVoiceMove
	VoiceMove								          = GloinVoiceMove
	VoiceMoveToCamp							      = GloinVoiceRetreatCamp
	VoiceMoveWhileAttacking					  = GloinVoiceDisengage
	VoiceRetreatToCastle					    = GloinVoiceRetreat
	VoiceSelect								        = GloinVoiceSelect
	VoiceSelectBattle 						    = GloinVoiceSelectBattle
  VoicePriority							        = 78

	SoundImpact					              = ImpactHorse
  
	UnitSpecificSounds
		VoiceGarrison						        = BalinVoiceMoveGarrison
	End
  
  EvaEventDamagedOwner              = UnitUnderAttack		;Eva event to trigger when unit is damaged
	EvaEventDieOwner                  = DoriDie			;//Eva event to trigger on unit's death. NOTICE THAT this is only for permanent deaths

	Behavior                          = LargeGroupAudioUpdate ModuleTag_LGAU		;// Tie into LargeGroupAudio system
    Key                             = Dwarf Unit Infantry Hero
	End

	;ClientBehavior                    = ModelConditionAudioLoopClientBehavior ModuleTag_foo
	;	ModelCondition                  = Required:EMOTION_CELEBRATING	Excluded:DYING ENGAGED	Sound:EmotionDainVoxCheerLoop	;MOVING ATTACKING
	;	ModelCondition                  = Required:EMOTION_TAUNTING		Excluded:DYING ENGAGED	Sound:EmotionDainVoxTauntLoop	;MOVING ATTACKING
	;	ModelCondition                  = Required:EMOTION_POINTING		Excluded:DYING ENGAGED	Sound:EmotionDainVoxTauntLoop	;MOVING ATTACKING
	;End

	ClientBehavior                    = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap               = 800
		AnimationSound                  = Sound:FootstepDirtA			Animation:DUDain_SKL.DUDain_RUNA	Frames:3 14
		AnimationSound                  = Sound:FootstepDirtA			Animation:DUDain_SKL.duthorin_RUNC	Frames:3 12
    
		AnimationSound                  = Sound:BodyFallSoldier			Animation:DUDain_SKL.DUDain_LNDA	Frames:4
		AnimationSound                  = Sound:BodyFallSoldier			Animation:DUDain_SKL.DUDain_DIEA	Frames:11
		AnimationSound                  = Sound:BodyFallSoldier			Animation:DUDain_SKL.DUDain_DIEC	Frames:59
		AnimationSound                  = Sound:BodyFallSoldier			Animation:DUDAIN_SKL.DUDAIN_DTHA	Frames:73
		AnimationSound                  = Sound:SwordIntoGround		Animation:DUDAIN_SKL.DUDAIN_IDLE	Frames:61		;striking ground with axe
		AnimationSound                  = Sound:TauntHumanHitShield		Animation:DUDAIN_SKL.DUDAIN_SPCA	Frames:25 50	;hitting shield and sword
		AnimationSound                  = Sound:TauntHumanHitShield		Animation:DUDAIN_SKL.DUDAIN_TNTA	Frames:28 43	;hitting shield and sword
	End

	;// *** ENGINEERING Parameters ***
  RadarPriority                     = UNIT
  KindOf                            = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY PATH_THROUGH_EACH_OTHER SCORE THROWN_OBJECT HERO ARMY_SUMMARY ATTACK_NEEDS_LINE_OF_SIGHT
  PathfindDiameter                  = 40.0
  
	Body                              = RespawnBody ModuleTag_RespawnBody
		CheerRadius 				            = EMOTION_CHEER_RADIUS
		MaxHealth         			        = ORI_HEALTH	;//BALANCE Dain Health
		MaxHealthReallyDamaged          = 1100
		PermanentlyKilledByFilter	      = NONE			;//Who kills me permanently?
   DodgePercent      			          = HERO_DODGE_PERCENT
	End

	Behavior                          = RespawnUpdate ModuleTag_RespawnUpdate
		DeathAnim					              = DYING					;//Model condition to play when killed-to-respawn
		DeathFX						              = FX_DoriDieToRespawn	;//FXList to play when killed-to-respawn
		DeathAnimationTime			        = 4100					;//How long DeathAnim will take.
		InitialSpawnFX				          = FX_DoriInitialSpawn
		RespawnAnim					            = LEVELED				;//Animation to play when respawning.
		RespawnFX					              = FX_DoriRespawn		;//FXList to play when respawning.
		RespawnAnimationTime		        = 2000					;//Time it takes for respawn to play.
		AutoRespawnAtObjectFilter	      = NONE +CASTLE_KEEP		;//Respawn at this location -- and at it's exit production point if possible.
		ButtonImage					            = uidorires
    
		RespawnRules                    = AutoSpawn:No	  Cost:900		Time:90000		Health:100%		;DEFAULT VALUES
		RespawnEntry                    =	Level:2					Cost:1000		Time:90000						;For other levels, only override what is different.
		RespawnEntry                    =	Level:3					Cost:1100		Time:90000
		RespawnEntry                    =	Level:4					Cost:1200		Time:90000
		RespawnEntry                    =	Level:5					Cost:1300		Time:120000
		RespawnEntry                    =	Level:6					Cost:1400		Time:150000 ;120000
		RespawnEntry                    =	Level:7					Cost:1500		Time:180000 ;120000
		RespawnEntry                    =	Level:8					Cost:1600		Time:180000 ;120000
		RespawnEntry                    =	Level:9					Cost:1700		Time:180000 ;120000
		RespawnEntry                    =	Level:10				Cost:1800		Time:180000 ;120000
	End

    Behavior                        = AutoHealBehavior ModuleTag_GimliHealing
      StartsActive                  = Yes
      HealingAmount                 = HERO_HEAL_AMOUNT
      HealingDelay                  = 1000
      StartHealingDelay             = HERO_HEAL_DELAY
      HealOnlyIfNotInCombat         = Yes
    End
    
    Behavior                        = AIUpdateInterface ModuleTag_03
      AutoAcquireEnemiesWhenIdle    = Yes ATTACK_BUILDINGS
      MoodAttackCheckRate           = 500
      HoldGroundCloseRangeDistance  = 60
      AILuaEventsList							  = GimliFunctions
    End
    
    Behavior                        = AttributeModifierAuraUpdate ModuleTag_HeroRadiateFear
      StartsActive                  = No ;If no, requires upgrade to turn on.
      BonusName                     = HeroRadiateFear
      TriggeredBy                   = Upgrade_UnitFear
      RefreshDelay                  = 2000
      Range                         = 120
      TargetEnemy                   = Yes
      ObjectFilter                  = ANY +ORC
    End	

    Behavior                        = AutoAbilityBehavior ModuleTag_AutoAbilityBehavior
    End		

    LocomotorSet
      Locomotor                     = RohanGimliLocomotor
      Condition                     = SET_NORMAL 
      Speed                         = NORMAL_GOOD_HERO_SPEED
    End

    Behavior                        = PhysicsBehavior ModuleTag_04
      GravityMult                   = 1.0
      AllowBouncing                 = No
      ShockStunnedTimeLow           = 1400	;msec
      ShockStunnedTimeHigh          = 2400	;msec
      ShockStandingTime             = 2600	;msec
    End 

    Behavior                        = SquishCollide ModuleTag_06
      ;nothing
    End

    Behavior                        = SlowDeathBehavior ModuleTag_NormalDeath
      DeathTypes                    = NONE +KNOCKBACK
      SinkDelay                     = 3000
      SinkRate                      = 0.40     ; in Dist/Sec
      DestructionDelay              = 8000
    End
    
    Behavior                        = SlowDeathBehavior ModuleTag_FuckDeath
      DeathTypes                    = ALL -KNOCKBACK
      SinkDelay                     = 3000
      SinkRate                      = 0.40     ; in Dist/Sec
      DestructionDelay              = 8000
      Sound                         = INITIAL AotrThorinVoiceDie
    End

    Behavior                        = EmotionTrackerUpdate	Module_EmotionTracker
      TauntAndPointDistance         = 300		; max distance to taunted/pointed objet
      TauntAndPointUpdateDelay      = 1000	; how often scan (milliseconds)
      AddEmotion                    = Alert_Base
    End
  
    Behavior                        = HitReactionBehavior HitReactionBehaviorModuleTag
      HitReactionLifeTimer1         = 2200 ; level 1 (light  damage)  hit reaction animations in frames (5 per sec)
      HitReactionLifeTimer2         = 15 ; level 2 (medium damage)  hit reaction animations in frames (5 per sec)
      HitReactionLifeTimer3         = 10 ; level 3 (heavy  damage)  hit reaction animations in frames (5 per sec)

      HitReactionThreshold1         = 1.0   ; level 1 (light  damage) threshold trigger
      HitReactionThreshold2         = 2500.0  ; level 2 (medium damage) threshold trigger
      HitReactionThreshold3         = 5000.0  ; level 3 (heavy  damage) threshold trigger
    End 

