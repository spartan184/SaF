		BonusName		                    = DwarfBrothersThreeLeadership
		TriggeredBy		                  = Upgrade_GenericUpgrade1
		RefreshDelay	                  = 2000
		Range			                      = 200
		ObjectFilter	                  = NONE +DwarvenNori +DwarvenOri
	End
