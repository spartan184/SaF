				if Prev                     == "State_AboutToHitGround" then CurDrawableSetTransitionAnimState("TRANS_AboutToHitGround_To_Idle") end
			EndScript

		End
		;;//------------------- SELECTED STATES -------------------------
		
		AnimationState				          =	SELECTED
			StateName				              =	AtAttentionIdle
			SimilarRestart			          =   Yes			
			Animation                     = ATNB
