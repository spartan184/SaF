				AnimationName		               =	 DUGloin_ATNB
				AnimationMode		               =	LOOP
			End
			BeginScript
				Prev                           = CurDrawablePrevAnimationState()
				if Prev                        == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_Select") end
