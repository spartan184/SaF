	; ---- Lord of the Iron Hills: increase production of Mines + Forges
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_DainIH
		SpecialPowerTemplate = SpecialAbilityFakeLeadership2
		TriggeredBy = Upgrade_HeroLevel7 ;Level 7
	End

	Behavior = SpecialPowerModule ModuleTag_DainIHUpdate   
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership2
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
	End	
	
	Behavior = AttributeModifierAuraUpdate ModuleTag_DainIHModifier
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= DainLeadershipLordOfTheIronHills
		TriggeredBy		= Upgrade_HeroLevel7 
		RefreshDelay	= 2000
		Range			= 250
		ObjectFilter	= NONE +DwarfMine +DwarfForge +DwarfMineMultiplayer
	End
	; ---- Last Defence: when low on health, gain a chance to block attacks and +25% armor. when an attack is blocked, enemies run away
	; NEW PLAN: Damageincoming always triggers an OCLspecialpower, which spawns an egg
	; This EGG has an attributemodifier attached, which lasts 200 ms and sets USER_3
	
	; ---- hack for the button
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_Hackz
		SpecialPowerTemplate = SpecialAbilityFakeLeadership3
		TriggeredBy = Upgrade_HeroLevel10 ;Level 7
	End

	Behavior = SpecialPowerModule ModuleTag_TehHax  
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership3
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
	End	
	; ---- hack for the button end 
	
	Behavior = OCLSpecialPower ModuleTag_Condition_Damageincoming
        SpecialPowerTemplate = SpecialAbilityDainDamageIncoming
        OCL                  = OCL_SpawnLastDefenceDamageIncomingFlag
        CreateLocation       = USE_OWNER_OBJECT
    End
	
	; This attributemodifier sets USER_4 when Level 10 is reached
	Behavior = AttributeModifierAuraUpdate ModuleTag_Condition_LevelReq
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= DainBlockBonusEnabler
		TriggeredBy		= Upgrade_HeroLevel10
		RefreshDelay	= 2000
		Range			= 25
		AllowSelf        = Yes    
		ObjectFilter	= NONE +DwarfDain
	End
	
	; To trigger USER_2, we should just be able to use the REALLYDAMGED modelcondition
	
	; --- LUA triggered blocking power
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_AragornBladeMasterBlockEnabler
		SpecialPowerTemplate = SpecialPowerBlockAttack
		TriggeredBy = Upgrade_HeroLevel1
	End

	Behavior = SpecialPowerModule ModuleTag_AragornBladeMasterBlock          
		SpecialPowerTemplate      = SpecialPowerBlockAttack
		UpdateModuleStartsAttack  = No
		AttributeModifier		  = DainBlockBonus
		AttributeModifierAffectsSelf = Yes
		SetModelCondition		= ModelConditionState:HERO
		SetModelConditionTime	= 5.0
		InitiateSound			= DainVoiceLastDefence
	End
	
	
	Geometry = CYLINDER
	GeometryMajorRadius = 5.6
	GeometryMinorRadius = 5.6
	GeometryHeight = 16.0
	GeometryIsSmall = Yes
	
  Shadow = SHADOW_DECAL
  ShadowSizeX = 19;
  ShadowSizeY = 19;
  ShadowTexture = ShadowI;
End

