Object DwarfThorinStone
	; *** ART Parameters ***

	SelectPortrait = HPDwarf_Thorin
    ButtonImage = HIDwarf_Thorin
    
	Draw = W3DScriptedModelDraw ModuleTag_DRAW
		OkToChangeModelColor = Yes
		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
		ParticlesAttachedToAnimatedBones = Yes
		DefaultModelConditionState
			Model               = duthorin_SKN
		End


		

		TransitionState				= TRANS_boredToAttention
			Animation				= euthorin_ATNc
				AnimationName		= euthorin_SKL.euthorin_ATNc
				AnimationMode		= ONCE
			End
		End
		
		TransitionState				= TRANS_attentionToBored
			Animation				= euthorin_ATNa
				AnimationName		= euthorin_SKL.euthorin_ATNa
				AnimationMode		= ONCE
			End
			Flags					= START_FRAME_LAST
		End

	; --- Idle Anims
		IdleAnimationState
			StateName				= STATE_bored
			
			Animation				= euthorin_IDLE		;no_fidget
				AnimationName		= euthorin_SKL.euthorin_IDLb
				AnimationMode		= ONCE
				AnimationPriority	= 12
			End
			
			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if	Prev == "STATE_attention" or
					Prev == "STATE_running" or
					Prev == "OATH_BREAKERS" then CurDrawableSetTransitionAnimState("TRANS_attentionToBored") end
			EndScript
		End
		
		AnimationState			= THROWN_PROJECTILE
			Animation			= FLYA
				AnimationName	= euthorin_SKL.euthorin_FLYA
				AnimationMode	= LOOP
			End
		End
		
		AnimationState			= STUNNED_FLAILING
			Animation			= FLYA
				AnimationName	= euthorin_SKL.euthorin_FLYA
				AnimationMode	= LOOP
			End
		End
		
		AnimationState 			= DYING SPLATTED
			Animation 		= Splatted_On_Ground
				AnimationName	= euthorin_SKL.euthorin_LNDA
				AnimationMode	= ONCE
			End
			EnteringStateFX		= FX_SoldierHitGround
		End
		
		; --- Dying anims
		AnimationState				= DYING
			Animation				= euthorin_diea
				AnimationName		= euthorin_SKL.euthorin_DIEA
				AnimationMode		= ONCE
			End
			
		End
		
		AnimationState				= STUNNED_STANDING_UP
			Animation				= euthorin_GTPB
				AnimationName		= euthorin_SKL.euthorin_GTPa
				AnimationMode		= ONCE
				AnimationSpeedFactorRange = 1.5 1.5
			End
		End

		AnimationState			= STUNNED
			Animation			= LNDA
				AnimationName	= euthorin_SKL.euthorin_LNDA
				AnimationMode	= ONCE
			End
			EnteringStateFX		= FX_SoldierHitGround
		End	
	; ----------- Aegis of Erebor
		AnimationState						=	PACKING_TYPE_1
			StateName						=	SPELL
			Animation						=	SPCC
				AnimationName				=	euthorin_SKL.euthorin_chra
				AnimationSpeedFactorRange	=	1 1
				AnimationMode				=	ONCE
			End		
		End
		
		
		AnimationState						=	PACKING_TYPE_2
			StateName						=	SPELL
			Animation						=	SPCC
				AnimationName				=	euthorin_SKL.euthorin_chra
				AnimationSpeedFactorRange	=	1 1
				AnimationMode				=	ONCE
			End		
		End
		
	; -- Mighty Blow
		AnimationState        = SPECIAL_WEAPON_ONE
		Animation           = Smacky
			AnimationName     = euthorin_SKL.euthorin_spca
			AnimationMode     = ONCE
			
		End
		ParticleSysBone     = B_SWORDBONE ThorinMightyBlowGlowFX FollowBone:yes
		ParticleSysBone     = B_SWORDBONE ThorinMightyBlowSparksFX FollowBone:yes
		FXEvent	= Frame:42 Name: FX_ThorinMightyBlowImpact
	End

	; --- Attacking Anims [Weapon_A]
	
	
	
		AnimationState        = MOVING FIRING_OR_PREATTACK_A
			ShareAnimation		= Yes
			Animation           = RunAndFire
				AnimationName       = euthorin_SKL.euthorin_ATRA
				AnimationMode       = LOOP
			End
			Flags               = RANDOMSTART  
		End
		
		

		AnimationState				= FIRING_OR_PREATTACK_A
			StateName				= STATE_ready
			Animation				= ATKD
				AnimationName		= euthorin_SKL.euthorin_ATKa
				AnimationMode		= ONCE
				UseWeaponTiming		= Yes
				AnimationPriority	= 3
			End
			Animation				= ATKE
				AnimationName		= euthorin_SKL.euthorin_ATKb
				AnimationMode		= ONCE
				UseWeaponTiming		= Yes
				AnimationPriority	= 2
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
		End

	; --- Moving Anims	
		AnimationState				= MOVING
			StateName				= STATE_running
			
			Animation				= euthorin_RUNa
				AnimationName		= euthorin_SKL.euthorin_RUNa
				AnimationMode		= LOOP
			End
		End

		AnimationState				= LEVELED	; This state clears itself in 3 seconds
			Animation				= LevelUp
				AnimationName		= euthorin_SKL.euthorin_chra
				AnimationMode		= ONCE
			End
		End

		
		
		
	; --------- Click and Hit Reactions ------------

		AnimationState				= HIT_REACTION HIT_LEVEL_3
			StateName				= STATE_bored
			Animation				= Hit_Level_1_b
				AnimationName		= euthorin_SKL.euthorin_HITB
				AnimationMode		= ONCE
			End
		End
		
	;----Emotion Animations

		AnimationState				= EMOTION_CELEBRATING
			StateName				= STATE_ready
			Animation				= CHRB
				AnimationName		= euthorin_SKL.euthorin_CHRa
				AnimationMode		= ONCE
				AnimationPriority	= 1
			End
			Flags					= RESTART_ANIM_WHEN_COMPLETE				
		End
		
		AnimationState				= EMOTION_ALERT
			StateName				= STATE_ready
			Animation				= IDLA
				AnimationName		= euthorin_SKL.euthorin_IDLA
				AnimationMode		= ONCE
				AnimationPriority	= 1
			End
		End

		;AnimationState				= EMOTION_MORALE_HIGH
		;	StateName				= STATE_ready
		;	Animation				= ATKN
		;		AnimationName		= GUAragorn_SKL.GUAragorn_ATKN
		;		AnimationMode		= ONCE
		;		AnimationPriority	= 1
		;	End
		;	Animation				= ATKP
		;		AnimationName		= GUAragorn_SKL.GUAragorn_ATKP
		;		AnimationMode		= ONCE
		;		AnimationPriority	= 15
		;	End
		;	Animation				= TNTC
		;		AnimationName		= GUAragorn_SKL.GUAragorn_TNTD
		;		AnimationMode		= ONCE
		;		AnimationPriority	= 30
		;	End
		;	Animation				= TNTD
		;		AnimationName		= GUAragorn_SKL.GUAragorn_TNTD
		;		AnimationMode		= ONCE
		;		AnimationPriority	= 30
		;	End
		;	Flags					= RESTART_ANIM_WHEN_COMPLETE				
		;End
		
		AnimationState				= ENGAGED
			StateName				= STATE_ready
			Animation				= IDLA
				AnimationName		= euthorin_SKL.euthorin_IDLA
				AnimationMode		= ONCE
				UseWeaponTiming		= Yes
				AnimationPriority	= 1
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
		End

		AnimationState				= SELECTED
			StateName				= STATE_attention
			Animation				= ATNE
				AnimationName		= euthorin_SKL.euthorin_ATNb
				AnimationMode		= LOOP
				AnimationBlendTime	= 5
				AnimationMustCompleteBlend = yes
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_bored" then CurDrawableSetTransitionAnimState("TRANS_boredToAttention") end
			EndScript
		End
				
	End

; ***DESIGN parameters ***
	Side = Dwarves
	EditorSorting = UNIT
	ThreatLevel = 5.0
	ThingClass = CHARACTER_UNIT
	TransportSlotCount = 1

	DisplayMeleeDamage = M_THORIN_DAMAGE
	
	HeroSortOrder = 20

	BuildCost = M_THORIN_BUILDCOST
	BuildTime = M_THORIN_BUILDTIME
	MaxSimultaneousOfType = 1
  
	WeaponSet
		Conditions		= None 
		Weapon			= PRIMARY    DwarfThorinStoneSword
	End

	ArmorSet
		Conditions		= None
		Armor           = ThorinHeroArmor
		DamageFX        = NormalDamageFX
	End
	VisionRange = M_VISION_STANDARD_MELEE				
	ShroudClearingRange = M_SHROUD_CLEAR_STANDARD

	BountyValue = M_THORIN_BOUNTY_VALUE
	DisplayName = OBJECT:DwarfThorinStone
	RecruitText = CONTROLBAR:DwarfThorinStoneRecruit
	ReviveText	= CONTROLBAR:DwarfThorinStoneRevive
	Hotkey		= CONTROLBAR:DwarfThorinStoneHotkey
	CrushableLevel = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
;  CrusherLevel = 1
    

	CommandSet = DwarfThorinStoneCommandSet 
	CommandPoints = 0 ; 0


	; *** AUDIO Parameters ***;
	
	VoiceAmbushed			= ThorinVoiceAmbushed
	VoiceAttack				= ThorinVoiceAttack
	VoiceAttackCharge		= ThorinVoiceAttackCharge
	VoiceAttackMachine		= ThorinVoiceAttack
	VoiceAttackStructure	= ThorinVoiceAttackStructure
	VoiceFear 				= ThorinVoiceHelpMe
	VoiceMove				= ThorinVoiceMove
	VoiceMoveToCamp			= ThorinVoiceRetreatCamp
	VoiceMoveWhileAttacking	= ThorinVoiceDisengage
	VoicePriority			= 67
	VoiceRetreatToCastle	= ThorinVoiceRetreat
	VoiceSelect				= ThorinVoiceSelect
	VoiceSelect2			= ThorinVoiceSelect
	VoiceSelectBattle 		= ThorinVoiceSelectBattle
	VoiceGuard				= ThorinVoiceMove

	SoundImpact					= ImpactHorse
	
;AragornVoiceDismissOathbreakers
;AragornVoiceJoinAnybody

	UnitSpecificSounds
		VoiceGarrison			= ThorinVoiceGarrison
	End

	EvaEventDamagedOwner			= UnitUnderAttack 	;Eva event to trigger when unit is damaged
	EvaEventDieOwner				= ThorinDie	;Eva event to trigger on unit's death. NOTICE THAT this is only for permanent deaths
					     		; For deaths you can respawn from, use the DeathFX

	Behavior = LargeGroupAudioUpdate ModuleTag_LGAU			; Tie into LargeGroupAudio system
		Key = Human Unit Infantry Hero
		UnitWeight = 2
	End

	ClientBehavior = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap = 800
			
		AnimationSound = Sound: ThorinMightyBlowChargeSound					Animation:euthorin_SKL.euthorin_spca	Frames:1
		AnimationSound = Sound:BodyFallGenericNoArmor				Animation:euthorin_SKL.euthorin_DIEA	Frames:55
		AnimationSound = Sound:BodyFallSoldier					Animation:euthorin_SKL.euthorin_LNDA	Frames:1
	End


	; *** ENGINEERING Parameters ***
	RadarPriority = UNIT
	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS INFANTRY PATH_THROUGH_EACH_OTHER SCORE HERO ARMY_SUMMARY
	PathfindDiameter = 40.0

	Body = RespawnBody ModuleTag_RespawnBody
		CheerRadius 			= M_EMOTION_CHEER_RADIUS
		MaxHealth         		= M_THORIN_HEALTH
		PermanentlyKilledByFilter	= NONE		;Who kills me permanently?
   		DodgePercent      		= M_HERO_DODGE_PERCENT				
	End
	
	Behavior = RespawnUpdate ModuleTag_RespawnUpdate
		DeathAnim				= DYING				;Model condition to play when killed-to-respawn
		DeathFX				= FX_ThorinDieToRespawn     	;FXList to play when killed-to-respawn
		DeathAnimationTime		= 3933				;How long DeathAnim will take.
		InitialSpawnFX			= FX_ThorinInitialSpawn	;FXList to play when respawning.
		RespawnAnim				= LEVELED				;Animation to play when respawning.
		RespawnFX				= FX_ThorinRespawn	;FXList to play when respawning.
		RespawnAnimationTime		= 2000				;Time it takes for respawn to play.
		AutoRespawnAtObjectFilter	= NONE +CASTLE_KEEP		;Respawn at this location -- and at it's exit production point if possible.
		ButtonImage				= HIDwarf_Thorin
		
		;RespawnEntries determine the ruleset for how a character can be revived. Some units may automatically respawn, others
		;may require a specific revive action performed on him. You can specify different values for each level... or use Level:Any
		RespawnRules =			AutoSpawn:No	Cost:900		Time:90000		Health:100%		;DEFAULT VALUES
		RespawnEntry =	Level:2				Cost:1100		Time:90000						;For other levels, only override what is different.
		RespawnEntry =	Level:3				Cost:1300		Time:90000
		RespawnEntry =	Level:4				Cost:1500		Time:90000
		RespawnEntry =	Level:5				Cost:2000		Time:120000 ; Cost:1600
		RespawnEntry =	Level:6				Cost:2200		Time:120000 ; 1800
		RespawnEntry =	Level:7				Cost:2400		Time:120000 ; 2000
		RespawnEntry =	Level:8				Cost:2500		Time:120000 ; 2200
		RespawnEntry =	Level:9				Cost:2700		Time:120000 ; 2400
		RespawnEntry =	Level:10			Cost:3100		Time:120000 ; 3000
	End
	
	; ---- Thorin starts at level 5
	Behavior = ExperienceLevelCreate ModuleTag_MPLevelBonus
		LevelToGrant = 5
		MPOnly = Yes
	End
	
	Behavior = AutoAbilityBehavior ModuleTag_AutoAbilityBehavior
	End	
	
	Behavior = GrantUpgradeCreate ModuleTag_GrantUpdateRavenSight
		UpgradeToGrant = Upgrade_ThorinExists
	End
	
	; -------- Thorin special power behaviours -----------
	; ------- Heir to the mountain --------- handled in Dain's behaviours
	; ------- Prince of Erebor: +attack to dwarves
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_ThorinLeader
		SpecialPowerTemplate = SpecialAbilityFakeLeadership
		TriggeredBy = Upgrade_GenericUpgrade3
	End

	Behavior = SpecialPowerModule ModuleTag_ThorinLeadershipUpdate   
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
	End	
	
	Behavior = AttributeModifierAuraUpdate ModuleTag_ThorinLeaderModifier
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= ThorinLeadershipPrinceOfErebor
		TriggeredBy		= Upgrade_GenericUpgrade3
		RefreshDelay	= 2000
		Range			= 230
		ObjectFilter	= ANY +INFANTRY -CAVALRY  -STRUCTURE -BASE_FOUNDATION -HERO
	End
	; ------- Mighty Blow: hit a single target for knockdown, cripple and damage
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_BlowEnabler
		SpecialPowerTemplate = SpecialAbilityThorinMightyBlow
		TriggeredBy = Upgrade_GenericUpgrade4
	End 
	Behavior = SpecialPowerModule ModuleTag_BlowStarter                      
		SpecialPowerTemplate      = SpecialAbilityThorinMightyBlow
		UpdateModuleStartsAttack  = Yes
		StartsPaused = Yes
		InitiateSound = ThorinVoiceMightyBlow
	End
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_BlowUpdate   
		SpecialPowerTemplate    = SpecialAbilityThorinMightyBlow
		SkipContinue			= Yes

		UnpackTime				= 1100 
		PreparationTime			= 1
		PersistentPrepTime		= 500 
		PackTime				= 500 
		MustFinishAbility		= Yes
		
		AwardXPForTriggering		= 0		
		StartAbilityRange			= 35.0		;a bit above actual weapon range
		
		SpecialWeapon				= DwarfThorinStoneMightyBlow 
		WhichSpecialWeapon			= 1
	End
	; ------- Last defender
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_LDEnabler
		SpecialPowerTemplate = SpecialAbilityThorinLastDefender
		TriggeredBy = Upgrade_GenericUpgrade8
	End
	
	Behavior = OCLSpecialPower ModuleTag_LDThinng
		UpdateModuleStartsAttack  = Yes
		StartsPaused = Yes
        SpecialPowerTemplate = SpecialAbilityThorinLastDefender
        OCL                  = OCL_SpawnLastDefenderField
        CreateLocation       = USE_OWNER_OBJECT
		TriggerFX				= FX_ThorinLastDefenceEmitter
    End
	
	Behavior = SpecialAbilityUpdate ModuleTag_LDAnimation
		SpecialPowerTemplate	= SpecialAbilityThorinLastDefender
		UnpackingVariation		= 1
		UnpackTime              = 500
 		PreparationTime         = 200  
 		PackTime                = 1330	
 	End
	
	; --------- Stonehelm: buff thorin defence + health by a million, mask gets unhidden, units flee
	
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_ThorinStonehelmEnabler
		SpecialPowerTemplate = SpecialAbilityThorinStonehelm
		TriggeredBy = Upgrade_GenericUpgrade10
	End
	Behavior = SpecialPowerModule ModuleTag_ThorinStonehelm                     
		SpecialPowerTemplate		= SpecialAbilityThorinStonehelm
		StartsPaused = Yes
		AttributeModifier = ThorinStonehelm
		AttributeModifierRange = 5
		AttributeModifierAffectsSelf = Yes
		AttributeModifierAffects = NONE +DwarfThorinStone 
		UpdateModuleStartsAttack	= Yes
		TriggerFX				= FX_ThorinStonehelm
	End
	
	Behavior = SpecialAbilityUpdate ModuleTag_Stonehelm  
		SpecialPowerTemplate		= SpecialAbilityThorinStonehelm
		UnpackTime					= 1
		UnpackingVariation		= 2
		AwardXPForTriggering		= 0		
		TriggerSound				= ThorinStonehelmSound
		;Instant						= Yes
	End
	
	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		AddEmotion	=	Terror_Base
		AddEmotion	=	OVERRIDE UncontrollableFear_Base_Evil
		Duration			=	M_THORIN_STONEHELM_DURATION	
		End
		AddEmotion	=	Alert_Base
		IgnoreVeterancy = Yes
	End
	
	; --- Auto healing
	Behavior = AutoHealBehavior ModuleTag_GimliHealing
		StartsActive = Yes
		HealingAmount = M_HERO_HEAL_AMOUNT
		HealingDelay = 1000
		StartHealingDelay = M_HERO_HEAL_DELAY
		HealOnlyIfNotInCombat = Yes
	End
	
	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS
		MoodAttackCheckRate        = 500
		AILuaEventsList				= DwarfThorinStoneFunctions
	End

	LocomotorSet
