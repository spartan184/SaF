	Behavior = AutoHealBehavior ModuleTag_RoacHealing
		StartsActive = Yes
		HealingAmount = M_HERO_HEAL_AMOUNT
		HealingDelay = 1000
		StartHealingDelay = M_HERO_HEAL_DELAY
		HealOnlyIfNotInCombat = Yes
	End
	
	; Roac special powers
	; Lineage of Erebor: Ravens +30% armor
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_RoacLin
		SpecialPowerTemplate = SpecialAbilityFakeLeadership
		TriggeredBy = Upgrade_GenericUpgrade1
	End

	Behavior = SpecialPowerModule ModuleTag_RoaclineageUpdate   
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
	End	
	
	Behavior = AttributeModifierAuraUpdate ModuleTag_RoaclineageModifier
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= RoacLeadershipLineage
		TriggeredBy		= Upgrade_GenericUpgrade1
		RefreshDelay	= 2000
		Range			= 180
		ObjectFilter	= NONE +DwarfRaven
	End
	
	; Eldest: reduce nearby enemy cavalry speed by 5%
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_RoacEldest
		SpecialPowerTemplate = SpecialAbilityFakeLeadership2
		TriggeredBy = Upgrade_GenericUpgrade3 ; level 3
	End

	Behavior = SpecialPowerModule ModuleTag_RoacEldestUpdate   
		SpecialPowerTemplate      = SpecialAbilityFakeLeadership2
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
	End	
	
	Behavior = AttributeModifierAuraUpdate ModuleTag_RoacEldestModifier
		StartsActive	= No ;If no, requires upgrade to turn on.
		BonusName		= RoacLeadershipEldest
		TriggeredBy		= Upgrade_GenericUpgrade3
		RefreshDelay	= 2000
		Range			= 180
		TargetEnemy		= Yes
		ObjectFilter		= NONE ENEMIES +INFANTRY +CAVALRY -STRUCTURE -BASE_FOUNDATION -HERO
	End
	
	; Dain's Messenger: increase roac speed by 35% for 20s
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_MessengerEnabler
		SpecialPowerTemplate = SpecialAbilityRoacMessenger
		TriggeredBy = Upgrade_GenericUpgrade5
	End
	Behavior = SpecialPowerModule ModuleTag_MessengerUpdate   
		SpecialPowerTemplate      = SpecialAbilityRoacMessenger
		UpdateModuleStartsAttack  = No
		StartsPaused = Yes
		AttributeModifier = RoacMessenger
		;AttributeModifierRange = 10
		AttributeModifierAffectsSelf = Yes
		AttributeModifierAffects = ANY  
		TriggerFX				= FX_RoacMessenger
		
	End
	
	
	Behavior = PhysicsBehavior ModuleTag_04
	End
	
	
	Behavior = SquishCollide ModuleTag_06
		;nothing
