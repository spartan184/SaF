;------------------------------------------------------------------------------
;
;	Khazad Guard hordes - for all types
;		
;
;------------------------------------------------------------------------------
; Stock Khazad Guard horde
;------------------------
Object DwarfKhazadGuardHorde

	MaxSimultaneousOfType = 2
	
	ButtonImage		= UIDwarf_KhazadGuard
	SelectPortrait	= UPDwarf_KhazadGuard

	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER EMOTION_TERROR EMOTION_LOOK_TO_SKY SELECTED SPECIAL_WEAPON_ONE
		DefaultModelConditionState
			Model = None ;InvisHrdeTmp5x2
		End

		ModelConditionState = HORDE_EMPTY
			Model = None
		End		
		
		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGUSol
		End		
	End
	
	Side = Dwarves
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:HordeKhazadGuard
		
	WeaponSet
		Conditions = None 
		Weapon = PRIMARY    NormalMeleeHordeRangefinder
	End
	
	WeaponSet
		Conditions = WEAPONSET_TOGGLE_1
		Weapon = PRIMARY    NormalMissileHordeRangefinder
	End

	; *** AUDIO Parameters ***;
	; Note: Don't put voice parameters here -- they will be ignored. Voice play requests
	; are always passed through to members

	UnitSpecificSounds
		VoiceDesperateAttack  = GondorSoldierVoiceDesperateCharge 
	End

	BuildCost = M_DWARVES_KHAZAD_BUILDCOST
	BuildTime = M_DWARVES_KHAZAD_BUILDTIME      
	VisionRange = M_DWARVES_KHAZAD_HORDE_VISION_RANGE
	CommandPoints = 48
	
	FormationWidth = 2 ; Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth = 1 ; Depth it occupies in formations. Current choices are 1 or 2.
	
 	CrushableLevel = 0  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 0
	 
    TransportSlotCount = 1
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE MELEE_HORDE ARCHER NOTIFY_OF_PREATTACK ARMY_SUMMARY;;UNATTACKABLE 
	
	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End
	
	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle	= Yes ATTACK_BUILDINGS
		MoodAttackCheckRate			= 500
		MaxCowerTime				=	5000
		MinCowerTime				=	3000
		AILuaEventsList				= DwarfKhazadGuardHordeFunctions	; 
		AttackPriority				= AttackPriority_Infantry
	End

	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DwarfKhazadGuard 8
		Slots = 8
		PassengerFilter	= NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	;Used to determine which armorset to use (and anything else we want!)
		

		; Banner Carrier info		
		BannerCarriersAllowed	= DwarfBannerGuards									; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:DwarfKhazadGuard	Pos:X:15.0 Y:0.0		; (DEFAULT) position of banner carrier
		
		; -- Erebor Captain
		;LeadersAllowed = EreborCaptain
		;LeaderPosition   = X:60.0 Y:0.0 Z:0.0
		;LeaderRank		= 1
		
		; Positions for 8
		RankInfo = RankNumber:1 UnitType:DwarfKhazadGuard Position:X:0 Y:10 Position:X:0 Y:-10 Position:X:0 Y:-25 Position:X:0 Y:25
		RankInfo = RankNumber:2 UnitType:DwarfKhazadGuard Position:X:-14 Y:10 Position:X:-14 Y:-10 Position:X:-14 Y:-25 Position:X:-14 Y:25
		
		RanksToReleaseWhenAttacking = 1 2

		; Normal Formations		
	;	ComboHorde = Target:GondorFighterHorde	Result:GondorFighterx2ComboHorde		InitiateVoice:GondorSoldierVoiceJoinAnybody

		; Alternate formations
	;	ComboHorde = Target:GondorFighterHordeBlock				Result:GondorFighterx2ComboHorde		InitiateVoice:GondorSoldierVoiceJoinAnybody

		UpdateWeaponSetFlagsOnHordeToo = Yes
		AlternateFormation = DwarfKhazadGuardHordeSchiltron
		MeleeAttackLeashDistance = 25; How far the hordes can move from the center of the horde when melee attacking.				
		BackUpMinDelayTime		= 1		; The minimum amount of time to delay before backing up
		BackUpMaxDelayTime		= 3000		; The maximum amount of time to delay before backing up
		BackUpMinDistance		= 1			; The minimum number of cells to backup
		BackUpMaxDistance		= 3			; The maximum number of cells to backup
		BackupPercentage		= 80%		; The amount of chance that a unit will back up.
	End

	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End
	
	Behavior = CommandButtonHuntUpdate ModuleTag_CommandButtonHuntUpdate
	End
  
   	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	M_INFANTRY_TAUNT_POINT_RADIUS		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000		; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
 		AfraidOf			=	NONE +GondorGwaihir +RohanTreeBerd +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorBalrog +MordorFellBeast +MordorWitchKingOnFellBeast  +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorMumakil ;Must be SCARY kindof as well.
		AlwaysAfraidOf				=	NONE +MordorBalrog +RohanOathbreaker +MordorSauron ;+MordorWitchKing +MordorWitchKingOnFellBeast 
 		PointAt				=	NONE +MordorFellBeast +MordorWitchKingOnFellBeast 
		HeroScanDistance		=	150
		FearScanDistance		=	M_INFANTRY_FEAR_SCAN_RADIUS

		AddEmotion			=	Terror_Base
		AddEmotion			=	Doom_Base				;OVERRIDE
		AddEmotion			=	UncontrollableFear_Base			;OVERRIDE
		AddEmotion			=	FearIdle_Base				;OVERRIDE
		AddEmotion			=	FearBusy_Base				;OVERRIDE
		AddEmotion			=	Point_Base				;OVERRIDE
		AddEmotion			=	Taunt_Base				;OVERRIDE
 		AddEmotion			=	CheerIdle_Base
		AddEmotion			=	CheerBusy_Base
		AddEmotion			=	HeroCheerIdle_Base
		AddEmotion			=	HeroCheerBusy_Base
		AddEmotion			=	Alert_Base
	End	
  
	LocomotorSet
		Locomotor     = NormalMeleeHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = M_DWARVES_INFANTRY_HORDE_SPEED
	End
	LocomotorSet
		Locomotor     = ScaredMeleeHordeLocomotor
		Condition     = SET_SCARED
		Speed         = M_DWARVES_INFANTRY_HORDE_SPEED
	End
	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	Behavior = AttributeModifierAuraUpdate ModuleTag_Bodyguard
		StartsActive	= Yes
		BonusName		= KhazadGuardBodyguardBonus
		RefreshDelay	= 1000
		Range		= 150
		ObjectFilter	= NONE +DwarfGloin +DwarfThorin +DwarfDain +DwarfGimli
	End
	
	Behavior = LevelUpUpgrade ModuleTag_BasicTraining
		TriggeredBy = Upgrade_DwarvesBanner Upgrade_TechnologyDwarvesBanners
		RequiresAllTriggers = Yes;		
		LevelsToGain = 1
		LevelCap = 2
	End
	
	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality
		TriggeredBy = Upgrade_DwarvesMetallurgy ;Upgrade_TechnologyDwarvesMetallurgy
		RequiresAllTriggers = Yes
	End
	
	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality2
		TriggeredBy = Upgrade_DwarvesHeavyArmor ;Upgrade_TechnologyDwarvesHeavyArmor
		RequiresAllTriggers = Yes
	End
	 
	
	; Throwing axe stuff
	
	
	
	; Sets User_1, lua grants Upgrade_DwarfThrowAxe
	Behavior = SpecialPowerModule ModuleTag_AxeThrowUser_1
		SpecialPowerTemplate      = SpecialAbilityKhazadGuardSwapWeapon
		UpdateModuleStartsAttack  = No
		AttributeModifier = DwarfKhazadGuardAxeThrowUSER_1
		AttributeModifierAffectsSelf = Yes
		AttributeModifierAffects = NONE +DwarfKhazadGuardHorde +DwarfKhazadGuard  ;
		AttributeModifierFX = None
	End
	
	Behavior = WeaponModeSpecialPowerUpdate ModuleTag_SwitchToWeaponset1
		SpecialPowerTemplate	= SpecialAbilityKhazadGuardSwapWeapon
		Duration				= 10000
		;AttributeModifier		= None
		WeaponSetFlags			= WEAPONSET_TOGGLE_1
		StartsPaused			= No
		;InitiateSound 			= AragornBladeMaster		;this doesn't work
	End
	
	CommandSet = DwarfKhazadGuardHordeCommandSet

	Geometry = BOX
	GeometryMajorRadius = 20.0
	GeometryMinorRadius = 20.0
	GeometryHeight = 20.0
	GeometryIsSmall = No	
End

