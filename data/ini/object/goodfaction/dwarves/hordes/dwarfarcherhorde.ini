;------------------------------------------------------------------------------
;
;	contains dwarf archer hordes + stuff
;------------------------------------------------------------------------------
Object DwarfArcherHorde

	; This is required for garrisoned objects - please put in all objects.
	ButtonImage		= UIDwarf_Archer
	SelectPortrait	= UPDwarf_Archer

	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_TAUNTING EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED  EMOTION_TERROR EMOTION_LOOK_TO_SKY
		DefaultModelConditionState
			Model = None ;InvisHrdeTmp5x2
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End		
		
		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGUArc
		End
	End
	
	Side = Dwarves
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:HordeDwarfArcher
	
	WeaponSet
		Conditions = None 
		Weapon = PRIMARY    DwarfArcherMissileHordeRangeFinder
	End
	WeaponSet
		Conditions = PLAYER_UPGRADE 
		Weapon = PRIMARY    DwarfArcherMissileHordeRangeFinder
	End
	; *** AUDIO Parameters ***
	; Note: Don't put voice parameters here -- they will be ignored. Voice play requests
	; are always passed through to members


	BuildCost = M_DWARVES_ARCHER_BUILDCOST
	BuildTime = M_DWARVES_ARCHER_BUILDTIME
	VisionRange = M_DWARVES_ARCHER_HORDE_VISION_RANGE 
	ShroudClearingRange = M_DWARVES_ARCHER_HORDE_VISION_RANGE 
	CommandPoints = 16 ; 15
		
	FormationWidth = 2 ; Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth = 1 ; Depth it occupies in formations. Current choices are 1 or 2.
	
 	CrushableLevel = 0  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 0

    TransportSlotCount = 1
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER ARMY_SUMMARY; UNATTACKABLE 
	
	CommandSet = DwarfArcherHordeCommandSet
	
	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End
	
	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle	=	Yes ATTACK_BUILDINGS
		MoodAttackCheckRate			=	500
		MaxCowerTime				=	5000
		MinCowerTime				=	3000
		CanAttackWhileContained		=	Yes  ; Can fire out of garrisoned building		
		AILuaEventsList				=	DwarfArcherHordeFunctions
		AttackPriority				= 	AttackPriority_Archer
	End

	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DwarfArcher 4
		Slots = 4
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	;Used to determine which armorset to use (and anything else we want!)
		;RandomOffset=X:4 Y:4
		
		; Banner Carrier info		
		BannerCarriersAllowed	= DwarfBanner										; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:DwarfArcher		Pos:X:15.0 Y:0.0		; (DEFAULT) position of banner carrier
		
		; Positions for 5
		RankInfo = RankNumber:1 UnitType:DwarfArcher Position:X:0 Y:10 Position:X:0 Y:-10 Position:X:0 Y:-25 Position:X:0 Y:25

		RanksToReleaseWhenAttacking = 1 

		; Double combo w/ archers
		ComboHorde = Target:DwarfArcherHorde			Result:DwarfArcher2XHorde	InitiateVoice:DwarfArcherVoiceJoinArchers
		ComboHorde = Target:DwarfArcherHordeVolley	Result:DwarfArcher2XHordeVolley		InitiateVoice:DwarfArcherVoiceJoinArchers
		
		; Combo w/ warriors
		ComboHorde = Target:DwarfWarriorHorde	Result:DwarfWarriorArcherHorde		InitiateVoice:DwarfArcherVoiceJoinWarriors
		ComboHorde = Target:DwarfWarriorHordeCrescent	Result:DwarfWarriorArcherHorde		InitiateVoice:DwarfArcherVoiceJoinWarriors
		
		;  Combo w/ Spearmen
		 ComboHorde = Target:DwarfSpearmanHorde	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfArcherVoiceJoinSpearmen
		 ComboHorde = Target:DwarfSpearmanHordeSpearWall	Result:DwarfArcherSpearmanHorde	InitiateVoice:DwarfArcherVoiceJoinSpearmen
		
		; Combo w/ IH warriors
		 ComboHorde = Target:DwarfIronHillsHorde	Result:DwarfArcherIronHillsHorde		InitiateVoice:DwarfArcherVoiceJoinIronHills
		 ComboHorde = Target:DwarfIronHillsMattockHorde	Result:DwarfArcherIronHillsHorde		InitiateVoice:DwarfArcherVoiceJoinIronHills
		
		AlternateFormation = DwarfArcherHordeVolley
		MeleeAttackLeashDistance = 25; How far the hordes can move from the center of the horde when melee attacking.		
		; Example of Eva event for horde death
		;EvaEventLastMemberDeath = ArchersDie ; Play this Eva event when the last member dies
	End
	
	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End
	
  Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	M_INFANTRY_TAUNT_POINT_RADIUS		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
 		AfraidOf			=	NONE +GondorGwaihir +RohanTreeBerd +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorBalrog +MordorFellBeast +MordorWitchKingOnFellBeast  +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorMumakil ;Must be SCARY kindof as well.
		AlwaysAfraidOf				=	NONE +MordorBalrog +RohanOathbreaker +MordorSauron ;+MordorWitchKing +MordorWitchKingOnFellBeast
 		PointAt				=	NONE +MordorFellBeast +MordorWitchKingOnFellBeast 
		HeroScanDistance		=	150
		FearScanDistance		=	 M_ARCHER_FEAR_SCAN_RADIUS
		AddEmotion			=	Terror_Base			;OVERRIDE
		AddEmotion			=	Doom_Base			;OVERRIDE
		AddEmotion			=	UncontrollableFear_Base		;OVERRIDE
		AddEmotion			=	FearIdle_Base			;OVERRIDE
		AddEmotion			=	FearBusy_Base			;OVERRIDE
		AddEmotion			=	Point_Base			;OVERRIDE
		AddEmotion			=	Taunt_Base			;OVERRIDE
 		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	
	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	Behavior = LevelUpUpgrade ModuleTag_BasicTraining
		TriggeredBy = Upgrade_DwarvesBanner Upgrade_TechnologyDwarvesBanners
		RequiresAllTriggers = Yes
		LevelsToGain = 1
		LevelCap = 2
	End
	
	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality
		TriggeredBy = Upgrade_DwarvesMithrilArrows ;Upgrade_TechnologyDwarvesMithrilArrows 
		RequiresAllTriggers = Yes
	End
	
	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality2
		TriggeredBy = Upgrade_DwarvesHeavyArmor; Upgrade_TechnologyDwarvesHeavyArmor
		RequiresAllTriggers = Yes
	End
  
  ; ----------------------------- ;
  ; -- Fire Arrow Rank 2 Ability 
  Behavior = UnpauseSpecialPowerUpgrade ModuleTag_UnpauseLeadership2
    SpecialPowerTemplate = SpecialAbilityFireArrowVolley
    TriggeredBy = Upgrade_GenericUpgrade2
  End
  Behavior = SpecialPowerModule ModuleTag_FireArrowUser_1_Start
    SpecialPowerTemplate      = SpecialAbilityFireArrowVolley
    StartsPaused			= Yes
    AttributeModifier = FireArrowsUSER_1
    AttributeModifierRange = 50
    AttributeModifierAffectsSelf = Yes
    AttributeModifierAffects = NONE +DwarfArcher +DwarfArcherHorde
  End	
  Behavior = WeaponModeSpecialPowerUpdate ModuleTag_SwitchToWeaponset1
    SpecialPowerTemplate	= SpecialAbilityFireArrowVolley
    Duration				= 10000
    LockWeaponSlot            = SECONDARY
    StartsPaused			= Yes
  End
  Behavior = SpecialAbilityUpdate ModuleTag_FireArrowUpdate
    SpecialPowerTemplate    = SpecialAbilityFireArrowVolley
    UnpackTime              = 1
    UnpackingVariation        = 2      
    AwardXPForTriggering		= 0		
    TriggerSound				= UpgradeFlamingArrows
  End  	
    
	LocomotorSet
		Locomotor     = NormalRangedHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = 40 ; M_NORMAL_GOOD_INFANTRY_HORDE_SPEED
	End

	Geometry = BOX
	GeometryMajorRadius = 20.0
	GeometryMinorRadius = 20.0
	GeometryHeight = 20.0
	GeometryIsSmall = No


End

;------------------------------------------------------------------------------
ChildObject DwarfArcherHordeVolley DwarfArcherHorde

	; Note - for alternate formations, all info outside of the Contain Behavior module is ignored.
	; Any modifications need to be done via the Attribute Modifiers in the contain module. 
	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DwarfArcher 4
		Slots = 4
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = No	;Used to determine which armorset to use (and anything else we want!)
		AttributeModifiers = DwarfArcherVolley
		
		; Banner Carrier info		
		BannerCarriersAllowed	= DwarfBanner										; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:DwarfArcher	Pos:X:-10 Y:0.0		; (DEFAULT) position of banner carrier
		
		; -- Gondor Captain
		;LeadersAllowed = GondorCaptain
		;LeaderPosition   = X:60.0 Y:0.0 Z:0.0
		;LeaderRank		= 1
		
		RankInfo = RankNumber:1 UnitType:DwarfArcher Position:X:0 Y:10 Position:X:0 Y:-10 
		RankInfo = RankNumber:2 UnitType:DwarfArcher Position:X:-10 Y:-10 Position:X:-10 Y:10
		
		RanksToReleaseWhenAttacking = 1 2

		; Double combo w/ archers
		ComboHorde = Target:DwarfArcherHorde			Result:DwarfArcher2XHorde	InitiateVoice:DwarfArcherVoiceJoinArchers
		ComboHorde = Target:DwarfArcherHordeVolley	Result:DwarfArcher2XHordeVolley		InitiateVoice:DwarfArcherVoiceJoinArchers
		
		; Combo w/ warriors
		ComboHorde = Target:DwarfWarriorHorde	Result:DwarfWarriorArcherHorde		InitiateVoice:DwarfArcherVoiceJoinWarriors
		ComboHorde = Target:DwarfWarriorHordeCrescent	Result:DwarfWarriorArcherHorde		InitiateVoice:DwarfArcherVoiceJoinWarriors
		
		;  Combo w/ Spearmen
		 ComboHorde = Target:DwarfSpearmanHorde	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfArcherVoiceJoinSpearmen
		 ComboHorde = Target:DwarfSpearmanHordeSpearWall	Result:DwarfArcherSpearmanHorde	InitiateVoice:DwarfArcherVoiceJoinSpearmen
		
		; Combo w/ IH warriors
		 ComboHorde = Target:DwarfIronHillsHorde	Result:DwarfArcherIronHillsHorde		InitiateVoice:DwarfArcherVoiceJoinIronHills
		 ComboHorde = Target:DwarfIronHillsMattockHorde	Result:DwarfArcherIronHillsHorde		InitiateVoice:DwarfArcherVoiceJoinIronHills
		
		AlternateFormation = DwarfArcherHorde				
	End
End
