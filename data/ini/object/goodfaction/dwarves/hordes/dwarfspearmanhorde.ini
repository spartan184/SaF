;------------------------------------------------------------------------------
;
;	contains dwarf spearman hordes + stuff
;------------------------------------------------------------------------------
Object DwarfSpearmanHorde
  	; This is required for garrisoned objects - please put in all objects.
	ButtonImage		= UIDwarf_Spearman
	SelectPortrait	= UPDwarf_Spearman
	
	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY
		DefaultModelConditionState
			Model = None ;InvisHrdeTmp
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End		
		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkIUPik
		End
	End
	
	Side = Dwarves
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:HordeDwarfSpearman
	
	WeaponSet
		Conditions = None 
		Weapon = PRIMARY    NormalMeleeHordeRangefinder
	End

	BuildCost = TDH_DWARVES_SPEARMAN_BUILDCOST			
	BuildTime = TDH_DWARVES_SPEARMAN_BUILDTIME			
	VisionRange = M_VISION_STANDARD_MELEE 		
	CrushableLevel = 0  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 0 ;What can I crush?: 0 = small animals, 1 = infantry, 2 = trees, 3 = vehicles 
	CommandPoints = 20
		
	CommandSet  = DwarfSpearmanHordeCommandSet
		
	FormationWidth = 2 ; Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth = 1 ; Depth it occupies in formations. Current choices are 1 or 2.
	
	TransportSlotCount = 1
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE MELEE_HORDE  ARMY_SUMMARY URUK ;UNATTACKABLE 
	
	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End
	
	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS
		MoodAttackCheckRate        = 500
		AILuaEventsList				=	DwarfBaseHordeFunctions
		MaxCowerTime				=	5000
		MinCowerTime				=	3000
		AttackPriority				= 	AttackPriority_Spearman
	End

	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DwarfSpearman 4
		PassengerFilter = NONE +INFANTRY
		Slots = 4
		ShowPips = No

		ThisFormationIsTheMainFormation = Yes	;Used to determine which armorset to use (and anything else we want!)
		
		; Banner Carrier info		
		BannerCarriersAllowed	= DwarfBanner		; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:DwarfSpearman	Pos:X:15.0 Y:10.0	; (DEFAULT) position of banner carrier for fighter horde

		RandomOffset=X:2 Y:2	
		RankInfo = RankNumber:1 UnitType:DwarfSpearman Position:X:0 Y:10 Position:X:0 Y:-10 Position:X:0 Y:-25 Position:X:0 Y:25

		RanksToReleaseWhenAttacking = 1
		AlternateFormation = DwarfSpearmanHordeSpearWall
		
		; 2x combo w/other spears
		 ComboHorde = Target:DwarfSpearmanHorde	Result:DwarfSpearman2XHorde		InitiateVoice:DwarfSpearmanVoiceJoinSpearmen
		 ComboHorde = Target:DwarfSpearmanHordeSpearWall	Result:DwarfSpearman2XHordeSpearWall	InitiateVoice:DwarfSpearmanVoiceJoinSpearmen

		; Combo w/ warriors
		 ComboHorde = Target:DwarfWarriorHorde	Result:DwarfWarriorSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinWarriors
		ComboHorde = Target:DwarfWarriorHordeCrescent	Result:DwarfWarriorSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinWarriors
		
		; Combo w/archers
		 ComboHorde = Target:DwarfArcherHorde	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinArchers
		 ComboHorde = Target:DwarfArcherHordeVolley	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinArchers
		
		
		
		UsePorcupineBody = No
		UseSlowHordeMovement = Yes
		MeleeAttackLeashDistance = 25; How far the hordes can move from the center of the horde when melee attacking.
	End
	
;	Behavior = SpecialEnemySenseUpdate ModuleTag_EnemySenseUpdate
;		SpecialEnemyFilter = NONE +CAVALRY +INFANTRY
;		ScanRange = 300
;		ScanInterval = 2000
;	End

	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End
	
 	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	M_INFANTRY_TAUNT_POINT_RADIUS		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
		AfraidOf			=	NONE +RohanOathbreakerHordeSmall +GondorGwaihir +RohanTreeBerd +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorFellBeast +MordorWitchKingOnFellBeast +MordorBalrog +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorMumakil ;Must be SCARY kindof as well.
		AlwaysAfraidOf			=	NONE +MordorBalrog +RohanOathbreaker; +MordorWitchKing +MordorWitchKingOnFellBeast
		PointAt					=	NONE +GondorGwaihir 
		HeroScanDistance		=	150
		FearScanDistance		=	M_INFANTRY_FEAR_SCAN_RADIUS

		AddEmotion	=	Terror_Base
		AddEmotion	=	Doom_Base
		AddEmotion	=	UncontrollableFear_Base_Evil
		AddEmotion	=	FearIdle_Base
		AddEmotion	=	FearBusy_Base
		AddEmotion	=	Point_Base

		AddEmotion	=	Taunt_Base	
		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	
		
	LocomotorSet
		Locomotor     = NormalMeleeHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = TDH_DWARVES_INFANTRY_HORDE_SPEED
	End

	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	Behavior = LevelUpUpgrade ModuleTag_BasicTraining
		TriggeredBy = Upgrade_DwarvesBanner Upgrade_TechnologyDwarvesBanners
		RequiresAllTriggers = Yes
		LevelsToGain = 1
		LevelCap = 2
	End
	
	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality
		TriggeredBy = Upgrade_DwarvesMetallurgy ;Upgrade_TechnologyDwarvesMetallurgy
		RequiresAllTriggers = Yes
	End

	Behavior = StatusBitsUpgrade ModuleTag_ProductionLegality2
		TriggeredBy = Upgrade_DwarvesHeavyArmor ;Upgrade_TechnologyDwarvesHeavyArmor
		RequiresAllTriggers = Yes
	End
	
	Geometry = BOX
	GeometryMajorRadius = 40 ;30.4
	GeometryMinorRadius = 40 ;30.4
	GeometryHeight = 8.0
	GeometryIsSmall = No
End

ChildObject DwarfSpearmanHordeSpearWall DwarfSpearmanHorde
	; Note - for alternate formations, all info outside of the Contain Behavior module is ignored.
	; Any modifications need to be done via the Attribute Modifiers in the contain module.  
	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DwarfSpearman 4
		Slots = 4
		PassengerFilter = NONE +INFANTRY
		ShowPips = No

		ThisFormationIsTheMainFormation = No	;Used to determine which armorset to use (and anything else we want!)
		
		; Banner Carrier info		
		
	BannerCarriersAllowed	= DwarfBanner			; types of units that are allowed as banner carriers
	BannerCarrierPosition	= UnitType:DwarfSpearman	Pos:X:0 Y:0	; (DEFAULT) position of banner carrier for fighter horde
			
	RankInfo = RankNumber:1 UnitType:DwarfSpearman Position:X:0 Y:6 Position:X:0 Y:-6 Position:X:0 Y:-18 Position:X:0 Y:18	

		; 2x combo w/other spears
		 ComboHorde = Target:DwarfSpearmanHorde	Result:DwarfSpearman2XHorde		InitiateVoice:DwarfSpearmanVoiceJoinSpearmen
		 ComboHorde = Target:DwarfSpearmanHordeSpearWall	Result:DwarfSpearman2XHordeSpearWall	InitiateVoice:DwarfSpearmanVoiceJoinSpearmen

		; Combo w/ warriors
		 ComboHorde = Target:DwarfWarriorHorde	Result:DwarfWarriorSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinWarriors
		ComboHorde = Target:DwarfWarriorHordeCrescent	Result:DwarfWarriorSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinWarriors
		
		; Combo w/archers
		 ComboHorde = Target:DwarfArcherHorde	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinArchers
		 ComboHorde = Target:DwarfArcherHordeVolley	Result:DwarfArcherSpearmanHorde		InitiateVoice:DwarfSpearmanVoiceJoinArchers
		
		AlternateFormation = DwarfSpearmanHorde
		AttributeModifiers = DwarfSpearmanSpearwall
		UsePorcupineBody = Yes
		UseSlowHordeMovement = Yes
	End
End
