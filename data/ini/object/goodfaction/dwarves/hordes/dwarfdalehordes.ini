; Horde file for Dale units: summoned marksmen
Object DaleThrushMarksmanHorde

	; This is required for garrisoned objects - please put in all objects.
	ButtonImage		= BGArcheryRange_Rangers
	SelectPortrait	= UPDwarf_DaleThrushMarksman

	Draw = W3DScriptedModelDraw ModuleTag_W3DModelDraw
	    DependencySharedModelFlags = EMOTION_ALERT EMOTION_MORALE_HIGH EMOTION_MORALE_LOW EMOTION_AFRAID EMOTION_COWER SELECTED EMOTION_TERROR EMOTION_LOOK_TO_SKY EMOTION_TAUNTING
		DefaultModelConditionState
			Model = None ;InvisHrdeTmp5x2
		End
		ModelConditionState = HORDE_EMPTY
			Model = None
		End		
		
		ModelConditionState = WORLD_BUILDER
			Model = HordeMarkGURan
		End
	End
	
	Side = Dwarves
	EditorSorting = UNIT
	EmotionRange = 240
	DisplayName = OBJECT:HordeDaleMarksman
	
	WeaponSet
		Conditions = None 
		Weapon = PRIMARY    RangerMissileHordeRangefinder ; GoodArcherMissileHordeRangefinder
	End

	; *** AUDIO Parameters ***
	; Note: Don't put voice parameters here -- they will be ignored. Voice play requests
	; are always passed through to members


	BuildCost = M_DWARVES_DALEMARKSMAN_BUILDCOST
	BuildTime = M_DWARVES_DALEMARKSMAN_BUILDTIME
	VisionRange = M_DWARVES_DALEMARKSMAN_HORDE_VISION_RANGE
	ShroudClearingRange = M_DWARVES_DALEMARKSMAN_HORDE_VISION_RANGE
	CommandPoints = 0
		
 	CrushableLevel = 0  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 0

	FormationWidth = 2 ; Width it occupies in formations. Current choices are 1 or 2.
	FormationDepth = 1 ; Depth it occupies in formations. Current choices are 1 or 2.
	
    TransportSlotCount = 1
	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER ARMY_SUMMARY;UNATTACKABLE 
	
	Body = ImmortalBody ModuleTag_ImmortalBody
		MaxHealth = 1
	End
	
	Behavior = HordeAIUpdate ModuleTag_HordeAIUpdate
		AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS STEALTHED
		MoodAttackCheckRate        = 500
		MaxCowerTime				=	5000
		MinCowerTime				=	3000
		CanAttackWhileContained    = Yes  ; Can fire out of garrisoned building		
        AILuaEventsList				= InfantryFunctions
        AttackPriority				= 	AttackPriority_Archer
	End

	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DaleThrushMarksman 5
		Slots = 5
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	;Used to determine which armorset to use (and anything else we want!)
		RandomOffset=X:4 Y:4
		
		; Banner Carrier info		
		BannerCarriersAllowed	= GondorBanner										; types of units that are allowed as banner carriers
		BannerCarrierPosition	= UnitType:GondorRanger		Pos:X:40.0 Y:0.0		; (DEFAULT) position of banner carrier
		
		; Positions for 5
		RankInfo = RankNumber:1 UnitType:DaleThrushMarksman Position:X:15 Y:0	Position:X:15 Y:25	Position:X:15 Y:-25	Position:X:15 Y:50	Position:X:15 Y:-50 
		
		RanksToReleaseWhenAttacking = 1 
				
	
		MeleeAttackLeashDistance = 25; How far the hordes can move from the center of the horde when melee attacking.
	End
	

	Behavior = PhysicsBehavior ModuleTag_PhysicsBehavior
		GravityMult = 1.0
	End
	
   	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		TauntAndPointDistance		=	M_INFANTRY_TAUNT_POINT_RADIUS		; max distance to taunted/pointed objet
		TauntAndPointUpdateDelay	=	1000	; how often scan (milliseconds)
		TauntAndPointExcluded		=	NONE
 		AfraidOf			=	NONE +GondorGwaihir +RohanTreeBerd +RohanEntFir +RohanEntAsh +RohanEntBirch +MordorBalrog +MordorFellBeast +MordorWitchKingOnFellBeast  +MordorCaveTroll +MordorMountainTroll +MordorDrummerTroll +MordorMumakil ;Must be SCARY kindof as well.
		AlwaysAfraidOf				=	NONE +MordorBalrog +RohanOathbreaker +MordorSauron ;+MordorWitchKing +MordorWitchKingOnFellBeast
 		PointAt				=	NONE +MordorFellBeast +MordorWitchKingOnFellBeast 
		HeroScanDistance		=	150
		FearScanDistance		=	M_ARCHER_FEAR_SCAN_RADIUS

		AddEmotion	=	Terror_Base
		AddEmotion	=	Doom_Base
		AddEmotion	=	UncontrollableFear_Base
		AddEmotion	=	FearIdle_Base
		AddEmotion	=	FearBusy_Base
		AddEmotion	=	Point_Base
		
		;Rangers are very stoic and do not taunt. - 
		;AddEmotion	=	OVERRIDE Taunt_Base	
 			;AttributeModifier		=	GondorFighterTaunt
 		;End		
 		
 		AddEmotion	=	CheerIdle_Base
		AddEmotion	=	CheerBusy_Base
		AddEmotion	=	HeroCheerIdle_Base
		AddEmotion	=	HeroCheerBusy_Base
		AddEmotion	=	Alert_Base
	End	
		
	LocomotorSet
		Locomotor     = NormalRangedHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = 40 ; M_NORMAL_GOOD_INFANTRY_HORDE_SPEED
	End

	CommandSet = DaleMarksmanHordeCommandSet
	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
		GiveNoXP = Yes
	End

	
	Geometry = BOX
	GeometryMajorRadius = 20.0
	GeometryMinorRadius = 20.0
	GeometryHeight = 10.0
	GeometryIsSmall = No
	
End

ChildObject DaleThrushMarksmanHorde_Summoned DaleThrushMarksmanHorde
	IsTrainable = No
	CommandPoints = 0
	CommandSet = DaleMarksmanHordeCommandSet
	EquivalentTo = DaleThrushMarksmanHorde

	KindOf = SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT INFANTRY HORDE ARCHER MELEE_HORDE SUMMONED
	
	Behavior = LifetimeUpdate ModuleTag_LifetimeUpdate
	; This one displays the timer, but the one in the uint does the work 
		MinLifetime		= M_DWARVES_SPELL_DALEALLIES_LIFETIME ; 120000
		MaxLifetime		= M_DWARVES_SPELL_DALEALLIES_LIFETIME ; 120000
		DeathType		= FADED
	End	
	Behavior = HordeContain ModuleTag_HordeContain
		ObjectStatusOfContained = 
		InitialPayload = DaleThrushMarksman_Summoned 5
		Slots = 5
		PassengerFilter = NONE +INFANTRY
		ShowPips = No
		ThisFormationIsTheMainFormation = Yes	;Used to determine which armorset to use (and anything else we want!)

		RandomOffset = X:1 Y:1
		
		; Banner Carrier info		
		
		; Positions for 5
		RankInfo = RankNumber:1 UnitType:DaleThrushMarksman_Summoned Position:X:13 Y:0	Position:X:13 Y:25		Position:X:13 Y:-25		Position:X:13 Y:50		Position:X:13 Y:-50

		UpdateWeaponSetFlagsOnHordeToo = Yes ; Only use this flag when there is a single Granted/Revoked Weaponset flag.  This will pass it on to the Horde Brain.
		RanksToReleaseWhenAttacking = 1 
		MeleeAttackLeashDistance = 25; How far the hordes can move from the center of the horde when melee attacking.
	End
	
End