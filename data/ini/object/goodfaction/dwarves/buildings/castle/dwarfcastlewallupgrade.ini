		End

		SoundUpgrade = Upgrade_CastleHorn							; EVERYTHING on this line must be present
			ExcludedUpgrades = Upgrade_CastlePosternGate Upgrade_CastleTower			; NOTHING on this line can be present
			VoiceSelect = DwarfCastleHornSelected
		End
	End

	
