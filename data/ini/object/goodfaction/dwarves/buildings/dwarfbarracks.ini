;------------------------------------------------------------------------------ 
; Dwarf Barracks ini
;-------------------------------------------------------------------------------------
Object DwarfBarracks

	SelectPortrait = BPDwarf_Barracks
 

  Draw = W3DScriptedModelDraw ModuleTag_Draw

	; disabling 'cause it's dumb
	
    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes
    StaticModelLODMode = no ; Will append M or L to the skin name depending on GameLOD
    DefaultModelConditionState
		Model = dbBarracks_SKN		
    End
    
   IdleAnimationState
		StateName = STATE_None
		Animation = IDLE
			AnimationName		=	dbBarracks_SKL.dbBarracks_idl
			AnimationMode			=	ONCE	
			AnimationBlendTime = 0

		End		
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "BeingConstructed" then 
			    ; Don't play completed sound when canceling build-in-progress or when
			    ; destroyed halfway
			    if not CurDrawableModelcondition( "DYING" ) then 
					CurDrawablePlaySound("M_DwarfEVA_BuiltBarracks")
				end
			end
		EndScript
	End


    ;------------ New Build Up States coming soon. 
    ModelConditionState   = AWAITING_CONSTRUCTION 
      Model               = dbBarracks_bld
;		ParticleSysBone	  = NONE BuildingDoughnutCloud
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           =  dbBarracks_bld
        AnimationName     =  dbBarracks_bld.dbBarracks_bld
        AnimationMode     = MANUAL
        AnimationBlendTime = 0
      End
	  Flags				  = START_FRAME_FIRST
    End

    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = dbBarracks_bld
		ParticleSysBone   = HOUSEMIDDLE BuildingContructDust FollowBone:Yes
    End;
    AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation           = dbBarracks_bld
			AnimationName     = dbBarracks_bld.dbBarracks_bld
			AnimationMode     = MANUAL
			AnimationBlendTime = 0
		End
		Flags				  = START_FRAME_FIRST
		StateName			  = BeingConstructed
		BeginScript

			;CurDrawablePlaySound("GondorBarracksBeginConstruction")
			;CurDrawableHideSubObjectPermanently("V1")
			;CurDrawableHideSubObjectPermanently("V1FLAG")
			;CurDrawableHideSubObjectPermanently("V2")
		EndScript
    End
    
	    
        ;--damaged building
      ModelConditionState  = DESTROYED_FRONT
      Model         = dbBarracks_d2  
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
    End
    AnimationState = DESTROYED_FRONT
      BeginScript
        CurDrawableHideSubObject("DFRONT")
      EndScript
    End
    
        ModelConditionState  = DESTROYED_RIGHT
      Model         = dbBarracks_d2 
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_RIGHT
      BeginScript
        CurDrawableHideSubObject("DRIGHT")
      EndScript
    End
    

    ModelConditionState  = DESTROYED_BACK
      Model         = dbBarracks_d2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_BACK
      BeginScript
        CurDrawableHideSubObject("DBACK")
      EndScript
    End

	ModelConditionState  = DESTROYED_LEFT
      Model         = dbBarracks_d2  
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
    End
    
    AnimationState = DESTROYED_LEFT
      BeginScript
        CurDrawableHideSubObject("DLEFT")
      EndScript
    End
    
    
    ModelConditionState  = DAMAGED
      Model         = dbBarracks_d1  
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingMedium
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
    End
    AnimationState = DAMAGED
	EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = dbBarracks_d2  
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingMedium
		ParticleSysBone Smoke01 SmokeBuildingLarge
	
    End
    AnimationState = REALLYDAMAGED
	EnteringStateFX	= FX_BuildingReallyDamaged
    End

    ModelConditionState  = RUBBLE
      Model         = dbBarracks_d2  
      ParticleSysBone SmokeLarge01 SmokeBuildingLarge
    End
    
    AnimationState = RUBBLE
      BeginScript
	; ***** These seem to hide the various rubble pieces that are OCLed in, enable for test
        CurDrawableHideSubObject("DFRONT")
        CurDrawableHideSubObject("DBACK")
        CurDrawableHideSubObject("DLEFT")
        CurDrawableHideSubObject("DRIGHT")
      EndScript
    End

    ModelConditionState  = POST_RUBBLE
		Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState  = POST_COLLAPSE
		 Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End
End

  
  Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
     ModelName = dbBarracks_Bib
  End
  

  PlacementViewAngle  = 90

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:DwarfBarracks
  Description 	      = OBJECT:DwarfBarracksDescription
  Side                = Dwarves
  EditorSorting       = STRUCTURE
  ThreatLevel = 1.0
 
  BuildCost           = M_DWARVES_BARRACKS_BUILDCOST
  BuildTime           = M_DWARVES_BARRACKS_BUILDTIME          ; in seconds
  BountyValue         = M_DWARVES_BARRACKS_BOUNTY_VALUE
  VisionRange         = 160.0          ; Shroud clearing distance
  ShroudClearingRange = M_DWARVES_BARRACKS_SHROUD_CLEAR


  
  ArmorSet
    Conditions        = None
    Armor             = DwarfStructureArmor
    ;DamageFX          = StructureDamageFXNoShake
  End
  CommandSet          = DwarfBarracksCommandSet

	WeaponSet
		Conditions			= None
	End
 

  ; *** AUDIO Parameters ***

	VoiceSelect		= DwarfBarracksSelected

	SoundOnDamaged		= BuildingLightDamageStone
	SoundOnReallyDamaged	= BuildingHeavyDamageStone
 
	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

	UnitSpecificSounds
		UnderConstruction		= BuildingConstructionLoop  ; Built first time
		; UnderRepairFromDamage	= NoSound					; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End


  ; *** ENGINEERING Parameters ***

  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY NEED_BASE_FOUNDATION ATTACK_NEEDS_LINE_OF_SIGHT CAN_ATTACK MADE_OF_STONE
 
  Behavior            = GettingBuiltBehavior ModuleTag_04
    WorkerName	= DwarfWorkerNoSelect
  End

  Behavior = CastleMemberBehavior ModuleTag_CMB
  End 


  Body                    = ActiveBody ModuleTag_05
    MaxHealth             = M_DWARVES_BARRACKS_HEALTH
    MaxHealthDamaged      = M_DWARVES_BARRACKS_HEALTH_DAMAGED
	MaxHealthReallyDamaged  = M_DWARVES_BARRACKS_HEALTH_REALLY_DAMAGED

    DamageCreationList = OCL_BuildingDamageList01 CATAPULT_ROCK
    
	; ***** Ok, I'm not COMPLETELY insane. Maybe new damage OCLs for Beta 5 (hah) but just disabling them for now
	; ***** actually this is a demo test to see how hard it is
		DamageCreationList = OCL_dbbarracks_Chunk1 CATAPULT_ROCK FRONT_DESTROYED
		DamageCreationList = OCL_dbbarracks_Chunk2 CATAPULT_ROCK RIGHT_DESTROYED
		DamageCreationList = OCL_dbbarracks_Chunk3 CATAPULT_ROCK BACK_DESTROYED
		DamageCreationList = OCL_dbbarracks_Chunk4 CATAPULT_ROCK LEFT_DESTROYED
    
  End

  ; Iron hills power commandset swap, because you can't have two NeededUpgrades for a button
  Behavior = CommandSetUpgrade ModuleTag_IHcommandset
		TriggeredBy = Upgrade_IronHills Upgrade_StructureLevel3
		RequiresAllTriggers	= Yes
		CommandSet = DwarfBarracksCommandSetIronHills
	End
	
  Behavior = ProductionUpdate ModuleTag_06
  End

  Behavior = QueueProductionExitUpdate ModuleTag_07
    UnitCreatePoint    = X:0 Y:23 Z:0.0
    NaturalRallyPoint  = X:0.0 Y:-86.0 Z:0.0
    ExitDelay = 750
  End
  
  Behavior                  = StructureCollapseUpdate ModuleTag_08
    MinCollapseDelay        = 000
    MaxCollapseDelay        = 000
    CollapseDamping         = .5
    MaxShudder              = 0.6
    MinBurstDelay           = 250
    MaxBurstDelay           = 800
    BigBurstFrequency       = 4
    FXList                  = INITIAL   FX_StructureMediumCollapse
    FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
	DestroyObjectWhenDone	= Yes
	CollapseHeight			= 155
  End
  
  Behavior = SpawnBehavior ModuleTag_EscalationLevel1
		TriggeredBy			= Upgrade_TechnologyDwarfCraftsmanEscalation2
		SpawnNumber			= 2
		InitialBurst			= 1
		SpawnTemplateName		= DwarfGarrisonedWarrior
		SpawnReplaceDelay		= 10000
	End
	
		Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DwarfGarrisonedBuildingDeath
	End	
	
	; *** TODO:  These are roughlt coorect
	AttackContactPoint = X:-24 Y:-24 Z:92
	GeometryContactPoint = X:-9.5 Y:-6 Z:0 Repair
	GeometryContactPoint = X: -9.3 Y:-4 Z:0 Repair
	GeometryContactPoint = X:46.1 Y: 33.5 Z:0 Repair
	GeometryContactPoint = X:0 Y: -8 Z:0 Bomb

  ; *** TODO: Figure out what this does
  Behavior                  = BuildingBehavior BuildingModuleTag
   ; NightWindowName         = WINDOW_N01
   ; FireWindowName         = WINDOW_F01
   ; GlowWindowName	    = WINDOW_G01
   ; FireName		    = FIRE01
  End

	; Subobject upgrades
	Behavior = SubObjectsUpgrade ModuleTag_HideAll
		TriggeredBy		= Upgrade_StructureLevel1
		HideSubObjects	= LVL2 LVL3
	End

	Behavior = SubObjectsUpgrade ModuleTag_ShowWallsAndFlag
		TriggeredBy		= Upgrade_StructureLevel2
		ShowSubObjects	= LVL2 
		HideSubObjects	= HOUSELEFT
	End

	Behavior = SubObjectsUpgrade ModuleTag_ShowTowersAndHideFlag
		TriggeredBy		= Upgrade_StructureLevel3
		ShowSubObjects	= LVL2 LVL3
		HideSubObjects	= HOUSERIGHT
	End
	
	; Geometry Upgrades, don't seem to work atm
	Behavior = GeometryUpgrade Geom_ModuleTag_HideLevels
		TriggeredBy		= Upgrade_StructureLevel1
		ShowGeometry	= Geom_Orig Geom_Orig2 Geom_Orig3
		HideGeometry	= Geom_V2
	End
	
	Behavior = GeometryUpgrade Geom_ModuleTag_HideLevels2
		TriggeredBy		= Upgrade_StructureLevel1
		ShowGeometry	= Geom_Orig Geom_Orig2 Geom_Orig3
		HideGeometry	= Geom_V3
	End

	Behavior = GeometryUpgrade Geom_ModuleTag_ShowLeft
		TriggeredBy		= Upgrade_StructureLevel2
		ShowGeometry	= Geom_Orig Geom_V2 
	End
  	Behavior = GeometryUpgrade Geom_ModuleTag_ShowAll
		TriggeredBy		= Upgrade_StructureLevel3
		ShowGeometry	= Geom_Orig Geom_V2 Geom_V3
	End	 

  ;; This is required for setting rally points which needs a small geometry to determine if quick path exists in tight spaces
  ;; If this was any bigger, it would fail to create the rallu points when in a camp or castle.
  Geometry              = CYLINDER
  GeometryMajorRadius   = 8.0
  GeometryMinorRadius   = 8.0
  GeometryHeight        = 10

  ;; These are the actual building geometry pieces
  AdditionalGeometry    = BOX
  GeometryName			= Geom_Orig
  GeometryMajorRadius   = 50.0
  GeometryMinorRadius   = 18.0
  GeometryHeight        = 20.0
  GeometryOffset		= X:1.3 Y:36.5 Z:0

  AdditionalGeometry    = BOX
  GeometryName			= Geom_Orig2
  GeometryMajorRadius   = 22.0
  GeometryMinorRadius   = 20.0
  GeometryHeight        = 20.0
  GeometryOffset		= X:-29 Y:14.7 Z:0

  AdditionalGeometry    = BOX
  GeometryName			= Geom_Orig3
  GeometryMajorRadius   = 23.5
  GeometryMinorRadius   = 20.0
  GeometryHeight        = 20.0
  GeometryOffset		= X:30 Y:14.7 Z:0
  
 

  GeometryIsSmall       = No
  
  Shadow                = SHADOW_VOLUME
  BuildCompletion		= PLACED_BY_PLAYER
  
  ; *** TODO:  These are roughly correct
  GeometryContactPoint = X:-47	Y:39	Z:0		Repair
  GeometryContactPoint = X:-26.8 Y:52.7	Z:0		Repair
  GeometryContactPoint = X:0	Y:52.47	Z:0
  GeometryContactPoint = X:-33.314	Y:-54.902	Z:0
  GeometryContactPoint = X:0.106	Y:36.3	Z:28.3	Swoop

End