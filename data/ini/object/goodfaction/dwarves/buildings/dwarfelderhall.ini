;------------------------------------------------------------------------------ 
; Dwarf Barracks ini
;-------------------------------------------------------------------------------------
Object DwarfElderHall
	
	;WallBoundsMesh = WALLPLANE
	;RampMesh1 = STAIRPLANE

	SelectPortrait = BPDwarf_ElderHall
 
  Draw = W3DScriptedModelDraw ModuleTag_Draw

    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes
    StaticModelLODMode = no ; Will append M or L to the skin name depending on GameLOD
	
    ExtraPublicBone            = B_CARGO
    ExtraPublicBone            = B_BANNER
	
    DefaultModelConditionState
		Model = dbelderhall_SKN	
		WeaponLaunchBone = PRIMARY ARROW		
    End
    
   IdleAnimationState
		StateName = STATE_None
		Animation = IDLE
			AnimationName		=	dbelderhall_SKL.dbelderhall_idl
			AnimationMode			=	ONCE	
			AnimationBlendTime = 0
			AnimationPriority	= 8
		End		
		Animation = IDLE
			AnimationName		=	dbelderhall_SKL.dbelderhall_idb
			AnimationMode			=	ONCE	
			AnimationBlendTime = 0
			AnimationPriority	= 10
		End
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "BeingConstructed" then 
			    ; Don't play completed sound when canceling build-in-progress or when
			    ; destroyed halfway
			    if not CurDrawableModelcondition( "DYING" ) then 
					CurDrawablePlaySound("M_DwarfEVA_BuiltHallOfElders")
				end
			end
		EndScript
	End


    ;------------ New Build Up States coming soon. 
    ModelConditionState   = AWAITING_CONSTRUCTION 
      Model               = dbelderhall_bld
;		ParticleSysBone	  = NONE BuildingDoughnutCloud
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           =  dbelderhall_bld
        AnimationName     =  dbelderhall_bld.dbelderhall_bld
        AnimationMode     = MANUAL
        AnimationBlendTime = 0
      End
	  Flags				  = START_FRAME_FIRST
    End

    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = dbelderhall_bld
		ParticleSysBone   = CONSTDUSTBONE01 BuildingContructDust FollowBone:Yes
    End;
    AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation           = dbelderhall_bld
			AnimationName     = dbelderhall_bld.dbelderhall_bld
			AnimationMode     = MANUAL
			AnimationBlendTime = 0
		End
		Flags				  = START_FRAME_FIRST
		StateName			  = BeingConstructed
		BeginScript
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
	
		EndScript
    End
    
	    
        ;--damaged building
      ModelConditionState  = DESTROYED_FRONT
      Model         = dbelderhall_d2  
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingLarge
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
    End
    AnimationState = DESTROYED_FRONT
      BeginScript
        ;CurDrawableHideSubObject("GBBARRACKSDP1")
      EndScript
    End
    
        ModelConditionState  = DESTROYED_RIGHT
      Model         = dbelderhall_d2 
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingLarge
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_RIGHT
      BeginScript
        ;CurDrawableHideSubObject("GBBARRACKSDP2")
      EndScript
    End
    

    ModelConditionState  = DESTROYED_BACK
      Model         = dbelderhall_d2
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingLarge
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_BACK
      BeginScript
        ;CurDrawableHideSubObject("GBBARRACKSDP3")
      EndScript
    End

	ModelConditionState  = DESTROYED_LEFT
      Model         = dbelderhall_d2  
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingLarge
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
    End
    
    AnimationState = DESTROYED_LEFT
      BeginScript
        ;CurDrawableHideSubObject("GBBARRACKSDP4")
      EndScript
    End
    
    
    ModelConditionState  = DAMAGED
      Model         = dbelderhall_d1  
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingMedium
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
    End
    AnimationState = DAMAGED
	EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = dbelderhall_d2  
		ParticleSysBone FireSmall01 FireBuildingLarge
		ParticleSysBone FireSmall02 FireBuildingLarge
		ParticleSysBone FireSmall03 FireBuildingMedium
		ParticleSysBone FireSmall04 FireBuildingMedium
		ParticleSysBone FireSmall05 SmokeBuildingLarge
	
    End
    AnimationState = REALLYDAMAGED
	EnteringStateFX	= FX_BuildingReallyDamaged
    End

    ModelConditionState  = RUBBLE
      Model         = dbelderhall_d2  
      ParticleSysBone FireSmall05 SmokeBuildingLarge
    End
    
    AnimationState = RUBBLE
      BeginScript
        ;CurDrawableHideSubObject("GBBARRACKSDP1")
        ;CurDrawableHideSubObject("GBBARRACKSDP2")
        ;CurDrawableHideSubObject("GBBARRACKSDP3")
        ;CurDrawableHideSubObject("GBBARRACKSDP4")
      EndScript
    End

    ModelConditionState  = POST_RUBBLE
		Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState  = POST_COLLAPSE
		 Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End
End

  Draw = W3DFloorDraw ModuleTag_DrawFloor    
		StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
     ModelName = dbelderhall_Bib
  End
  

  PlacementViewAngle  = 270

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:DwarfElderHall
  Description 	      = OBJECT:DwarfElderHallDescription
  Side                = Dwarves
  EditorSorting       = STRUCTURE
  ThreatLevel = 1.0
 
  BuildCost           = M_DWARVES_ELDERHALL_BUILDCOST
  BuildTime           = M_DWARVES_ELDERHALL_BUILDTIME          ; in seconds
  BountyValue         = M_DWARVES_ELDERHALL_BOUNTY_VALUE
  VisionRange         = M_DWARVES_ELDERHALL_VISIONRANGE          ; Shroud clearing distance
  ShroudClearingRange = M_DWARVES_ELDERHALL_SHROUD_CLEAR


  
  ArmorSet
    Conditions        = None
    Armor             = DwarfStructureArmor
    ;DamageFX          = StructureDamageFXNoShake
  End
  CommandSet          = DwarfElderHallCommandSet

  
	WeaponSet
		Conditions			= None
	End
 

  ; *** AUDIO Parameters ***

	VoiceSelect		= DwarfHallofEldersSelected

	SoundOnDamaged		= BuildingLightDamageStone
	SoundOnReallyDamaged	= BuildingHeavyDamageStone
 
	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

	UnitSpecificSounds
		UnderConstruction		= BuildingConstructionLoop  ; Built first time
		; UnderRepairFromDamage	= NoSound					; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End


  ; *** ENGINEERING Parameters ***

  RadarPriority       = STRUCTURE
  KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY NEED_BASE_FOUNDATION MADE_OF_STONE
 
  Behavior            = GettingBuiltBehavior ModuleTag_04
    WorkerName	= DwarfWorkerNoSelect
  End

  Behavior = CastleMemberBehavior ModuleTag_CMB
  End 


;  Behavior = OpenContain OpenContainModuleTag_01
;    ContainMax         = 1
; 	AllowAlliesInside  = Yes
; 	AllowEnemiesInside = No
; 	AllowNeutralInside = No
;  End

  Body                    = ActiveBody ModuleTag_05
    MaxHealth             = M_DWARVES_ELDERHALL_HEALTH
    MaxHealthDamaged      = M_DWARVES_ELDERHALL_HEALTH_DAMAGED
	MaxHealthReallyDamaged  = M_DWARVES_ELDERHALL_HEALTH_REALLY_DAMAGED
    DamageCreationList = OCL_BuildingDamageList01 CATAPULT_ROCK
    
    ;DamageCreationList = OCL_GBBarracksN2D2_Chunk1 CATAPULT_ROCK FRONT_DESTROYED
    ;DamageCreationList = OCL_GBBarracksN2D2_Chunk2 CATAPULT_ROCK RIGHT_DESTROYED
    ;DamageCreationList = OCL_GBBarracksN2D2_Chunk3 CATAPULT_ROCK BACK_DESTROYED
    ;DamageCreationList = OCL_GBBarracksN2D2_Chunk4 CATAPULT_ROCK LEFT_DESTROYED
    
  End

  Behavior = ProductionUpdate ModuleTag_06
    ; nothing
  End

  Behavior = QueueProductionExitUpdate ModuleTag_07
    UnitCreatePoint    = X:0 Y:41 Z:2
    NaturalRallyPoint  = X:0 Y:80 Z:0.0
    ExitDelay = 750
  End
  

	
	; 2 Warriors when Escalation 2 is purchased
	Behavior = SpawnBehavior ModuleTag_EscalationLevel2
		TriggeredBy			= Upgrade_TechnologyDwarfCraftsmanEscalation2
		SpawnNumber			= 2
		InitialBurst			= 1
		SpawnTemplateName		= DwarfGarrisonedWarrior
		SpawnReplaceDelay		= 30000
	End
	
	Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DwarfGarrisonedBuildingDeath
	End	
	
	Behavior = AttributeModifierAuraUpdate ModuleTag_ExpPower
		StartsActive	= Yes ;If no, requires upgrade to turn on.
		BonusName		= DwarfElderHallExperience
		RefreshDelay	= 3000
		Range			= 999999999
		AllowSelf        = No
		ObjectFilter	= ANY +INFANTRY +CAVALRY -MACHINE -IMMOBILE +HERO    
	End
	

  
  Behavior                  = StructureCollapseUpdate ModuleTag_08
    MinCollapseDelay        = 000
    MaxCollapseDelay        = 000
    CollapseDamping         = .5
    MaxShudder              = 0.6
    MinBurstDelay           = 250
    MaxBurstDelay           = 800
    BigBurstFrequency       = 4
    FXList                  = INITIAL   FX_StructureMediumCollapse
    FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
	DestroyObjectWhenDone	= Yes
	CollapseHeight			= 155
  End
   
	

  Behavior                  = BuildingBehavior BuildingModuleTag
   ; NightWindowName         = WINDOW_N01
   ; FireWindowName         = WINDOW_F01
   ; GlowWindowName	    = WINDOW_G01
   ; FireName		    = FIRE01
  End

	Behavior = SubObjectsUpgrade ModuleTag_HideAll
		TriggeredBy		= Upgrade_StructureLevel1
		HideSubObjects	= LVL2 LVL3
	End

	Behavior = SubObjectsUpgrade ModuleTag_ShowWallsAndFlag
		TriggeredBy		= Upgrade_StructureLevel2
		ShowSubObjects	= LVL2 
	End

	Behavior = SubObjectsUpgrade ModuleTag_ShowTowersAndHideFlag
		TriggeredBy		= Upgrade_StructureLevel3
		ShowSubObjects	= LVL2 LVL3
	End


 
  Geometry              = CYLINDER
  GeometryMajorRadius   = 8.0
  GeometryMinorRadius   = 8.0
  GeometryHeight        = 10

  ;; These are the actual building geometry pieces
  AdditionalGeometry    = BOX
  GeometryName			= Geom_Orig
  GeometryMajorRadius   = 35
  GeometryMinorRadius   = 50.5
  GeometryHeight        = 26.5
  GeometryOffset		= X:0.27 Y:9.01 Z:0

 


  GeometryIsSmall       = No
  
  Shadow                = SHADOW_VOLUME
  BuildCompletion		= PLACED_BY_PLAYER
  
  ; All geometry points good
  AttackContactPoint = X:0 			Y:60.57 Z:0
  GeometryContactPoint = X:17.78 	Y:25.78 Z:0 Repair
  GeometryContactPoint = X:-19.78 	Y:25.78 Z:0 Repair
  GeometryContactPoint = X:0 		Y:60.57 Z:0 Repair
  GeometryContactPoint = X:0 		Y:60.57 Z:0 Bomb
  GeometryContactPoint = X:35.2		Y:43.3	Z:0		Repair
  GeometryContactPoint = X:-32.7	Y:43.3	Z:0		Repair
  GeometryContactPoint = X:-32.1	Y:57.2	Z:0
  GeometryContactPoint = X:33		Y:57.2	Z:0
  GeometryContactPoint = X:18.76	Y:43.72	Z:26.6	Swoop
  GeometryContactPoint = X:-18.76	Y:43.72	Z:26.6	Swoop

End
