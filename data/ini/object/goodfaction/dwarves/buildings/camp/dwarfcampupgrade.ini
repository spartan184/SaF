;----------------------------------------------------------------------------------------------
; This is the demonic file for the dwarf camp upgrade object. it's like the devil, it really is. contains the tower, the flag and the ravenry
;----------------------------------------------------------------------------------------------
Object DwarfCampUpgrade

	; *** ART Parameters ***
	SelectPortrait         = BPEDwarf_Foundation2
	; **** this draw module is for the raven roost
	Draw = W3DScriptedModelDraw Draw_RavenRoost
		OkToChangeModelColor = No
		AffectedByStealth = No

		; ****** default state
		DefaultModelConditionState
			Model				= dbcampurave_skn
		End

		; ****** worldbuilder look
		ModelConditionState = WORLD_BUILDER
  			Model = dbcampurave_skn
  		End

		IdleAnimationState
			StateName = Complete
			BeginScript
				CurDrawableHideModule("Draw_RavenRoost")
			EndScript
		End


		ModelConditionState  = SOLD
			Model = dbcampurave_bld  
		End
		; ****** this is the build anim played backward when sold
		AnimationState = SOLD
			Animation
				AnimationName = dbcampurave_bld.dbcampurave_bld
				AnimationMode = ONCE_BACKWARDS
				AnimationSpeedFactorRange = 3.0 3.0
			End
			Flags = START_FRAME_LAST
			EnteringStateFX = FX_BuildingContructDustCastles
		End


		; ****** when damaged switch to dbcampurave_d1
		ModelConditionState  = UPGRADE_TREBUCHET DAMAGED
			Model         = dbcampurave_D1  
		End
	    
		AnimationState = UPGRADE_TREBUCHET DAMAGED
		End
	
		; ****** when really damaged switch to dbcampurave_d2 and play animation
		ModelConditionState  = UPGRADE_TREBUCHET REALLYDAMAGED
			Model         = dbcampurave_D2
		End
		
		AnimationState = UPGRADE_TREBUCHET REALLYDAMAGED
       		Animation				=	ReallyDamagedanimation
				AnimationName		=	 dbcampurave_D2.dbcampurave_D2
				AnimationMode		=	ONCE
				AnimationSpeedFactorRange	= 1.5 1.5
   			End

		End
		; ****** when killed switch to dbcampurave_d3 and play animation
		ModelConditionState  = UPGRADE_TREBUCHET RUBBLE
		Model         = dbcampurave_D3
		End
	    
		AnimationState = UPGRADE_TREBUCHET RUBBLE
			StateName = Complete
			Animation				=	Death
				AnimationName		=	dbcampurave_D3.dbcampurave_D3
				AnimationMode		=	ONCE
				AnimationSpeedFactorRange	= 1.5 1.5
			End
	
			EnteringStateFX	= FX_WallDie
		End      

		ModelConditionState  = UPGRADE_TREBUCHET POST_RUBBLE
			Model         = None
		End

		ModelConditionState  = UPGRADE_TREBUCHET POST_COLLAPSE
			Model         = None
		End		
		
		; ****** when building, let's build
		TransitionState = TRANS_IdleToBuild
			Animation
				AnimationName				= dbcampurave_bld.dbcampurave_bld
				AnimationMode				= ONCE
				AnimationSpeedFactorRange	= M_DWARVES_CAMP_ROOST_BUILD_SPEED M_DWARVES_CAMP_ROOST_BUILD_SPEED
			End
			EnteringStateFX = FX_BuildingContructDustCastles
		End

		ModelConditionState   = UPGRADE_TREBUCHET
			Model               = dbcampurave_bld
		End
		
		AnimationState = UPGRADE_TREBUCHET
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Complete" then CurDrawableSetTransitionAnimState("TRANS_IdleToBuild") end
			EndScript
			Flags = START_FRAME_LAST
			Animation
				AnimationName = dbcampurave_bld.dbcampurave_bld
				AnimationMode = ONCE
			End
		End
	
	End
		
	;----------------------------------------------------------------------------------------------
;;
;;	Newly-created field: the OverrideTooltip field! Notes
;;
;;		So this field has limitations, first and foremost being that it should
;;	only be applied to one drawModule.  When objects are drawn, all drawModules are used; so
;;	if you add OverrideTooltips to multiple drawModules, the lowest one (defined in the ini)
;;	will always take precedence over any others.
;;
;;		ReferenceDisplayName is a keyword to the drawable which tells it to ... reference the
;;	DisplayName of the object.
;;

	; ***** this draw module is a picker object, hidden.
	Draw = W3DScriptedModelDraw Draw_Picker

		; Don't want to change the hidden state of this when the postern gate is stealthed.
		AffectedByStealth = No
	
		DefaultModelConditionState
			Model = dbcamppick_skn
		End
		
	End
	
	;----------------------------------------------------------------------------------------------
	; ***** this draw module is the plot icon that is hidden/unhidden when various upgrades are purchased
	Draw = W3DScriptedModelDraw Draw_Decal

		AffectedByStealth = No
	
		DefaultModelConditionState
			Model = dbfoundcamp_skn
		End

		; ********* normally draw picker + decal
		IdleAnimationState
			BeginScript
				CurDrawableShowModule("Draw_Decal")
				CurDrawableShowModule("Draw_Picker")
			EndScript
		End
		
		; ********* takes a bit for the decal to show up when wall is built, but you can still click
		AnimationState  = JUST_BUILT
			BeginScript
				CurDrawableHideModule("Draw_Decal")
				CurDrawableShowModule("Draw_Picker")
			EndScript
		End
		
		; ********* hide the decal for a bit when the object is sold
		AnimationState  = SOLD
			BeginScript
				CurDrawableHideModule("Draw_Decal"); since the command is not yet available
			EndScript
		End

		; ********* when wall is gone, hide decal and picker
		AnimationState  = RUBBLE
			BeginScript
				CurDrawableHideModule("Draw_Decal")
				CurDrawableHideModule("Draw_Picker")
			EndScript
		End
		
		; ********* when we upgrade to watchtower, draw tower and hide all others
		AnimationState  = UPGRADE_GARRISON
			BeginScript
				CurDrawableShowModule("Draw_Watchtower")
				
				CurDrawableHideModule("Draw_Decal")					
				CurDrawableHideModule("Draw_Banner")
				CurDrawableHideModule("Draw_RavenRoost")
				CurDrawableHideModule("Draw_Picker")
			EndScript
		End
		; ********* when we upgrade to ravens draw ravenry and hide all others
		AnimationState  = UPGRADE_TREBUCHET
			BeginScript
				CurDrawableShowModule("Draw_RavenRoost")
							
				CurDrawableHideModule("Draw_Decal")
				CurDrawableHideModule("Draw_Banner")
				CurDrawableHideModule("Draw_Watchtower")
				CurDrawableHideModule("Draw_Picker")
			EndScript
		End
		
		; ********* when we upgrade to banner, draw banner and hide all others
		AnimationState  = UPGRADE_POSTERN_GATE
			BeginScript
				CurDrawableShowModule("Draw_Banner")
							
				CurDrawableHideModule("Draw_Decal")
				CurDrawableHideModule("Draw_RavenRoost")
				CurDrawableHideModule("Draw_Watchtower")
				CurDrawableHideModule("Draw_Picker")
			EndScript
		End

	End

	
	;----------------------------------------------------------------------------------------------
	; ********* ok when we build a banner....
	Draw = W3DScriptedModelDraw Draw_Banner

		

		DefaultModelConditionState
			Model				= dbcampubnr_skn
		End

		IdleAnimationState
			BeginScript
				CurDrawableHideModule("Draw_Banner")
			EndScript
		End


		ModelConditionState  = SOLD
			Model = dbcampubnr_bld 
		End
		AnimationState = SOLD
			Animation
				AnimationName = dbcampubnr_bld.dbcampubnr_bld
				AnimationMode = ONCE_BACKWARDS
				AnimationSpeedFactorRange = 3.0 3.0
			End
			Flags = START_FRAME_LAST
			EnteringStateFX = FX_BuildingContructDustCastlesCentre
		End


		ModelConditionState  = UPGRADE_POSTERN_GATE DAMAGED
			Model         = dbcampubnr_D1  
		End
	    
		AnimationState = UPGRADE_POSTERN_GATE DAMAGED
	;      EnteringStateFX = FX_MinWallATransitionDamaged
		End

		ModelConditionState  = UPGRADE_POSTERN_GATE REALLYDAMAGED
		Model         = dbcampubnr_D2
		End
		AnimationState = UPGRADE_POSTERN_GATE REALLYDAMAGED
       		;Animation				=	ReallyDamagedanimation
			;	AnimationName		=	 dbcampubnr_D2.dbcampubnr_D2
			;	AnimationMode		=	ONCE
  			;End
	;        EnteringStateFX = FX_MinWallATransitionReallyDamaged
		End

		ModelConditionState  = UPGRADE_POSTERN_GATE RUBBLE
		Model         = dbcampubnr_D3
		End
	    
		AnimationState = UPGRADE_POSTERN_GATE RUBBLE
			Animation				=	Death
				AnimationName		=	dbcampubnr_D3.dbcampubnr_D3
				AnimationMode		=	ONCE
				AnimationSpeedFactorRange	= 2 2
			End
	;        EnteringStateFX = FX_MinWallATransitionRubble
			EnteringStateFX	= FX_WallDie
		End      

		ModelConditionState  = UPGRADE_POSTERN_GATE POST_RUBBLE
			Model         = None
		End

		ModelConditionState  = UPGRADE_POSTERN_GATE POST_COLLAPSE
			Model         = None
		End		
		
		ModelConditionState   = UPGRADE_POSTERN_GATE
			Model               = dbcampubnr_bld
		End
		
		AnimationState = UPGRADE_POSTERN_GATE
			Animation
				AnimationName = dbcampubnr_bld.dbcampubnr_bld
				AnimationMode = ONCE
				AnimationSpeedFactorRange	= M_DWARVES_CAMP_BANNER_BUILD_SPEED M_DWARVES_CAMP_BANNER_BUILD_SPEED
			End
			EnteringStateFX = FX_BuildingContructDustCastlesCentre
		End
	
	End
		
	;----------------------------------------------------------------------------------------------
	; ************** and finally, what about the tower?
	Draw = W3DScriptedModelDraw Draw_Watchtower

		; ************** arrow bones
		ExtraPublicBone = ARROW01
		ExtraPublicBone = ARROW02
		ExtraPublicBone = ARROW03
		ExtraPublicBone = ARROW04


		; Don't want to change the hidden state of this when the postern gate is stealthed.
		AffectedByStealth = No

		DefaultModelConditionState
			Model				= dbcampuwtwr_skn
			WeaponLaunchBone    = PRIMARY ARROW
		End
		
		; This idle state is required simply to make sure the tower visual
		; mesh is invisible so we can't pick it when it's underground.
		; The actual state is not needed.
		IdleAnimationState
			StateName = Complete
			BeginScript
				CurDrawableHideModule("Draw_Watchtower")
			EndScript
		End
		
		ModelConditionState  = SOLD
			Model = dbcampuwtwr_bld
		End
		AnimationState = SOLD
			Animation
				AnimationName = dbcampuwtwr_bld.dbcampuwtwr_bld
				AnimationMode = ONCE_BACKWARDS
				AnimationSpeedFactorRange = 10 10
			End
			Flags = START_FRAME_LAST
			EnteringStateFX = FX_BuildingContructDustCastles
		End
		
		
		
		
		ModelConditionState  = UPGRADE_GARRISON DAMAGED
			Model         = dbcampuwtwr_d1
		End
	    
		AnimationState = UPGRADE_GARRISON DAMAGED
	;      EnteringStateFX = FX_MinWallATransitionDamaged
		End

		ModelConditionState  = UPGRADE_GARRISON REALLYDAMAGED
			Model         = dbcampuwtwr_D2
		End
		
		AnimationState = UPGRADE_GARRISON REALLYDAMAGED
       		Animation				=	ReallyDamagedanimation
				AnimationName		=	 dbcampuwtwr_D2.dbcampuwtwr_D2
				AnimationMode		=	ONCE
  			End
	;        EnteringStateFX = FX_MinWallATransitionReallyDamaged
		End

		ModelConditionState  = UPGRADE_GARRISON RUBBLE
			Model         = dbcampuwtwr_D3
		End
	    
		AnimationState = UPGRADE_GARRISON RUBBLE
			StateName = Complete
			Animation				=	Death
				AnimationName		=	dbcampuwtwr_D3.dbcampuwtwr_D3
				AnimationMode		=	ONCE
			End
			EnteringStateFX	= FX_WallDie
		End      

		ModelConditionState  = UPGRADE_GARRISON POST_RUBBLE
			Model         = None
		End

		ModelConditionState  = UPGRADE_GARRISON POST_COLLAPSE
			Model         = None
		End		

		TransitionState				=	TRANS_IdleToBuild
			Animation
				AnimationName				= dbcampuwtwr_bld.dbcampuwtwr_bld
				AnimationMode				= ONCE
				AnimationSpeedFactorRange	= M_DWARVES_CAMP_WATCHTOWER_BUILD_SPEED M_DWARVES_CAMP_WATCHTOWER_BUILD_SPEED 
			End
			EnteringStateFX = FX_BuildingContructDustCastles
		End

		ModelConditionState   = UPGRADE_GARRISON
			Model               = dbcampuwtwr_bld
		End
		
		; Just play the last frame, so we don't get the build anim again.
		AnimationState = UPGRADE_GARRISON
			
			; If we're complete then transition via showing and build anim.
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Complete" then CurDrawableSetTransitionAnimState("TRANS_IdleToBuild") end
			EndScript
		
			Flags = START_FRAME_LAST
			Animation
				AnimationName = dbcampuwtwr_bld.dbcampuwtwr_bld
				AnimationMode = ONCE
			End
		End

	End


	;----------------------- AUDIO -------------------------

	VoiceSelect				= Gui_PlotSelect

	SoundOnDamaged			= BuildingLightDamageStone
	SoundOnReallyDamaged		= BuildingHeavyDamageStone

	VoiceSelectUnderConstruction	= BuildingEvilVoiceSelectUnderConstruction


	; Change selection sounds based on upgrades
	ClientBehavior = UpgradeSoundSelectorClientBehavior ModuleTag_UpgradeSoundSelector
		SoundUpgrade = Upgrade_CampRavenRoost								; EVERYTHING on this line must be present
			ExcludedUpgrades = Upgrade_CampWatchtower Upgrade_CampBanner		; NOTHING on this line can be present
			VoiceSelect = DwarfCampRoostSelected
		End
		
		SoundUpgrade = Upgrade_CampWatchtower								; EVERYTHING on this line must be present
			ExcludedUpgrades = Upgrade_CampRavenRoost Upgrade_CampBanner		; NOTHING on this line can be present
			VoiceSelect = GondorBattleTowerSelect
		End
  
		SoundUpgrade = Upgrade_CampBanner							; EVERYTHING on this line must be present
			ExcludedUpgrades = Upgrade_CampRavenRoost Upgrade_CampWatchtower		; NOTHING on this line can be present
			VoiceSelect = GondorArmorySelect
		End
	End

	
	; ***DESIGN parameters ***
	DisplayName		= OBJECT:DwarfCampWallUpgrade
	EditorSorting	= STRUCTURE
	Side			= Dwarves
	IsTrainable		= No

	ArmorSet
		Conditions	= None
		Armor		= DwarfCampWallUpgrade
		DamageFX	= MinasWallADamageFX
	End
	
	ArmorSet
		Conditions	= AS_TOWER
		Armor		= DwarfCampWallUpgradeTower
		DamageFX	= MinasWallADamageFX
	End
	ArmorSet
		Conditions	= PLAYER_UPGRADE
		Armor		= DwarfCampWallUpgradeOther
		DamageFX	= MinasWallADamageFX
	End

	; -- Default no weapons
	WeaponSet
		Conditions			= None
	End
	; --- Weaponset for tower
	WeaponSet
		Conditions			= PLAYER_UPGRADE
		Weapon				= PRIMARY DwarfCampWallUpgradeBow
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	
	
	Behavior = ProductionUpdate ProductionUpdateModuleTag
		; nothing, but is required if we have any Object-level Upgrades!
	End
	
	Body				= ActiveBody ModuleTag_02
		MaxHealth		= M_DWARVES_CAMP_WALL_UPGRADE_HEALTH
	End
	
	; WATCHTOWER --- Commandset upgrade
	Behavior = CommandSetUpgrade CampWatchtowerCommandset
		TriggeredBy			= Upgrade_CampWatchtower
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
		CommandSet			= SellableCommandSet
	End
	
	; WATCHTOWER --- Weaponset upgrade
	Behavior = WeaponSetUpgrade WeaponSetUpgradeModuleTag
		TriggeredBy			= Upgrade_CampWatchtowerBow
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
		RequiresAllTriggers = Yes
	End
	
	; WATCHTOWER --- Disable weapons while building
	Behavior = ObjectCreationUpgrade EnableArrows
		TriggeredBy		= Upgrade_CampWatchtower
		ConflictsWith	= Upgrade_CampBanner Upgrade_CampRavenRoost
		Delay			= M_DWARVES_CAMP_WATCHTOWER_ATTACK_DELAY
		
		GrantUpgrade	= Upgrade_CampWatchtowerBow
		DestroyWhenSold = Yes
		;DeathAnimAndDuration = AnimState:DEATH_2 AnimTime:999999
		;Offset			= X:50.0 Y:0.0 Z:68
	End
	
	; WATCHTOWER --- OLD! --- Disable weapons while building
	; Behavior = AttributeModifierUpgrade DontShootWhilstBuilding
	;	TriggeredBy			= Upgrade_CampWatchtower
	;	ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
	;	AttributeModifier	= WallUpgrade_DwarfCampWatchtower_Enabler
	; End
	
	; WATCHTOWER --- Build sound loop
	Behavior = AudioLoopUpgrade ModuleTag_WatchtowerBuildLoop
		TriggeredBy			= Upgrade_CampWatchtower
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
		SoundToPlay			= BuildingConstructionLoop
		KillOnDeath         = Yes
		KillAfterMS			= 16000  ; Should match the length of the build-up animation [Or a little shorter since sounds take a little while to die]
	End
	
	; WATCHTOWER --- Armorset upgrade
	Behavior = ArmorUpgrade ArmorUpgradeModuleTag1
		TriggeredBy			= Upgrade_CampWatchtower
	    ArmorSetFlag		= AS_TOWER
	End
	
	
	; WATCHTOWER --- Tooltip upgrade
	Behavior = TooltipUpgrade ModuleTag_GarrisonTooltip
		TriggeredBy			= Upgrade_CampWatchtower
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
		DisplayName				= OBJECT:DwarfCampWatchtower
		Description				= OBJECT:DwarfCampWatchtowerDescription
	End
	
	; ********* wtf is this?
	; This isn't a geom upgrade, we just need something that doesn't do anything
	; to hook onto this upgrade.
	;Behavior = GeometryUpgrade ModuleTag_FireArrows
	;	TriggeredBy			= Upgrade_BattleTowersToUseFireArrows
	;	ConflictsWith		= Upgrade_PosternGate Upgrade_TrebuchetTurret
	;End
	
	; WATCHTOWER --- Geometry upgrade
	Behavior = GeometryUpgrade ModueTag_WatchtowerGeom
		TriggeredBy			= Upgrade_CampWatchtower
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampRavenRoost
		ShowGeometry		= TowerGeom
		HideGeometry		= BannerGeom RavenGeom
		CustomAnimAndDuration	= AnimState:UPGRADE_GARRISON AnimTime:0
	End
	
	; RAVEN ROOST --- Geometry upgrade
	Behavior = GeometryUpgrade ModueTag_RavenRoostGeom
		TriggeredBy			= Upgrade_CampRavenRoost
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		ShowGeometry		= RavenGeom
		HideGeometry		= TowerGeom BannerGeom
		CustomAnimAndDuration	= AnimState:UPGRADE_TREBUCHET AnimTime:0
		
	End
	
	; RAVEN ROOST --- Build Sound Loop
	Behavior = AudioLoopUpgrade ModuleTag_RavenRoostBuildLoop
		TriggeredBy			= Upgrade_CampRavenRoost
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		SoundToPlay			= BuildingConstructionLoop
		KillOnDeath         = Yes
		KillAfterMS			= 7500  ; Should match the length of the build-up animation [Or a little shorter since sounds take a little while to die]
	End
	
	; RAVEN ROOST --- Commandset Upgrade
	Behavior = CommandSetUpgrade ModueTag_RavenRoostCommandSet
		TriggeredBy			= Upgrade_CampRavenRoost
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		CommandSet			= SellableCommandSet
	End
	
	; RAVEN ROOST --- Armor upgrade
	Behavior = ArmorUpgrade ArmorUpgradeModuleTag2
		TriggeredBy			= Upgrade_CampRavenRoost
	    ArmorSetFlag		= PLAYER_UPGRADE
	End
	
	; RAVEN ROOST --- Tooltip upgrade
	Behavior = TooltipUpgrade ModuleTag_RavenRoostTooltip
		TriggeredBy			= Upgrade_CampRavenRoost
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		DisplayName				= OBJECT:DwarfCampRavenRoost
		Description				= OBJECT:DwarfCampRavenRoostDescription
	End
	
	; RAVEN ROOST --- don't spawn a raven until we're built...
	Behavior = ObjectCreationUpgrade HasRavenBehavior
		TriggeredBy			= Upgrade_CampRavenRoost
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		Delay			= M_DWARVES_CAMP_ROOST_ATTACK_DELAY
		
		GrantUpgrade	= Upgrade_CampRavenRoostExists
		DestroyWhenSold = Yes
	End
	
	; RAVEN ROOST -- Spawn Slaved Raven
	Behavior = SpawnBehavior ModuleTag_SpawnARaven
		TriggeredBy			= Upgrade_CampRavenRoostExists
		ConflictsWith		= Upgrade_CampBanner Upgrade_CampWatchtower
		SpawnNumber			= 1
		InitialBurst			= 1
		SpawnTemplateName		= DwarfRoostRaven
		SpawnReplaceDelay		= 30000 ; 30 seconds
	End
	
	; RAVEN ROOOST -- Needed for spawn to work
	Behavior = QueueProductionExitUpdate ModuleTag_QueuePEU
		UnitCreatePoint   = X:16.37 Y:-2.5 Z:70.8
		NaturalRallyPoint = X:-7.5 Y:-2.5 Z:70.8;NaturalRallyPointX must always match GeometryMajorRadius!
		ExitDelay = 300 ;Handles delays between units if multiple produced at a time.
	End
	
	; BANNER --- Commandset upgrade
	Behavior = CommandSetUpgrade ModueTag_BannerCommandSet
		TriggeredBy			= Upgrade_CampBanner
		ConflictsWith		= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		CommandSet			= SellableCommandSet
	End
	
	; BANNER --- ????? upgrade
	Behavior = AttributeModifierUpgrade DontShootWhilstBuilding3	; Required for the buiding canceling - don't ask.
		TriggeredBy			= Upgrade_CampBanner
		ConflictsWith		= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		AttributeModifier	= PreventFromShooting
	End	
	
	; BANNER --- Geometry upgrade
	Behavior = GeometryUpgrade ModueTag_BannerGeom
		TriggeredBy			= Upgrade_CampBanner
		ConflictsWith		= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		ShowGeometry		= BannerGeom
		HideGeometry		= RavenGeom TowerGeom
		CustomAnimAndDuration	= AnimState:UPGRADE_POSTERN_GATE AnimTime:0
	End
	
	; BANNER --- Build Loop Sound
	Behavior = AudioLoopUpgrade ModuleTag_BannerBuildLoop
		TriggeredBy			= Upgrade_CampBanner
		ConflictsWith		= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		SoundToPlay			= BuildingConstructionLoop
		KillOnDeath         = Yes
		KillAfterMS			= 10500  ; Should match the length of the build-up animation [Or a little shorter since sounds take a little while to die]
	End
	
	; BANNER --- Tooltip upgrade
	Behavior = TooltipUpgrade ModuleTag_PosternGateTooltip
		TriggeredBy			= Upgrade_CampBanner
		ConflictsWith		= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		DisplayName				= OBJECT:DwarfCampRavenBanner
		Description				= OBJECT:DwarfCampRavenBannerDescription
	End
	
	; BANNER --- Armorset upgrade
	Behavior = ArmorUpgrade ArmorUpgradeModuleTag3
		TriggeredBy			= Upgrade_CampBanner
	    ArmorSetFlag		= PLAYER_UPGRADE
	End
	
	; BANNER --- Bonus enabler
	Behavior = AttributeModifierAuraUpdate ModuleTag_RavenLeadership
		TriggeredBy		= Upgrade_CampBanner
		ConflictsWith	= Upgrade_CampRavenRoost Upgrade_CampWatchtower
		StartsActive	= No
		BonusName		= DwarfCampWallBannerLeadership ;RohanWallPassiveLeadership
		RefreshDelay	= 1000
		;Range		= 120
		ObjectFilter	= ANY +INFANTRY +CAVALRY +MACHINE -IMMOBILE -HERO
	End	

	Behavior = CastleMemberBehavior ModuleTag_CMB
		StoreUpgradePrice = Yes ; We want to overload the refund price with any upgrades purchased.
		CountsForEvaCastleBreached = No   ; This is just the floating button
	End 
	
	Behavior = FoundationAIUpdate ModuleTag_FoundationAI
	End
	
	Behavior = WallUpgradeUpdate ModuleTag_Update
	End

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
 		AutoAcquireEnemiesWhenIdle	= Yes
 		MoodAttackCheckRate			= 250
		AILuaEventsList				= GarrisonableFunctions
 	End

 	Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
