;------------------------------------------------------------------------------ 
; Dwarf workshop ini
;-------------------------------------------------------------------------------------
Object DwarfWorkshop

	SelectPortrait = BPDwarf_Workshop
 
  Draw = W3DScriptedModelDraw ModuleTag_Draw
    OkToChangeModelColor  = Yes
    UseStandardModelNames = Yes
    StaticModelLODMode = no ; Will append M or L to the skin name depending on GameLOD
    DefaultModelConditionState
      Model = dbworkshop_skn
    End

	IdleAnimationState
	
		StateName = STATE_None
		Animation = IDLE
			AnimationName		=	 dbworkshop_SKL.dbworkshop_idla
			AnimationMode			=	ONCE	
			AnimationBlendTime = 0

		End		
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "BeingConstructed" then 
			    ; Don't play completed sound when canceling build-in-progress or when
			    ; destroyed halfway
			    if not CurDrawableModelcondition( "DYING" ) then 
					CurDrawablePlaySound("TDH_DwarfEVA_BuiltWorkshop")
				end
			end
		EndScript
	End



   ;-- building being constructed
    ModelConditionState   = AWAITING_CONSTRUCTION 
      Model               = dbworkshop_bld
;		ParticleSysBone	  = NONE BuildingDoughnutCloud
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           = dbworkshop_bld
        AnimationName     = dbworkshop_bld.dbworkshop_bld
        AnimationMode     = MANUAL
      End
	  Flags				  = START_FRAME_FIRST
    End

    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Model               = dbworkshop_bld
		ParticleSysBone   = DUSTBONE BuildingContructDust
    End;
    AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
      Animation           = dbworkshop_bld
        AnimationName     = dbworkshop_bld.dbworkshop_bld
        AnimationMode     = MANUAL
      End
	Flags				= START_FRAME_FIRST
	StateName			= BeingConstructed
		BeginScript
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
			CurDrawableHideSubObjectPermanently("V1")
			CurDrawableHideSubObjectPermanently("V2")
		EndScript
	  
	  
    End
	
        ;--damaged building
      ModelConditionState  = DESTROYED_FRONT
      Model         = dbworkshop_D1
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge
 
    End

    AnimationState = DESTROYED_FRONT
      BeginScript
        CurDrawableHideSubObject("dbworkshop_D2a")
      EndScript
    End
    
    ModelConditionState  = DESTROYED_RIGHT
      Model         = dbworkshop_D1
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge
   
    End

    AnimationState = DESTROYED_RIGHT
      BeginScript
        CurDrawableHideSubObject("dbworkshop_D2b")
      EndScript
    End
    

    ModelConditionState  = DESTROYED_BACK
      Model         = dbworkshop_D1
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge


    End

    AnimationState = DESTROYED_BACK
      BeginScript
        CurDrawableHideSubObject("dbworkshop_D2c")
      EndScript
    End

	ModelConditionState  = DESTROYED_LEFT
      Model         = dbworkshop_D1
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge

    End
    
    AnimationState = DESTROYED_LEFT
      BeginScript
        CurDrawableHideSubObject("dbworkshop_D2d")
      EndScript
    End
    
    
    ModelConditionState  = DAMAGED
      Model         = dbworkshop_D1
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge

	
    End
    AnimationState = DAMAGED
	EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
      Model         = dbworkshop_D2
		ParticleSysBone Fire01 FireBuildingSmall
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 FireBuildingMedium
		ParticleSysBone Fire04 FireBuildingLarge
		ParticleSysBone Fire05 SmokeBuildingLarge

	
    End
    AnimationState = REALLYDAMAGED
	EnteringStateFX	= FX_BuildingReallyDamaged
    End

    ModelConditionState  = RUBBLE
      Model         = dbworkshop_D2
      ParticleSysBone SmokeLarge01 SmokeBuildingLarge
    End
    
    AnimationState = RUBBLE
      BeginScript
        CurDrawableHideSubObject("dbworkshop_D2a")
        CurDrawableHideSubObject("dbworkshop_D2b")
        CurDrawableHideSubObject("dbworkshop_D2c")
        CurDrawableHideSubObject("dbworkshop_D2d")
      EndScript
    End

    ModelConditionState  = POST_RUBBLE
      Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End
        AnimationState = POST_RUBBLE
    End

    ModelConditionState  = POST_COLLAPSE
      Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End
        AnimationState = POST_COLLAPSE
    End      
  End

  Draw = W3DFloorDraw ModuleTag_DrawFloor    
		;StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
     ModelName = dbworkshop_Bib
  End
  

  ;PlacementViewAngle  = 0
 
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:DwarfWorkshop
  Description 	      = OBJECT:DwarfWorkshopDescription

  Side                = Dwarves
  EditorSorting       = STRUCTURE
  ThreatLevel = 1.0
 
  CommandSet          = DwarfWorkshopCommandSet
  BuildCost           = TDH_DWARVES_WORKSHOP_BUILDCOST
  BuildTime           = TDH_DWARVES_WORKSHOP_BUILDTIME
  BountyValue         = TDH_DWARVES_WORKSHOP_BOUNTY_VALUE
  VisionRange         = 160.0          ; Shroud clearing distance
  ShroudClearingRange = TDH_DWARVES_WORKSHOP_SHROUD_CLEAR

  ArmorSet
    Conditions        = None
    Armor             = DwarfStructureArmor
    ;DamageFX          = StructureDamageFXNoShake
  End


  ; *** AUDIO Parameters ***

	VoiceSelect		= GondorWorkshopSelect

	SoundOnDamaged		= BuildingLightDamageStone
	SoundOnReallyDamaged	= BuildingHeavyDamageStone

	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

	UnitSpecificSounds
		UnderConstruction		= BuildingConstructionLoop  ; Built first time
		; UnderRepairFromDamage	= NoSound					; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End

 
	; *** ENGINEERING Parameters ***

	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION MP_COUNT_FOR_VICTORY AUTO_RALLYPOINT FS_FACTORY
	 
	Behavior            = GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName		  = DwarfWorkerNoSelect
	End

	Behavior = CastleMemberBehavior ModuleTag_CMB
	End 

	Body                        = StructureBody ModuleTag_05
		MaxHealth         		    = TDH_DWARVES_WORKSHOP_HEALTH
		MaxHealthDamaged  		    = TDH_DWARVES_WORKSHOP_HEALTH_DAMAGED
		MaxHealthReallyDamaged 	  	= TDH_DWARVES_WORKSHOP_HEALTH_REALLY_DAMAGED
	        
		DamageCreationList = OCL_BuildingDamageList01 CATAPULT_ROCK
		;DamageCreationList = OCL_GBStable_Chunk1 CATAPULT_ROCK FRONT_DESTROYED
		;DamageCreationList = OCL_GBStable_Chunk2 CATAPULT_ROCK RIGHT_DESTROYED
		;DamageCreationList = OCL_GBStable_Chunk3 CATAPULT_ROCK BACK_DESTROYED
		;DamageCreationList = OCL_GBStable_Chunk4 CATAPULT_ROCK LEFT_DESTROYED
	    
	End
  
	Behavior                  = BuildingBehavior BuildingModuleTag
	 NightWindowName         = dbworkshopN
	; FireWindowName         = WINDOW_F01
	; GlowWindowName	    = WINDOW_G01
	; FireName		    = FIRE01
	End


	Behavior                  = StructureCollapseUpdate ModuleTag_06
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight			= 120
	End

	Behavior = ProductionUpdate ProductionUpdateModuleTag
		;;;UnitPreparationTime =8000;;;;;;;;;; 8.0 second prep needs to be set in THingTemplate, for Trebuchet, now
	End

	Behavior = QueueProductionExitUpdate QueueProductionModuleTag
		UnitCreatePoint    = X:-21.6 Y:-11.33 Z:0.0
		NaturalRallyPoint  = X:75.0 Y:-11.33 Z:0.0
		ExitDelay = 0
	End
	 Behavior = SpawnBehavior ModuleTag_EscalationLevel2
		TriggeredBy			= Upgrade_TechnologyDwarfCraftsmanEscalation2
		SpawnNumber			= 2
		InitialBurst			= 1
		SpawnTemplateName		= DwarfGarrisonedWarrior
		SpawnReplaceDelay		= 30000
	End
	
		Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DwarfGarrisonedBuildingDeath
	End	
	
 	Behavior = SubObjectsUpgrade ModuleTag_HideAll 
		TriggeredBy		= Upgrade_StructureLevel1
		HideSubObjects	= L2 L2B L3 L3B
	End
 	Behavior = SubObjectsUpgrade ModuleTag_ShowWalls 
		TriggeredBy		= Upgrade_StructureLevel2
		ShowSubObjects	= L2 L2B
		HideSubObjects	= L3 L3B
	End
	Behavior = SubObjectsUpgrade ModuleTag_ShowTowers 
		TriggeredBy		= Upgrade_StructureLevel3
		ShowSubObjects	= L2 L2B L3 L3B
	End

		
	Geometry				= BOX
    GeometryName			= Geom_Orig
  	GeometryMajorRadius		= 50.5
	GeometryMinorRadius		= 47
	GeometryHeight			= 31
	GeometryOffset			= X:-0.421 Y:-0.25 Z:0	
		
	AdditionalGeometry		= BOX
	GeometryName			= Geom_Orig
	GeometryMajorRadius		= 12
	GeometryMinorRadius		= 11
	GeometryHeight			= 22
	GeometryOffset			= X:-32.5 Y:24.8 Z:30.1	

	; AdditionalGeometry		= BOX
    ; GeometryName			= Geom_V2
  	; GeometryMajorRadius		= 50.0
	; GeometryMinorRadius		= 37.5
	; GeometryHeight			= 25.0
	; GeometryOffset			= X:5 Y:0 Z:0	
		
	; AdditionalGeometry		= BOX
	; GeometryName			= Geom_V2
	; GeometryMajorRadius		= 12.5
	; GeometryMinorRadius		= 37.5
	; GeometryHeight			= 80.0
	; GeometryOffset			= X:-30 Y:0 Z:0	
		
	GeometryIsSmall       = No
	Shadow                = SHADOW_VOLUME
	BuildCompletion     = PLACED_BY_PLAYER
	
	GeometryContactPoint = X:-1.08	Y:30		Z:0			Repair
	GeometryContactPoint = X:-48.15	Y:-11.42	Z:0			Repair
	GeometryContactPoint = X:-23	Y:48	Z:0
	GeometryContactPoint = X:-27	Y:-44	Z:0
	GeometryContactPoint = X:-33.83		Y:26.19	Z:51.4	Swoop

End