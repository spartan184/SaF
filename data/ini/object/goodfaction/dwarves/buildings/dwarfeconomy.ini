;------------------------------------------------------------------------------
; Economy plot basic mine
;------------------------------------------------------------------------------
ChildObject DwarfMine MineInterface
 
    SelectPortrait         = BPDwarf_Mine
	DisplayName         = OBJECT:DwarfMine
	Description 	    = OBJECT:DwarfMineDescription
	Side                = Dwarves
	BuildCost           = M_DWARF_MINE_BUILDCOST
	BuildTime           = M_DWARF_MINE_BUILDTIME          ; in seconds
	BountyValue         = M_DWARF_MINE_BOUNTY_VALUE
	ShroudClearingRange = M_DWARF_MINE_SHROUD_CLEAR

	;;--- to allow generation of peasants ----------------
	CommandSet          = DwarfMineCommandSet

	;----------------------- AUDIO ------------------------

	VoiceSelect			= DwarfMineSelected


	;---------------------------------------------------

	WeaponSet
		Conditions			= None
	End

	Behavior            = GettingBuiltBehavior GetBuiltBehaviorTag
		WorkerName		  = DwarfWorkerNoSelect
	End

	; &&&&&&&&&&&&&&&&&&&&&& NEED NEW OCLS EVENTUALLY &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&
	Body                = StructureBody ModuleTag_05
		MaxHealth         		  	= M_DWARF_MINE_HEALTH
		MaxHealthDamaged  			= M_DWARF_MINE_HEALTH_DAMAGED
		MaxHealthReallyDamaged 		= M_DWARF_MINE_HEALTH_REALLY_DAMAGED
	    
		DamageCreationList = OCL_BuildingDamageList01 CATAPULT_ROCK
		;DamageCreationList = OCL_GBFarm_Chunk1 CATAPULT_ROCK FRONT_DESTROYED
		;DamageCreationList = OCL_GBFarm_Chunk2 CATAPULT_ROCK RIGHT_DESTROYED
		;DamageCreationList = OCL_GBFarm_Chunk3 CATAPULT_ROCK BACK_DESTROYED
		;DamageCreationList = OCL_GBFarm_Chunk4 CATAPULT_ROCK LEFT_DESTROYED
	End

	Behavior = AutoDepositUpdate AutoDepositModuleTag
		DepositTiming			= M_DWARF_MINE_MONEY_TIME   ; in milliseconds
		DepositAmount			= M_DWARF_MINE_MONEY_AMOUNT   ; cash amount to deposit every DepositTiming
		InitialCaptureBonus		= 0  ; no initial bonus
	    
		Upgrade					= Upgrade_TechnologyDwarfCraftsmanProspectors 
		UpgradeBonusPercent		= M_DWARVES_PROSPECTORS_PRODUCTION_INCREASE %
		UpgradeMustBePresent	= ANY +DwarfCraftsman
	End

	; Mines give a small discount on all infantry
	Behavior = CostModifierUpgrade ModuleTag_CostModifier
		StartsActive = Yes ; Run on build complete, not upgrade
		LabelForPalantirString = GUI:WEALTH_DISCOUNT
		ObjectFilter	= ANY +INFANTRY -HERO
		Percentage		= 0%
		Percentage		= -5%
		Percentage		= -10%
		Percentage		= -15%
		Percentage		= -20%
		Percentage		= -25%
	End
	
	KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION CASTLE_KEEP FS_FACTORY ATTACK_NEEDS_LINE_OF_SIGHT CAN_ATTACK MADE_OF_STONE
	
	; -- Escalation: gives 2x warrior, 2x archer for defence
	Behavior = SpawnBehavior ModuleTag_EscalationLevel1
		TriggeredBy			= Upgrade_TechnologyDwarfCraftsmanEscalation1
		SpawnNumber			= 2
		InitialBurst			= 1
		SpawnTemplateName		= DwarfGarrisonedWarrior
		SpawnReplaceDelay		= 30000
	End
	
	Behavior = SpawnBehavior ModuleTag_EscalationLevel1Archers
		TriggeredBy			= Upgrade_TechnologyDwarfCraftsmanEscalation1
		SpawnNumber			= 2
		InitialBurst			= 1
		SpawnTemplateName		=  DwarfGarrisonedArcher
		SpawnReplaceDelay		= 30000
	End
	
	Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DwarfGarrisonedBuildingDeath
	End	
	
	Behavior = ProductionUpdate ModuleTag_prod
	End

	Behavior = QueueProductionExitUpdate ModuleTag_queue
		UnitCreatePoint    = X:-7.0 Y:0.8 Z:0.0
		NaturalRallyPoint  = X:53.4 Y:40.1 Z:0.0
		ExitDelay = 300
	End
	
End

ChildObject DwarfMineMultiplayer DwarfMine
	SelectPortrait         = BPDwarf_Mine

	CommandSet          = DwarfMineCommandSet

	KindOf		= PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION MP_COUNT_FOR_VICTORY CASTLE_KEEP MADE_OF_STONE ATTACK_NEEDS_LINE_OF_SIGHT CAN_ATTACK
	RefundValue	= 100									; Half the cost of an economy plot.
	BuildCost	= M_DWARVES_FLAG_ECONOMY_UNPACK_COST		; Bit of a hack, but stops build canceling from getting the wrong price.

	Behavior = ExperienceLevelCreate CreateExperienceLevel
		LevelToGrant = 2
	End
  
End