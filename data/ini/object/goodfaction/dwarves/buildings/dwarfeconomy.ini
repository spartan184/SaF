; -------------------------------------
; dwarf ECONOMY PLOT buildings
; -------------------------------------

; -------------------------------------
; economy plot foundation
; -------------------------------------

Object DwarfEconomyFoundation
 
	SelectPortrait = BPRCamp_Plot
  ; *** ART Parameters ***

  
	Draw = W3DScriptedModelDraw ModuleTag_Draw2
	    DefaultModelConditionState
			Model = OBBFoundationX
		End
		ModelConditionState = WORLD_BUILDER
  			Model = RBSizeTemplate
  		End
		
	End
   Draw = W3DFloorDraw ModuleTag_Draw
      ModelName = dbfound_skn
  End
 
  PlacementViewAngle  = 90
  ;PlacementViewAngle  = 0
 
  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:DwarfEconomyFoundation
  Side                = Dwarves
  EditorSorting       = STRUCTURE
  ThreatLevel = 1.0
 
  BuildCost           = 1
  BuildTime           = 5.0           ; in seconds
  VisionRange         = 160.0          ; Shroud clearing distance
  ShroudClearingRange = 160

  CommandSet = DwarvesEconomyFoundationCommandSet

  ; *** AUDIO Parameters ***

  VoiceSelect = Gui_PlotSelect


  ; *** ENGINEERING Parameters ***

  RadarPriority       = STRUCTURE
  KindOf              = STRUCTURE SELECTABLE IMMOBILE BASE_FOUNDATION UNATTACKABLE MP_COUNT_FOR_VICTORY NO_COLLIDE DO_NOT_CLASSIFY
 
  Behavior            = FoundationAIUpdate ModuleTag_foundationAI
  End

  Behavior = CastleMemberBehavior ModuleTag_CMB
  End 

  Body                = ImmortalBody ModuleTag_05
    MaxHealth         = 15000.0
  End
 
  Geometry              = BOX
  GeometryMajorRadius   = 24.0
  GeometryMinorRadius   = 24.0
  GeometryHeight        = 0.8
  GeometryIsSmall       = No
  Shadow                = SHADOW_VOLUME
  BuildCompletion		= PLACED_BY_PLAYER
End

;------------------------------------------------------------------------------

; -------------------------------------
; basic MINE interface objcet
; -------------------------------------
Object MineInterface
 
  ; *** ART Parameters ***
  SelectPortrait         = BPDwarf_Mine

  ;day
  Draw = W3DScriptedModelDraw ModuleTag_Draw

    OkToChangeModelColor  = Yes
	UseStandardModelNames = No
    StaticModelLODMode = No ; Will append M or L to the skin name depending on GameLOD  
  
	DefaultModelConditionState
		Model = dbmine_skn

    End
    
    IdleAnimationState
	;	Animation = IDLE
	;		AnimationName		=	dbmine_skn.dbmine_skn
	;		AnimationMode			=	ONCE	
	;		AnimationBlendTime = 0
	;	End		
		BeginScript
			Prev = CurDrawablePrevAnimationState()
			if Prev == "BeingConstructed" then 
			    ; Don't play completed sound when canceling build-in-progress or when
			    ; destroyed halfway
			    if not CurDrawableModelcondition( "DYING" ) then 
					CurDrawablePlaySound("M_DwarfEVA_BuiltMine")
				end
			end
		EndScript
	End	

    ;-- building being constructed
    ModelConditionState   = AWAITING_CONSTRUCTION 
      Model               = dbmine_bld
;		ParticleSysBone	  = NONE BuildingDoughnutCloud
    End;
    AnimationState        = AWAITING_CONSTRUCTION
      Animation           = dbmine_bld
        AnimationName     = dbmine_bld.dbmine_bld
        AnimationMode     = MANUAL
      End
	  Flags				  = START_FRAME_FIRST
    End

    ModelConditionState   = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Model			  = dbmine_bld
		ParticleSysBone   = DUSTBONE BuildingContructDust
    End
	AnimationState        = ACTIVELY_BEING_CONSTRUCTED PARTIALLY_CONSTRUCTED
		Animation         = dbmine_bld
			AnimationName = dbmine_bld.dbmine_bld
			AnimationMode = MANUAL
		End
		Flags			= START_FRAME_FIRST
		StateName		= BeingConstructed
		BeginScript
			CurDrawablePlaySound("GondorBarracksBeginConstruction")
		EndScript
    End
	   
    
     ;--damaged building
	ModelConditionState  = DESTROYED_FRONT
		Model         = dbmine_D2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_FRONT
      BeginScript
        CurDrawableHideSubObject("GBFarm_01")
      EndScript
    End
    
	ModelConditionState  = DESTROYED_RIGHT
		Model         = dbmine_D2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire3 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_RIGHT
      BeginScript
        CurDrawableHideSubObject("GBFarm_02")
      EndScript
    End
    
	ModelConditionState  = DESTROYED_BACK
		Model         = dbmine_D2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 SmokeBuildingLarge
    End

    AnimationState = DESTROYED_BACK
      BeginScript
        CurDrawableHideSubObject("GBFarm_03")
      EndScript
    End

	ModelConditionState  = DESTROYED_LEFT
		Model         = dbmine_D2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 SmokeBuildingLarge
    End
    
    AnimationState = DESTROYED_LEFT
      BeginScript
        CurDrawableHideSubObject("GBFarm_04")
      EndScript
    End
    
    
    ModelConditionState  = DAMAGED
		Model         = dbmine_D1
		ParticleSysBone Fire01 FireBuildingMedium
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 SmokeBuildingLarge
    End
    AnimationState = DAMAGED
	EnteringStateFX	= FX_BuildingDamaged
    End

    ModelConditionState  = REALLYDAMAGED
		Model         = dbmine_D2
		ParticleSysBone Fire01 FireBuildingLarge
		ParticleSysBone Fire02 FireBuildingLarge
		ParticleSysBone Fire03 SmokeBuildingLarge
    End
    AnimationState = REALLYDAMAGED
		EnteringStateFX	= FX_BuildingReallyDamaged
    End

    ModelConditionState  = RUBBLE
		Model         = dbmine_D2
		ParticleSysBone Fire03 SmokeBuildingLarge
    End
    
    AnimationState = RUBBLE
      BeginScript
        CurDrawableHideSubObject("GBFarm_01")
        CurDrawableHideSubObject("GBFarm_02")
        CurDrawableHideSubObject("GBFarm_03")
        CurDrawableHideSubObject("GBFarm_04")
      EndScript
    End

    ModelConditionState  = POST_RUBBLE
		Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

    ModelConditionState  = POST_COLLAPSE
		 Model         = None
		ParticleSysBone NONE SmokeBuildingMediumRubble
    End

End
	Draw = W3DScriptedModelDraw Draw_BonusEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    AnimationState = ACTIVELY_BEING_CONSTRUCTED
	    End
		AnimationState = UPGRADE_ECONOMY_BONUS
			ParticleSysBone	= None GimliProspectorFX
		End
	End

  Draw = W3DFloorDraw ModuleTag_DrawFloor    
    	StaticModelLODMode = Yes		; THIS NEEDS TO BE COMMENTED OUT WHEN ENGINEERING ENABLES LOD'S IN THE FLOOR DRAW
    	
     ModelName = dbmine_Bib
  End

 
	; ***DESIGN parameters ***
	EditorSorting       = STRUCTURE
	ThreatLevel			= 1.0
	;PlacementViewAngle  = 180
	VisionRange         = 160.0          ; Shroud clearing distance

	;	*** dwarf stuctures are a little stronger
	ArmorSet
		Conditions		= None
		Armor			= DwarfStructureArmor
	End

	CommandSet          = DwarfMineCommandSet

	; *** AUDIO Parameters ***

	VoiceSelect			= DwarfMineSelected

	SoundOnDamaged			= BuildingLightDamageWood
	SoundOnReallyDamaged		= BuildingHeavyDamageWood

	VoiceSelectUnderConstruction	= BuildingGoodVoiceSelectUnderConstruction

	UnitSpecificSounds
		UnderConstruction		= BuildingConstructionLoop  ; Built first time
		; UnderRepairFromDamage	= NoSound					; Repaired No animation on the building, so don't bother playing sound
		UnderRepairFromRubble	= BuildingConstructionLoop	; Repaired from completely destroyed (not used???)
	End

 
	; *** ENGINEERING Parameters ***

	RadarPriority       = STRUCTURE
	KindOf              = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE NEED_BASE_FOUNDATION CASTLE_KEEP AUTO_RALLYPOINT  MADE_OF_STONE
	 											;MP_COUNT_FOR_VICTORY;removed so econ plots will not keep zombie games going

	Body = StructureBody ModuleTag_05
	End

	Behavior = CastleMemberBehavior ModuleTag_CMB
		; Special Eva events when attacked
		UnderAttackEvaEventIfKeep = EconPlotUnderAttack
		UnderAttackAllyEvaEventIfKeep = None
		
		; Special Eva events if an econ plot is taken down
		CampDestroyedOwnerEvaEvent = EconPlotDestroyed
		CampDestroyedAllyEvaEvent = AllyEconPlotDestroyed
		CampDestroyedAttackerEvaEvent = EnemyEconPlotDestroyed
	End 

	Behavior = AIUpdateInterface ModuleTag_SoWeCanUseWeapon
		AutoAcquireEnemiesWhenIdle	= Yes
		MoodAttackCheckRate			= 250
	End

	

	Behavior = SubObjectsUpgrade ModuleTag_HideAll
		TriggeredBy		= Upgrade_StructureLevel1
		HideSubObjects	= L2 L3
;		ShowSubObjects	= V1HIDE V2HIDE 
	End

 	Behavior = SubObjectsUpgrade ModuleTag_ShowWalls 
		TriggeredBy		= Upgrade_StructureLevel2
		ShowSubObjects	= L2
	;	HideSubObjects	= V2 V1HIDE
	End

	Behavior = SubObjectsUpgrade ModuleTag_ShowPillars 
		TriggeredBy		= Upgrade_StructureLevel3
		ShowSubObjects	= L2 L3 
		;HideSubObjects	= V1HIDE V2HIDE
	End
	
;	*** this building has no weapons!
;  	Behavior = WeaponSetUpgrade ModuleTag_Weapon
;		TriggeredBy		= Upgrade_StructureLevel3
;	End
   
	Behavior                  = StructureCollapseUpdate ModuleTag_07
		MinCollapseDelay        = 000
		MaxCollapseDelay        = 000
		CollapseDamping         = .5
		MaxShudder              = 0.6
		MinBurstDelay           = 250
		MaxBurstDelay           = 800
		BigBurstFrequency       = 4
		FXList                  = INITIAL   FX_StructureMediumCollapse
		FXList                  = ALMOST_FINAL  FX_StructureAlmostCollapse
		DestroyObjectWhenDone	= Yes
		CollapseHeight			= 66
	End
	   
	Behavior                  = BuildingBehavior BuildingModuleTag
		NightWindowName         = WINDOW_N01
		FireWindowName          = WINDOW_F01
		GlowWindowName			= WINDOW_G01
	;  FireName				= FIRE01
	End
	 
	;;---modules to allow generation of peasants------------, not required
	;Behavior = ProductionUpdate ModuleTag_Production
	;	GiveNoXP = Yes
	;End
	;Behavior = QueueProductionExitUpdate ModuleTag_Exit
	;	UnitCreatePoint    = X: 20.0 Y:0.0 Z:0.0
	;	NaturalRallyPoint  = X:-60.0 Y:0.0 Z:0.0
	;	ExitDelay = 350
	;End
	
	Geometry				= BOX
    GeometryName			= Geom_Orig
  	GeometryMajorRadius		= 37.0
	GeometryMinorRadius		= 60.5
	GeometryHeight			= 36.0
	GeometryOffset			= X:-4 Y:1 Z:0	
		
	AdditionalGeometry		= BOX
	GeometryName			= Geom_Orig
	GeometryMajorRadius		= 38
	GeometryMinorRadius		= 18
	GeometryHeight			= 36
	GeometryOffset			= X:30 Y:-25 Z:0	
	
	AdditionalGeometry		= BOX
	GeometryName			= Geom_Orig
	GeometryMajorRadius		= 31
	GeometryMinorRadius		= 54
	GeometryHeight			= 36
	GeometryOffset			= X:-37 Y:0.2 Z:0	
		
	GeometryIsSmall       = No
	Shadow                = SHADOW_VOLUME
	BuildCompletion     = PLACED_BY_PLAYER
	
	GeometryContactPoint = X:-0.276	Y:4.951	Z:0			Repair
	GeometryContactPoint = X:10.4		Y:-67	Z:0
	GeometryContactPoint = X:-17.5	Y:70.7	Z:0
	GeometryContactPoint = X:-12		Y:0		Z:32.2	Swoop

	Behavior = FireWeaponWhenDeadBehavior FireDeadTag1
		DeathTypes					= ALL
		StartsActive				= Yes
		ActiveDuringConstruction	= Yes
		DeathWeapon					= DwarfGarrisonedBuildingDeath
	End	
	
End

